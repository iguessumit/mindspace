<style>
/* Layout: one phone-width column. Fixed header, scrolling body, floating pill nav, bottom sheets.
   Colour: neutral surfaces + one UI accent (3 switchable styles); wellbeing has its own palette. */
:root{
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#000;--card:#0e0f11;--card2:#17181b;--line:#25272b;--fg:#f5f6f7;--mute:#8d9198;--dim:#5b5f66;--outer:#070708;
  --emerald:#ee1c14;--emerald-fg:#fff;--brick:#6e1d17;--red:#e0120a;
  --ok:#2fd28b;--mood:#f7c948;--warn:#f5b73b;--bad:#c4543f;--info:#5a9bf5;
  --w-mood:#f59e8b;--w-energy:#6ed0e0;--w-focus:#b39dff;--w-mot:#f3d36b;--w-sleep:#7c86ff;
  --m0:#5a47a8;--m1:#8a4aa0;--m2:#b0508a;--m3:#e8795f;--m4:#f7b267;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f2f2ee;--card:#fff;--card2:#eeeee9;--line:#deded7;--fg:#0b0c0d;--mute:#62666d;--dim:#9a9ea5;--outer:#dcdcd5;
  --mood:#d9a000;--emerald:#d40f08;--emerald-fg:#fff;--brick:#7a1812;--red:#d40f08;
  --w-mood:#d9644f;--w-energy:#1a98ae;--w-focus:#7254ec;--w-mot:#a88410;--w-sleep:#5058e0;
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f2ee;--card:#fff;--card2:#eeeee9;--line:#deded7;--fg:#0b0c0d;--mute:#62666d;--dim:#9a9ea5;--outer:#dcdcd5;
  --mood:#d9a000;--emerald:#d40f08;--emerald-fg:#fff;--brick:#7a1812;--red:#d40f08;
  --w-mood:#d9644f;--w-energy:#1a98ae;--w-focus:#7254ec;--w-mot:#a88410;--w-sleep:#5058e0;
  color-scheme:light}
/* UI styles. A: emerald + dim brick red. B: preview look (white buttons, red). C: red only. */
:root[data-ui="a"]{--pri:var(--emerald);--pri-fg:var(--emerald-fg);--tog:var(--emerald);--dng-bg:var(--brick);--dng-fg:#fff;--dng-bd:transparent;--flame:var(--brick);--link:var(--emerald)}
:root,:root[data-ui="b"]{--pri:var(--fg);--pri-fg:var(--bg);--tog:var(--red);--dng-bg:var(--red);--dng-fg:#fff;--dng-bd:transparent;--flame:var(--red);--link:var(--fg)}
:root[data-ui="c"]{--pri:var(--emerald);--pri-fg:var(--emerald-fg);--tog:var(--emerald);--dng-bg:transparent;--dng-fg:var(--emerald);--dng-bd:var(--emerald);--flame:var(--emerald);--link:var(--emerald)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#app{height:100%;display:flex;justify-content:center;background:var(--bg)}
.phone{position:relative;width:100%;max-width:430px;height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:520px){
  body{background:var(--outer)}#app{background:var(--outer);align-items:center}
  .phone{height:min(880px,100%);border-radius:40px;border:1px solid var(--line);box-shadow:0 30px 80px #0007}
}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.pg{padding-top:14px;padding-bottom:36px;animation:pgin .24s ease-out}
.scroll.withnav .pg{padding-bottom:110px}
@keyframes pgin{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}

/* header */
.hdr{padding-top:8px;padding-bottom:12px}
.hdr.home{background:var(--card);border-bottom:1px solid var(--line);border-radius:0 0 30px 30px;padding-top:14px}
.hrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:48px;height:48px;border-radius:15px;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand small{display:block;font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:3px}
.title{font-size:28px;font-weight:800;letter-spacing:-.03em}
.chips{display:flex;gap:8px;flex:none}
.cb{height:42px;min-width:42px;padding:0 13px;border-radius:21px;border:1px solid var(--line);background:var(--card2);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;position:relative}
.hdr.home .cb{background:var(--bg)}
.cb svg{flex:none}
.cb.fl svg{color:var(--flame)}
.cb .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#e0a62b 70%);box-shadow:inset 0 0 0 2px #c98e1c55;display:inline-block}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.wd i{font-style:normal;width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:700;letter-spacing:0;background:var(--bg);border:1px solid var(--line);color:var(--fg)}
.wd.wsel i{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.wd.now i{border-color:var(--pri)}
.wd.wsel.now i{border-color:var(--fg)}
.wd u{width:5px;height:5px;border-radius:50%;background:var(--dim);display:block}
.wd u.off{visibility:hidden}
.phdr{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:6px}
.phdr .title{font-size:25px;flex:1;min-width:0}
.back{width:42px;height:42px;border-radius:21px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px}
.card>h3,.h3{font-size:19px;font-weight:700;letter-spacing:-.015em;margin-bottom:12px}
.card>.row>h3{font-size:19px;font-weight:700;letter-spacing:-.015em}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.muted{color:var(--mute)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.col{display:flex;flex-direction:column;gap:10px}
.gap{margin-top:12px}.gap2{margin-top:18px}
.sp{height:12px}
.list>.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line);font-weight:600;min-height:48px}
.list>.li:first-child{border-top:0}
.list>.li small{display:block;font-weight:400;color:var(--mute);font-size:12.5px;margin-top:2px}
.li .v{font-weight:700;white-space:nowrap}
.note{border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--mute)}
.note.warn{border-color:var(--warn);color:var(--warn)}
.note.info{border-color:var(--info);color:var(--info)}
.note.ok{border-color:var(--ok);color:var(--ok)}
.empty{text-align:center;padding:26px 12px;color:var(--mute)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* controls */
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:16px;background:var(--pri);color:var(--pri-fg);font-weight:700;font-size:15px;text-align:center;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98)}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.dng{background:var(--dng-bg);color:var(--dng-fg);border:1px solid var(--dng-bd)}
.btn.sm{min-height:38px;width:auto;padding:0 15px;border-radius:12px;font-size:13px;display:inline-flex}
.btn[disabled]{opacity:.4;pointer-events:none}
.btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:12px}
.btns.eq{grid-template-columns:1fr 1fr}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:14px;color:var(--fg);white-space:nowrap}
.chip.on{background:var(--pri);color:var(--pri-fg);border-color:transparent}
.chip.sm{min-height:32px;padding:0 12px;font-size:12.5px}
.chips-w{display:flex;flex-wrap:wrap;gap:8px}
.chips-w .grp{width:100%;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-top:8px;color:var(--mute)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px;margin-bottom:12px}
.seg button{padding:11px 4px;border-radius:14px;font-weight:600;color:var(--mute);font-size:14px;text-align:center}
.seg button.on{background:var(--card2);color:var(--fg)}
.seg.sm button{padding:8px 4px;font-size:13px}
#scroll.mini{flex:none;overflow:visible}#scroll.mini .pg,#scroll.mini.withnav .pg{padding-bottom:0;animation:none}#scroll.mini .seg{margin-bottom:6px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.scale button{min-height:46px;border-radius:13px;border:1px solid color-mix(in srgb,var(--mc,var(--line)) 55%,transparent);font-size:12px;font-weight:700;text-align:center;padding:0 2px;line-height:1.15}
.scale button.on{background:color-mix(in srgb,var(--mc,var(--pri)) 24%,transparent);border-color:var(--mc,var(--pri));box-shadow:0 0 0 1.5px var(--mc,var(--pri))}
.feel{--mc:var(--dim)}
.feel .chip{border-color:color-mix(in srgb,var(--mc) 45%,transparent)}
.feel .chip.on{background:var(--mc);color:#0b0c0d;border-color:transparent}
.inp,.sel{width:100%;min-height:50px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:0 14px;color:var(--fg)}
textarea.inp{padding:12px 14px;min-height:92px;resize:vertical}
.lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}
.lbl:first-child{margin-top:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border:1px solid var(--line);border-radius:14px;min-height:50px;padding:0 4px}
.stepper button{width:44px;height:44px;border-radius:12px;font-size:22px;font-weight:500;display:grid;place-items:center}
.stepper b{font-size:18px;min-width:40px;text-align:center}
.tog{position:relative;width:52px;height:30px;border-radius:15px;background:var(--line);flex:none;transition:background .18s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px #0005}
.tog.on{background:var(--tog)}.tog.on::after{transform:translateX(22px)}
.tile{background:var(--card2);border-radius:16px;padding:12px 8px;text-align:center}
.tile b{display:block;font-size:26px;font-weight:700;line-height:1.1}
.tile small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiles.two{grid-template-columns:1fr 1fr}
.tiles.three{grid-template-columns:repeat(3,1fr)}
.bar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--pri);transition:width .4s}
.hb{display:grid;grid-template-columns:96px 1fr 46px;align-items:center;gap:10px;font-size:14px;font-weight:500;padding:6px 0}
.hb .bar{height:12px}
.hb b{text-align:right}
.lab{display:inline-block;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.lab.early{color:var(--warn);border-color:var(--warn)}.lab.rep{color:var(--ok);border-color:var(--ok)}.lab.user{color:var(--info);border-color:var(--info)}
.link{color:var(--link);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:left;padding:6px 6px 8px 0;font-weight:600}
.tbl td{padding:10px 6px 10px 0;border-top:1px solid var(--line);font-weight:600}
.tbl td.m{color:var(--mute);font-weight:500}

/* orb + companion */
.orb{--oc:#8d9198;width:84px;height:84px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 26%,#fff9 0,#fff0 38%),radial-gradient(circle at 50% 55%,var(--oc),color-mix(in srgb,var(--oc) 50%,#000));box-shadow:0 0 calc(10px + var(--glow,0)*28px) color-mix(in srgb,var(--oc) 55%,transparent);animation:breathe var(--dur,4s) ease-in-out infinite}
.orb.lg{width:132px;height:132px}
@keyframes breathe{50%{transform:scale(1.06)}}
.ring text{font-family:var(--font)}

/* sheets */
.sbg{position:absolute;inset:0;background:#000a;z-index:40;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{width:100%;max-height:90%;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;border-top:1px solid var(--line);padding:12px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--dim);margin:0 auto 16px}
.sheet h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.coinbig{width:128px;height:128px;margin:6px auto 12px;border-radius:50%;display:grid;place-items:center;font-size:62px;font-weight:800;color:#7a4d0a;background:radial-gradient(circle at 32% 28%,#fff0b3,#f1bb3a 55%,#c98a14);box-shadow:inset 0 0 0 7px #e8b43a,inset 0 0 0 9px #b57b10,0 10px 40px #e0a62b44}

/* nav */
.nav{position:absolute;z-index:20;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:28px;padding:6px}
.nav button{height:48px;border-radius:22px;font-size:12.5px;font-weight:600;color:var(--mute);text-align:center;transition:background .15s,color .15s}
.nav button.on{background:var(--card2);color:var(--fg)}

/* timeline & plan & misc */
.tl{position:relative;padding-left:4px}
.tl .ev{display:grid;grid-template-columns:62px 14px 1fr;gap:10px;padding:10px 0;position:relative}
.tl .ev::before{content:"";position:absolute;left:72px;top:0;bottom:0;width:2px;background:var(--line)}
.tl .ev:first-child::before{top:18px}.tl .ev:last-child::before{bottom:calc(100% - 22px)}
.tl .t{font-size:12.5px;font-weight:600;color:var(--mute);padding-top:2px}
.tl .d{width:14px;height:14px;border-radius:50%;margin-top:3px;position:relative;z-index:1;background:var(--dc,var(--dim))}
.tl .x b{display:block;font-weight:700}.tl .x small{color:var(--mute);font-size:12.5px}.tl .x em{font-style:normal;font-size:10.5px;letter-spacing:.1em;font-weight:600;color:var(--mute);margin-left:6px;text-transform:uppercase}
.plan{position:relative;margin-top:4px}
.plan .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:11.5px;color:var(--mute)}
.plan .hr span{position:absolute;top:-8px;left:0;background:var(--card);padding-right:6px}
.plan .blk{position:absolute;left:52px;right:26px;border-radius:14px;padding:8px 12px;overflow:hidden;border:1px solid var(--bc);background:color-mix(in srgb,var(--bc) 20%,var(--card));color:var(--bc);font-weight:700;font-size:13.5px;text-align:left}
.plan .blk small{display:block;font-weight:500;font-size:11.5px;opacity:.85}
.plan .trk{position:absolute;right:6px;width:7px;border-radius:4px;background:var(--bc)}
.plan .now{position:absolute;left:44px;right:0;height:2px;background:var(--bad);z-index:2}
.plan .now::before{content:"";position:absolute;left:-5px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--mute);text-align:center;padding-bottom:4px}
.cal button,.cal span{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px}
.cal span.e{visibility:hidden}

.tog:hover{background:rgba(var(--rgb),.08);border-color:rgba(var(--rgb),.45);color:#fff}
.tog svg{transition:transform .25s ease}
.tog:hover svg{transform:translateX(3px)}

/* step enter animation */
.enter>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.enter>*:nth-child(1){--i:0}.enter>*:nth-child(2){--i:1}.enter>*:nth-child(3){--i:2}.enter>*:nth-child(4){--i:3}.enter>*:nth-child(5){--i:4}.enter>*:nth-child(6){--i:5}.enter>*:nth-child(7){--i:6}
.enter .ico{animation:pop .7s cubic-bezier(.3,1.5,.5,1) both}
.enter .then li{animation:slideIn .55s cubic-bezier(.2,.8,.2,1) both}
.enter .then li:nth-child(1){animation-delay:.45s}.enter .then li:nth-child(2){animation-delay:.55s}

/* running */
.ringbox{position:relative;width:184px;height:184px;margin:18px auto 0}
.ringbox::before{content:"";position:absolute;left:-16px;top:-16px;right:-16px;bottom:-16px;border-radius:50%;background:conic-gradient(from 0deg,rgba(52,210,123,0),rgba(52,210,123,.45),rgba(140,240,180,.35),rgba(52,210,123,0) 70%);filter:blur(20px);animation:spin 7s linear infinite;opacity:.8}
.ringbox svg.r{position:relative;transform:rotate(-90deg)}
.ringbox .tr{stroke:#2a2b33}
.ringbox .pg{transition:stroke-dasharray 1s linear}
.ringin{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ringin .ri{color:var(--acc)}
.timer{font-size:44px;font-weight:800;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.ringin small{font-size:12px;color:var(--muted)}
.rt{text-align:center;margin-top:16px}
.rt .ttl{font-size:22px;margin:0}
.up{font-size:13px;color:#34D27B;text-align:center;margin:8px 0 0;animation:blink 1.4s ease-in-out infinite}

/* done */
.okw{position:relative;text-align:center;padding-top:8px}
.okc{width:104px;height:104px;margin:6px auto 0}
.okc .bg{fill:rgba(52,210,123,.12)}
.okc .rg{fill:none;stroke:#34D27B;stroke-width:4;stroke-linecap:round;stroke-dasharray:302;stroke-dashoffset:302;animation:draw .6s cubic-bezier(.3,.7,.3,1) .05s forwards}
.okc .pt{fill:none;stroke:#34D27B;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:draw .4s ease .5s forwards}
.okc .bg{transform-origin:center;animation:pop .6s cubic-bezier(.3,1.5,.5,1) both}
.parts{position:absolute;left:50%;top:60px;width:0;height:0}
.parts i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--c);opacity:0;animation:burst .95s cubic-bezier(.1,.7,.2,1) .35s both}
.okw .ttl{text-align:center;margin:14px 0 6px;animation:rise .5s ease .55s both}
.okw .sub{text-align:center;animation:rise .5s ease .65s both}

/* sheet */
.back{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(5,5,8,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:2147483000;animation:fadeIn .3s ease both}
.back.closing{animation:fadeOut .28s ease both}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:430px;max-height:92vh;background:linear-gradient(180deg,#17181d,#101115 40%);border:1px solid var(--line2);border-bottom:0;border-radius:28px 28px 0 0;z-index:2147483001;display:flex;flex-direction:column;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));animation:sheetUp .5s cubic-bezier(.16,1,.3,1) both;overflow:hidden}
.sheet.closing{animation:sheetDown .28s cubic-bezier(.5,0,1,.6) both}
.sheet::before{content:"";position:absolute;right:-80px;top:-110px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(var(--rgb),.11),rgba(var(--rgb),0) 68%);pointer-events:none;transition:opacity .4s}
.grab{width:40px;height:4px;border-radius:2px;background:#3a3b44;margin:10px auto 0;flex:none}
.shh{position:relative;display:flex;align-items:center;justify-content:space-between;padding:8px 8px 6px 22px}
.shh .cap{color:var(--acc);transition:color .3s}
.hname{font-size:15px;font-weight:700;margin-top:2px}
.x{width:44px;height:44px;border-radius:22px;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .3s}
.x:hover{background:rgba(255,255,255,.08);transform:rotate(90deg)}
.sl{position:relative;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.sl::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;padding:10px 22px 6px;overflow-y:auto;max-height:calc(92vh - 170px);display:flex;flex-direction:column;gap:16px}
.slide .ico{width:48px;height:48px;border-radius:16px}
.slide .ico::after{display:none}
.slide.active .ico{animation:pop .7s cubic-bezier(.3,1.5,.5,1) both}
.slide h3{margin:0;font-size:28px;font-weight:700;letter-spacing:-.6px;line-height:1.12;text-wrap:balance;color:#fff}
.slide p{margin:0;font-size:15px;color:var(--soft);line-height:1.5}
.slide .cap{color:var(--acc)}
.take{display:flex;align-items:flex-start;gap:12px;background:rgba(var(--rgb),.1);border:1px solid rgba(var(--rgb),.22);border-radius:16px;padding:14px 16px;font-size:14px;font-weight:600;line-height:1.4;margin-top:auto;opacity:.4;transform:translateY(8px);transition:opacity .6s ease .5s,transform .7s cubic-bezier(.2,.8,.2,1) .5s}
.slide.active .take{opacity:1;transform:none}
.take svg{flex:none;margin-top:1px;color:var(--acc)}
.take small{display:block;font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--acc);text-transform:uppercase;margin-bottom:2px}
.shf{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 0}
.arr{width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,transform .15s}
.arr:hover{background:rgba(var(--rgb),.12);border-color:rgba(var(--rgb),.5)}
.arr:active{transform:scale(.92)}
.dots{display:flex;align-items:center}
.dots button{width:22px;height:44px;background:none;border:0;padding:0;position:relative}
.dots button::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:4px;background:#4b4d55;transform:translate(-50%,-50%);transition:width .35s cubic-bezier(.2,.8,.2,1),background .3s}
.dots button[aria-current="true"]::after{background:var(--acc);width:22px}

/* slide visuals (animate when the slide becomes active) */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:19px;top:20px;bottom:20px;width:2px;background:var(--line2);transform:scaleY(0);transform-origin:top;transition:transform 1s cubic-bezier(.2,.8,.2,1) .1s}
.slide.active .tl::before{transform:scaleY(1)}
.tl li{position:relative;display:flex;align-items:center;gap:14px;padding:8px 0;opacity:.25;transform:translateX(-10px);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--k,0)*90ms + 150ms)}
.slide.active .tl li{opacity:1;transform:none}
.tl .tdot{width:40px;height:40px;border-radius:50%;background:var(--card);border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--soft);flex:none;position:relative;z-index:1}
.tl li.now .tdot{background:linear-gradient(135deg,var(--btnA),var(--btnB));border-color:transparent;color:var(--on);box-shadow:0 0 0 0 rgba(var(--rgb),.5);animation:ping2 2.4s ease-out infinite}
.tl b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.tl small{font-size:12px;color:var(--muted)}
.br{display:flex;align-items:center;gap:12px;font-size:13px}
.br span{width:104px;flex:none;color:var(--soft)}
.br .bt{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.br .bt i{display:block;height:10px;border-radius:5px;background:#4b4d55;transform:scaleX(0);transform-origin:left;transition:transform 1s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--k,0)*120ms + 200ms)}
.br .bt i.hi{background:linear-gradient(90deg,var(--acc2),var(--acc))}
.slide.active .br .bt i{transform:scaleX(1)}
.br b{width:40px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:14px}
.cap2{font-size:12px;color:var(--muted);margin:0 0 -4px}
.strip{position:relative;height:40px;border-radius:12px;background:var(--soft2);overflow:hidden}
.sg{position:absolute;top:0;bottom:0;clip-path:inset(0 100% 0 0);transition:clip-path 1s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--k,0)*220ms + 150ms)}
.slide.active .sg{clip-path:inset(0 0 0 0)}
.sg.dip{background:repeating-linear-gradient(135deg,rgba(255,255,255,.34) 0 4px,rgba(255,255,255,.1) 4px 8px)}
.sg.study{background:linear-gradient(90deg,#1FAE62,#34D27B)}
.sg.wind{background:#4b4d55}
.nowm{position:absolute;top:-2px;bottom:-2px;width:3px;margin-left:-1.5px;background:#fff;border-radius:2px;opacity:0;transform:translateY(-10px);transition:opacity .4s ease 1s,transform .6s cubic-bezier(.3,1.4,.5,1) 1s;box-shadow:0 0 10px rgba(255,255,255,.7)}
.slide.active .nowm{opacity:1;transform:none}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--soft)}
.lg span{display:flex;align-items:center;gap:6px}
.lg i{width:12px;height:12px;border-radius:4px;display:block}
.lg .dip{background:repeating-linear-gradient(135deg,rgba(255,255,255,.6) 0 3px,rgba(255,255,255,.2) 3px 6px)}
.lg .study{background:linear-gradient(90deg,#1FAE62,#34D27B)}.lg .wind{background:#4b4d55}
.pb{display:flex;height:18px;border-radius:9px;background:var(--line);overflow:hidden}
.pb i{display:block;height:100%;transform:scaleX(0);transform-origin:left;transition:transform 1.1s cubic-bezier(.2,.8,.2,1) .2s}
.pb .b{transition-delay:.7s}
.slide.active .pb i{transform:scaleX(1)}
.pb .a{background:linear-gradient(90deg,#1FAE62,#34D27B)}.pb .b{background:rgba(94,168,255,.8)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles div,.tiles2 div{background:var(--soft2);border-radius:14px;padding:12px 10px;opacity:.3;transform:translateY(8px);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--k,0)*90ms + 350ms)}
.slide.active .tiles div,.slide.active .tiles2 div{opacity:1;transform:none}
.tiles b{display:block;font-size:18px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.tiles span,.tiles2 span{font-size:11px;color:var(--muted)}
.tiles2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tiles2 div{padding:12px}
.tiles2 b{display:block;font-size:20px;font-weight:800;letter-spacing:-.4px}
.tiles2 .up2{color:#34D27B}.tiles2 .dn2{color:#F0605A}
.chip2{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--soft)}
.chip2 svg{color:var(--acc)}
.mt{display:flex;gap:3px;flex:1}
.mt i{flex:1;height:10px;border-radius:3px;background:var(--line);display:block}
.mt i.on{background:linear-gradient(90deg,var(--acc2),var(--acc));transform:scaleY(.2);opacity:.3;transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .4s ease;transition-delay:calc(var(--k,0)*55ms + 200ms)}
.slide.active .mt i.on{transform:none;opacity:1}
.mrow2{display:flex;align-items:center;gap:12px;font-size:13px}
.mrow2 span{width:76px;flex:none;color:var(--soft)}
.mrow2 b{width:20px;text-align:right;font-weight:700}

/* keyframes */
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.55)}100%{opacity:1;transform:scale(1)}}
@keyframes ring{0%{opacity:.8;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.5)}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(var(--rgb),.6)}70%,100%{box-shadow:0 0 0 9px rgba(var(--rgb),0)}}
@keyframes ping2{0%{box-shadow:0 0 0 0 rgba(var(--rgb),.5)}70%,100%{box-shadow:0 0 0 12px rgba(var(--rgb),0)}}
@keyframes sheen{0%,55%{transform:translateX(-130%) skewX(-18deg)}100%{transform:translateX(330%) skewX(-18deg)}}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-28px,24px) scale(1.18)}}
@keyframes gin1{from{opacity:0}to{opacity:1}}
@keyframes gin2{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{from{transform:none}to{transform:translateY(100%)}}
@media (max-width:380px){.ttl{font-size:25px}.slide h3{font-size:25px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.parts{display:none}.okc .rg,.okc .pt{stroke-dashoffset:0}}

/* ---------- compact layouts: opts.layout = 'tight' | 'row' | 'bar' | 'chips' ---------- */
.l-tight,.l-row,.l-bar,.l-chips{border-radius:22px;padding:14px}
.l-tight .hero,.l-chips .hero{margin-top:10px}
.l-tight .ico,.l-chips .ico{width:44px;height:44px;border-radius:15px}
.l-tight .ico svg,.l-chips .ico svg{width:22px;height:22px}
.l-tight .dur,.l-chips .dur{height:28px;font-size:12px}
.l-tight .ttl{font-size:21px;margin:10px 0 4px}
.l-tight .sub{font-size:13px;line-height:1.4}
.l-tight .row,.l-chips .row,.l-row .row,.l-bar .row{margin-top:12px;gap:8px}
.l-tight .btn,.l-chips .btn{height:44px;border-radius:22px;font-size:15px}
.l-tight .then{margin-top:12px;padding-top:10px}
.l-tight .then ul{gap:6px;margin-top:6px}
.l-tight .then li{font-size:13px;gap:10px}
.l-tight .mini{width:26px;height:26px;border-radius:8px}
.l-tight .mini svg{width:15px;height:15px}
.l-tight .tog,.l-row .tog{margin-top:10px;height:38px;font-size:13px}
.l-tight .note,.l-row .note,.l-bar .note,.l-chips .note{margin-top:8px;font-size:12px}

/* row: icon beside the text, one line of up next */
.l-row #nxmain{display:grid;grid-template-columns:44px 1fr;column-gap:12px;row-gap:0;align-items:center;margin-top:10px}
.l-row .hero{grid-column:1;grid-row:1/3;margin:0}
.l-row .ico{width:44px;height:44px;border-radius:15px}
.l-row .ico svg{width:22px;height:22px}
.l-row .dur{display:none}
.l-row .note{grid-column:1/-1}
.l-row .ttl{grid-column:2;margin:0 0 2px;font-size:18px;line-height:1.2}
.l-row .sub{grid-column:2;font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.l-row .row,.l-row .then{grid-column:1/-1}
.l-row .btn{height:42px;border-radius:21px;font-size:14px}
.l-row .then{margin-top:10px;padding-top:8px}
.l-row .then .cap,.l-row .then li:nth-child(n+2){display:none}
.l-row .then ul{margin-top:0}
.l-row .then li{font-size:12.5px;gap:8px;color:var(--soft)}
.l-row .then li::before{content:"Up next";font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;order:-2}
.l-row .mini{width:22px;height:22px;border-radius:7px;order:-1}
.l-row .mini svg{width:13px;height:13px}
.l-row .tog{margin-top:8px}

/* bar: the smallest. Step, one button, skip, plan link */
.l-bar{padding:12px 14px}
.l-bar .top{display:none}
.l-bar #nxmain{display:grid;grid-template-columns:40px 1fr;column-gap:12px;align-items:center}
.l-bar .hero{grid-column:1;grid-row:1;margin:0}
.l-bar .ico{width:40px;height:40px;border-radius:13px}
.l-bar .ico svg{width:20px;height:20px}
.l-bar .dur{display:none}
.l-bar .note{grid-column:1/-1}
.l-bar .ttl{grid-column:2;margin:0;font-size:15px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.l-bar .sub{display:none}
.l-bar .row{grid-column:1/-1;margin:10px 0 0;gap:8px}
.l-bar .btn{height:38px;border-radius:19px;font-size:14px;padding:0 18px}
.l-bar .then{display:none}
.l-bar .tog{margin-top:8px;height:28px;border:0;font-size:12px;color:var(--acc);justify-content:flex-start;padding:0;border-radius:0}
.l-bar .tog:hover{background:none}

/* chips: up next as small pills, plan link instead of a big button */
.l-chips .ttl{font-size:20px;margin:10px 0 4px}
.l-chips .sub{font-size:13px;line-height:1.4}
.l-chips .then{margin-top:12px;padding-top:0;border-top:0}
.l-chips .then .cap{display:none}
.l-chips .then ul{flex-direction:row;flex-wrap:wrap;gap:6px;margin:0}
.l-chips .then li{flex:0 1 auto;max-width:100%;gap:6px;padding:4px 10px 4px 4px;border-radius:16px;border:1px solid var(--line2);font-size:12px}
.l-chips .then li small{display:none}
.l-chips .mini{width:22px;height:22px;border-radius:11px}
.l-chips .mini svg{width:12px;height:12px}
.l-chips .tog{margin-top:8px;height:30px;border:0;font-size:12.5px;color:var(--acc);justify-content:flex-start;padding:0;border-radius:0}
.l-chips .tog:hover{background:none}

/* compact running + done views */
.l-tight .ringbox{width:132px;height:132px;margin-top:12px}
.l-row .ringbox,.l-chips .ringbox{width:116px;height:116px;margin-top:10px}
.l-bar .ringbox{width:96px;height:96px;margin-top:8px}
.l-tight .ringbox svg.r,.l-row .ringbox svg.r,.l-chips .ringbox svg.r,.l-bar .ringbox svg.r{width:100%;height:100%}
.l-tight .timer{font-size:32px;letter-spacing:-1.4px}.l-row .timer,.l-chips .timer{font-size:28px;letter-spacing:-1.2px}.l-bar .timer{font-size:22px;letter-spacing:-1px}
.l-row .ringin small,.l-bar .ringin small,.l-chips .ringin small,.l-bar .ringin .ri{display:none}
.l-tight .rt,.l-row .rt,.l-chips .rt,.l-bar .rt{margin-top:10px}
.l-tight .rt .ttl,.l-row .rt .ttl,.l-chips .rt .ttl,.l-bar .rt .ttl{font-size:17px;text-align:center;margin:0;grid-column:auto;white-space:normal}
.l-row #nxmain:has(.ringbox),.l-bar #nxmain:has(.ringbox),.l-row #nxmain:has(.okw),.l-bar #nxmain:has(.okw){display:block}
.l-bar .row:has(#bdone){display:flex}
.l-tight .okc,.l-row .okc,.l-chips .okc{width:72px;height:72px;margin-top:2px}
.l-bar .okc{width:56px;height:56px;margin-top:0}
.l-tight .okw .ttl,.l-row .okw .ttl,.l-chips .okw .ttl,.l-bar .okw .ttl{font-size:20px;margin:8px 0 2px;text-align:center}
.l-tight .okw .sub,.l-row .okw .sub,.l-chips .okw .sub,.l-bar .okw .sub{font-size:12.5px;text-align:center}
.l-tight .parts,.l-row .parts,.l-chips .parts{top:44px}
.l-bar .parts{top:36px}
/* ---------- design standards from the Mindspace Tasks tab ----------
   flat near-black surfaces, hairline dividers, chip borders, small uppercase headings, Inter.
   Green = go / done, blue and slate = supporting steps. Gold is left for coin rewards. */
:host{--card:#0D0E11;--tile:#131418;--soft2:#131418;--line:#17181C;--line2:#25262B;--chip:#0E0F12;--muted:#8A8C96;--soft:#C9CBD3}
.cap{font-size:12px;font-weight:600;letter-spacing:.12em}
.nbs{background:#0D0E11;border:1px solid var(--line2);border-radius:26px}
.glow{display:none}
.lbl .cap{color:var(--muted)}
.live{width:6px;height:6px}
.ico{border-radius:16px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line2)}
.ico::after{border-color:rgba(var(--rgb),.35)}
.dur{background:var(--chip)}
.ttl{font-weight:700;letter-spacing:-.02em}
.sub{color:var(--muted)}
.btn{border-radius:16px}
.btn.pri{background:var(--acc);color:var(--on);box-shadow:none}
.btn.pri:hover{background:var(--acc);filter:brightness(1.08)}
.btn.pri::after{display:none}
.then ul{gap:0}
.then li{padding:11px 0;border-bottom:1px solid var(--line)}
.then li:last-child{border-bottom:0;padding-bottom:0}
.mini{border-radius:50%;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line2)}
.tog{border-radius:14px;background:#131418;color:#fff}
.tog:hover{background:#17181C;border-color:#3A3B44;color:#fff}
.ringbox::before{background:conic-gradient(from 0deg,rgba(var(--rgb),0),rgba(var(--rgb),.3),rgba(var(--rgb),0) 70%);opacity:.5}
.ringbox .tr{stroke:#1A1B20}
.ringbox .pg{filter:drop-shadow(0 0 5px rgba(var(--rgb),.5))}
.timer{font-weight:700;letter-spacing:-.04em}
.up{color:#F0605A}
.back{background:rgba(0,0,0,.6);backdrop-filter:none;-webkit-backdrop-filter:none}
.sheet{background:#0D0E11;border-radius:26px 26px 0 0}
.sheet::before{display:none}
.grab{width:44px;height:5px;border-radius:3px;background:#2A2B31}
.shh .cap{color:var(--muted)}
.hname{font-size:17px;letter-spacing:-.01em}
.x{width:40px;height:40px;border-radius:50%;background:#17181C}
.x:hover{background:#1F2026;transform:none}
.slide h3{letter-spacing:-.02em}
.take{background:#131418;border:1px solid var(--line2)}
.arr{width:40px;height:40px;border:0;background:#17181C}
.arr:hover{background:#1F2026;border-color:transparent}
.dots button::after{background:#2F3037}
.dots button[aria-current="true"]::after{background:#fff}
.tiles div,.tiles2 div,.strip{background:#131418;border:1px solid var(--line2)}
.tiles b,.tiles2 b{font-weight:700}
.chip2{background:var(--chip)}
.mt i,.br .bt,.pb{background:#1A1B20}
.sg.wind,.lg .wind{background:#4A4C55}

.tl li.now .tdot{background:var(--acc)}
.nowm{box-shadow:none}

.tl li.dn{opacity:1}
.tl li.dn .tdot{background:rgba(52,210,123,.14);border-color:rgba(52,210,123,.4);color:#34D27B}
.tl li.dn b{color:var(--muted);font-weight:600}
.tl li.cv .tdot{color:#34D27B}
.tl li.cm .tdot,.tl li.ca .tdot{color:#5EA8FF}
.tl li.now .tdot{--rgb:52,210,123;background:#34D27B;border-color:transparent;color:#04170C}
/* analytic bars */
.bars{gap:18px}
.br{flex-direction:column;align-items:stretch;gap:8px;font-size:13px}
.br .bh{display:flex;align-items:baseline;justify-content:space-between}
.br .bh span{width:auto;flex:none;font-size:14px;font-weight:600;color:var(--muted)}
.br.top .bh span{color:#fff}
.br .bh b{width:auto;font-size:15px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.br.top .bh b{color:#34D27B}
.br .bh b small{font-size:11px;font-weight:600;color:#4A4C55;margin-left:1px}
.br .bt{position:relative;height:12px;border-radius:6px;background:#1A1B20}
.br .bt::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;border-radius:6px;pointer-events:none;background:linear-gradient(90deg,transparent calc(33.33% - 1px),rgba(255,255,255,.08) calc(33.33% - 1px),rgba(255,255,255,.08) 33.33%,transparent 33.33%,transparent calc(66.66% - 1px),rgba(255,255,255,.08) calc(66.66% - 1px),rgba(255,255,255,.08) 66.66%,transparent 66.66%)}
.br .bt i{height:12px;border-radius:6px;background:#3A3C46}
.br .bt i.hi{background:linear-gradient(90deg,#1FAE62,#34D27B)}
.scale{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:#4A4C55;margin-top:-8px;font-variant-numeric:tabular-nums}
.sw{position:relative;margin-top:28px}
.strip{height:46px;border-radius:12px}
.tk{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.07)}
.sg{display:flex;align-items:center;justify-content:center}
.sg em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;color:#04170C}
.sg.dip em{color:#CFE4FF}
.sg.wind em{color:#fff}
.nowm{top:-8px;bottom:-8px;z-index:2}
.nowm b{position:absolute;top:-21px;left:50%;transform:translateX(-50%);padding:2px 7px;border-radius:8px;background:#fff;color:#000;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}

.lg .tonight{background:rgba(94,168,255,.8)}
/* page headers: icon and name always green */
.slide .ico,.slide .cap,.take svg,.take small,.chip2 svg{color:#34D27B}
/* mood meters: 10 gold tiles, red below 3 */
.mt{gap:4px}
.mt i{height:12px;border-radius:4px;background:#1A1B20}
.mt i.on{background:linear-gradient(180deg,#FFE08A,#F2B636);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}

.mrow2.low b{color:#F0605A}
.mrow2.low span{color:#F0605A}
/* routine strip */
.strip{height:56px;border-radius:14px;background:#0E0F12;border:1px solid var(--line2)}

.lgl .study{background:linear-gradient(180deg,#3BDC85,#1FAE62)}
.lgl .wind{background:#25262C;box-shadow:inset 0 0 0 1px #4A4C55}
.lgl b{font-weight:600;color:#fff;flex:1}
.lgl em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
@keyframes dipmove{to{background-position:14px 0}}
/* time page bar */
.pbh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:-6px}
.pbh span{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pbh b{font-size:22px;font-weight:700;letter-spacing:-.02em;color:#34D27B;font-variant-numeric:tabular-nums}
.pb{position:relative;height:16px;border-radius:8px;background:#1A1B20;box-shadow:inset 0 0 0 1px #25262B}
.pb i{position:relative;overflow:hidden;transform:none;clip-path:inset(0 100% 0 0);transition:clip-path 1.3s cubic-bezier(.22,1,.36,1) .3s}
.pb .b{transition-delay:.95s}
.slide.active .pb i{clip-path:inset(0 0 0 0)}
.pb .a{background:linear-gradient(90deg,#1FAE62,#34D27B);border-radius:8px 0 0 8px}
.pb .a::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);opacity:0}
.slide.active .pb .a::after{animation:pbsheen 2.8s ease-in-out 1.7s infinite}
.pb .b{background-color:rgba(94,168,255,.35);background-image:linear-gradient(135deg,rgba(94,168,255,.85) 25%,transparent 25%,transparent 50%,rgba(94,168,255,.85) 50%,rgba(94,168,255,.85) 75%,transparent 75%);background-size:14px 14px;animation:dipmove 1.2s linear infinite;border-radius:0 8px 8px 0}
@keyframes pbsheen{0%{left:-40%;opacity:1}55%,100%{left:120%;opacity:1}}
.pb{border-radius:8px}.pb i{border-radius:8px}
.pb i.a[style*="width:0%"],.pb i.a[style*="width:0.0%"],.pb i.b[style*="width:0%"],.pb i.b[style*="width:0.0%"]{display:none}
.pb .a:not(:last-child){border-radius:8px 0 0 8px}.pb .b:not(:first-child){border-radius:0 8px 8px 0}
.mt i.on{opacity:0;transform:scale(.15);transition:none}
.slide.active .mt i.on{animation:mpop .5s cubic-bezier(.3,1.7,.5,1) both;animation-delay:calc(var(--n,0)*90ms + 350ms)}
@keyframes mpop{0%{opacity:0;transform:scale(.15)}60%{opacity:1;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
.mrow2.none b,.mrow2.none span{color:#6b6d76}
@property --num{syntax:'<integer>';initial-value:0;inherits:false}
.mrow2.lq .mt{position:relative;height:16px;border-radius:9px;overflow:hidden;gap:0;background:#1A1B20;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.mrow2.lq .lf{position:absolute;left:0;top:0;bottom:0;width:calc(var(--pv)*1%);border-radius:9px;background:linear-gradient(180deg,color-mix(in srgb,var(--mc) 70%,#fff) 0,var(--mc) 45%,color-mix(in srgb,var(--mc) 75%,#000) 100%);box-shadow:0 0 12px color-mix(in srgb,var(--mc) 55%,transparent);transform:scaleX(0);transform-origin:left;overflow:hidden}
.mrow2.lq .lf::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:35%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent)}
.slide.active .mrow2.lq .lf{animation:lqfill 1.15s cubic-bezier(.2,.9,.25,1) both}
.slide.active .mrow2.lq .lf::after{animation:lqshine 1.3s ease-out 1.1s both}
.mrow2.lq:nth-child(1) .lf,.mrow2.lq:nth-child(1) b{animation-delay:.25s!important}.mrow2.lq:nth-child(2) .lf,.mrow2.lq:nth-child(2) b{animation-delay:.4s!important}.mrow2.lq:nth-child(3) .lf,.mrow2.lq:nth-child(3) b{animation-delay:.55s!important}.mrow2.lq:nth-child(4) .lf,.mrow2.lq:nth-child(4) b{animation-delay:.7s!important}
@keyframes lqfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lqshine{from{left:-40%}to{left:130%}}
.mrow2.lq.low .lf{--mc:#F0605A}
.mrow2.lq b.cnt{--num:0;counter-reset:n var(--num);width:24px}
.mrow2.lq b.cnt::before{content:counter(n)}
.slide.active .mrow2.lq b.cnt{animation:cntup 1.15s cubic-bezier(.2,.9,.25,1) both}
@keyframes cntup{from{--num:0}to{--num:var(--to)}}
.mrow2.lq b{color:var(--mc)}.mrow2.lq.low b,.mrow2.lq.low span{color:#F0605A}
.pb{background:#F4F5F7!important;box-shadow:0 0 16px rgba(255,255,255,.3)!important}.pb .b{display:none!important}.pb .a{border-radius:8px!important}
.then li:nth-child(n+2){display:none}
.nbs{background:linear-gradient(165deg,#181a20 0%,#0d0e11 70%)!important}
.nbs::before{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.07),transparent);pointer-events:none;z-index:0}
.btn.pri{background:linear-gradient(180deg,#5BE79B,#2BC46F)!important;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 6px 18px rgba(52,210,123,.35)!important}
.lg .tonight{background-color:rgba(94,168,255,.4);background-image:linear-gradient(135deg,rgba(94,168,255,.9) 25%,transparent 25%,transparent 50%,rgba(94,168,255,.9) 50%,rgba(94,168,255,.9) 75%,transparent 75%);background-size:6px 6px}
/* possible tonight = solid white with a soft glow; plan icons all green */
.pb .b{background:#fff;background-image:none;animation:none;box-shadow:0 0 10px rgba(255,255,255,.55),0 0 2px rgba(255,255,255,.9);clip-path:inset(-14px 100% -14px 0)}
.lg .tonight{background:#fff;background-image:none;box-shadow:0 0 8px rgba(255,255,255,.6)}
.tl li .tdot,.tl li.cv .tdot,.tl li.cm .tdot,.tl li.ca .tdot{color:#34D27B}
.tl li.now .tdot{color:#04170C}

.l-snug{border-radius:24px;padding:16px 18px}

/* ---------- derived: time, score, streak, coins ---------- */

const trackedMin=(k,live=true)=>entriesOn(k,live).reduce((a,e)=>a+mins(e),0);
const catMin=(k,id,live=true)=>entriesOn(k,live).filter(e=>e.catId===id).reduce((a,e)=>a+mins(e),0);
function score(k){
 const parts=[],W=S.weights,t=S.tasks[k];
 if(t&&t.planned>0)parts.push({id:'tasks',name:'Tasks',w:W.tasks,r:Math.min(1,t.done/t.planned),line:`${t.done} of ${t.planned} completed`});
 const sm=grpMin(k,'Study');
 if(S.studyTarget>0&&sm>0)parts.push({id:'study',name:'Study',w:W.study,r:Math.min(1,sm/S.studyTarget),line:`${fmtH(sm)} of ${fmtH(S.studyTarget)} goal`});
 const tr=trackedMin(k),wm=grpMin(k,'Wasted');
 if(tr>=5)parts.push({id:'time',name:'Time well spent',w:W.time,r:(tr-wm)/tr,line:`${fmtD(tr)} tracked, ${fmtD(wm)} Wasted`});

function startRun(catId,mode){const now=Date.now();S.lastCat=catId;
 S.running=mode==='pomo'?{catId,mode:'pomo',start:now,phase:'focus',phaseStart:now,dur:S.settings.focus*6e4,block:1,segStart:now,waiting:false}:{catId,mode:'sw',start:now};save();render()}
function saveSeg(r,start,end){if(end-start<((S.cfg&&S.cfg.minSess)?S.cfg.minSess*60000:30000))return null;const e={id:uid(),catId:r.catId,start,end,src:'timer'};S.entries.push(e);save();return e}
function askFocus(e){if(e&&cfgOn('rateFocus')&&(cat(e.catId)||{}).group==='Study'&&mins(e)>=5)openSheet('focus',{id:e.id})}
function stopRun(){const r=S.running;if(!r)return;let e=null;
 const nowE=r.pausedAt||Date.now();if(r.mode==='sw')e=saveSeg(r,r.start,nowE);else if(r.phase==='focus'&&!r.waiting)e=saveSeg(r,r.segStart,nowE);
 S.running=null;save();render();checkNotes();if(e){toast('Saved '+fmtD(mins(e))+' · '+catLabel(e.catId));askFocus(e)}}
function phaseEnd(){const r=S.running;if(!r||r.mode!=='pomo'||r.waiting)return;const end=r.phaseStart+r.dur;let e=null;
 if(r.phase==='focus'){e=saveSeg(r,r.segStart,end);const long=r.block%S.settings.blocks===0;r.next=long?'long':'short'}else r.next='focus';
 r.waiting=true;r.endedAt=end;save();chime();render();
 if(S.settings.auto)nextPhase();else{toast(r.phase==='focus'?'Focus block done':'Break over');if(e)askFocus(e)}}
function nextPhase(){const r=S.running;if(!r||!r.waiting)return;const now=Date.now(),nx=r.next;
 if(nx==='focus'){r.block=r.phase==='long'?1:r.block+1;r.phase='focus';r.dur=S.settings.focus*6e4;r.segStart=now}
 else{r.phase=nx;r.dur=(nx==='long'?S.settings.long:S.settings.short)*6e4}
 r.phaseStart=now;r.waiting=false;save();render()}
function pauseRun(){const r=S.running;if(!r||r.pausedAt||r.waiting)return;r.pausedAt=Date.now();save();render()}
function resumeRun(){const r=S.running;if(!r||!r.pausedAt)return;const d=Date.now()-r.pausedAt;r.start+=d;if(r.phaseStart)r.phaseStart+=d;if(r.segStart)r.segStart+=d;delete r.pausedAt;save();render()}
function runText(){const r=S.running;if(!r)return '00:00:00';const now=r.pausedAt||Date.now();
 if(r.mode==='sw'){const s=Math.floor((now-r.start)/1e3),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
 const left=r.waiting?0:Math.max(0,Math.ceil((r.phaseStart+r.dur-now)/1e3));return String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}
function tick(force){
 const r=S.running;
 if(r&&r.mode==='pomo'&&!r.waiting&&!r.pausedAt&&Date.now()>=r.phaseStart+r.dur){phaseEnd();return}

function lockIn(k){
 const t=S.tasks[k],sm=grpMin(k,'Study'),tr=trackedMin(k),wm=grpMin(k,'Wasted'),pm=Math.max(0,tr-wm),goalH=(S.cfg&&S.cfg.sleepGoal)||8;
 const dis=[];if(t&&t.planned>0)dis.push(Math.min(1,t.done/t.planned));if(tr>=5)dis.push(Math.max(0,1-(wm/tr)*1.6));
 const parts=[];
 if(dis.length)parts.push({id:'dis',name:'Discipline',w:.3,r:dis.reduce((a,b)=>a+b,0)/dis.length});
 if(S.studyTarget>0&&sm>0)parts.push({id:'pro',name:'Productivity',w:.3,r:Math.min(1,sm/S.studyTarget)});else if(pm>=15)parts.push({id:'pro',name:'Productivity',w:.3,r:Math.min(1,pm/240)});
 const nt=S.sleep.find(x=>x.date===k);let late=0;
 if(nt){const dur=sdur(nt),g=goalH*60;let sc=Math.max(0,1-Math.abs(dur-g)/(g*.45));
  try{const pd=dk(addDays(k2t(k),-1));late=entriesOn(pd,false).filter(e=>(cat(e.catId)||{}).group==='Wasted'&&e.end>nt.bed-72e5&&e.end<=nt.bed+6e4).reduce((a,e)=>a+mins(e),0)}catch(e){}
  sc=Math.max(0,sc-Math.min(.35,late/60*.18));parts.push({id:'slp',name:'Sleep',w:.2,r:sc});
  const rec=S.sleep.filter(x=>x.date<=k).slice(-7).map(bedMin);if(rec.length>=3){const mu=rec.reduce((a,b)=>a+b,0)/rec.length,sd=Math.sqrt(rec.reduce((a,b)=>a+(b-mu)*(b-mu),0)/rec.length);parts.push({id:'con',name:'Consistency',w:.2,r:Math.max(0,1-sd/90)})}}
 const tw=parts.reduce((a,p)=>a+p.w,0);
 if(!tw)return {n:null,parts,pm,wm,late};
 const n=Math.round(parts.reduce((a,p)=>a+p.r*p.w,0)/tw*100);
 return {n,parts,pm,wm,late,head:n>=80?'Locked in':n>=60?'Mostly focused':n>=40?'Drifting':'Off track'}}

function curvePath(p){if(p.length<2)return '';const n=p.length,dx=[],m=[],t=[];for(let i=0;i<n-1;i++){dx.push(p[i+1][0]-p[i][0]);m.push((p[i+1][1]-p[i][1])/dx[i])}
 t.push(m[0]);for(let i=1;i<n-1;i++)t.push(m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2);t.push(m[n-2]);
 for(let i=0;i<n-1;i++){if(m[i]===0){t[i]=0;t[i+1]=0}else{const a=t[i]/m[i],b=t[i+1]/m[i],h=Math.hypot(a,b);if(h>3){t[i]=3*a/h*m[i];t[i+1]=3*b/h*m[i]}}}
 let d='M'+p[0][0].toFixed(1)+' '+p[0][1].toFixed(1);for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=` C${(p[i][0]+h).toFixed(1)} ${(p[i][1]+t[i]*h).toFixed(1)} ${(p[i+1][0]-h).toFixed(1)} ${(p[i+1][1]-t[i+1]*h).toFixed(1)} ${p[i+1][0].toFixed(1)} ${p[i+1][1].toFixed(1)}`}return d}
function trendCard(k,isT){const sel=(R.trendSel||[]).filter(q=>MET.some(x=>x.k===q)),all=!sel.length,ms=all?MET:MET.filter(x=>sel.includes(x.k)),one=ms.length===1;
 const cd=S.checkins.filter(c=>dk(c.ts)===k).sort((a,b)=>a.ts-b.ts),l=cd[cd.length-1],f0=cd[0];
 const d0=new Date(k2t(k));d0.setHours(0,0,0,0);const dayT=d0.getTime(),H=36e5,now=Date.now();
 let t0=dayT+6*H;if(f0&&f0.ts<t0)t0=dayT+Math.floor((f0.ts-dayT)/H)*H;
 let t1=isT?Math.max(now,l?l.ts:0):dayT+22*H;if(!isT&&l)t1=Math.max(t1,l.ts);
 t1=dayT+Math.ceil((t1-dayT)/H)*H;if(t1-t0<6*H)t1=t0+6*H;const span=t1-t0;
 const W=320,Hh=150,L=30,Rr=16,T=14,B=30,X=t=>L+(t-t0)/span*(W-L-Rr),Y=v=>T+(1-v/10)*(Hh-T-B);
 const pts=x=>cd.filter(c=>c[x.k]!=null).map(c=>({t:c.ts,v:c[x.k]}));
 const chg=x=>{const p=pts(x);return p.length>1?p[p.length-1].v-p[0].v:null};
 let delta='<span class="delta">Check in again later to see how your day moves</span>';
 if(all){let best=null;MET.forEach(x=>{const d=chg(x);if(d!=null&&(best==null||Math.abs(d)>Math.abs(best.d)))best={x,d}});
  if(best)delta=Math.abs(best.d)<1?'<span class="delta">All four steady so far today</span>':`<span class="delta ${best.d>0?'up':'dn'}">${best.d>0?'▲ ':'▼ '}${best.x.n} ${best.d>0?'up':'down'} ${Math.abs(best.d)} since your first check-in</span>`}
 else{const bits=ms.map(x=>{const d=chg(x);return d==null?null:`<span class="delta ${Math.abs(d)<1?'':d>0?'up':'dn'}">${Math.abs(d)<1?'■ '+x.n+' steady':(d>0?'▲ ':'▼ ')+x.n+(d>0?' up ':' down ')+Math.abs(d)}</span>`}).filter(Boolean);if(bits.length)delta=bits.join(' ')}
 let head='No check-in yet',sub=isT?'Check in above and your day appears here.':'Nothing was logged on this day.';
 if(l&&l.mood!=null){head=MET[0].lab[lvl(l.mood)];const sfx=l.focus!=null&&l.focus>=7?'with '+MET[2].lab[lvl(l.focus)].toLowerCase()+' focus':l.energy!=null&&l.energy<5?'with low energy':l.mot!=null&&l.mot>=7?'and '+MET[3].lab[lvl(l.mot)].toLowerCase():'';head+=sfx?', '+sfx:'';sub=''}
 const lines=ms.map(x=>{const d=pts(x),last=d[d.length-1],fix=metFix(x),xy=d.map(z=>[X(z.t),Y(z.v)]);
  const gid='tg'+x.k,multi=xy.length>1;
  const area=!one||!multi?'':`<path d="${curvePath(xy)} L${xy[xy.length-1][0].toFixed(1)} ${Y(0)} L${xy[0][0].toFixed(1)} ${Y(0)}Z" fill="url(#${gid})"/>`;
  const line=multi?`<path class="ln" pathLength="1" d="${curvePath(xy)}" fill="none" stroke="${fix}" stroke-width="${one?3.2:2.8}" stroke-linecap="round" stroke-linejoin="round"/>`:'';
  const dots=ms.length>2?'':d.map(z=>z===last?'':`<circle cx="${X(z.t)}" cy="${Y(z.v)}" r="3.4" fill="${fix}" stroke="var(--card)" stroke-width="2"/>`).join('');
  let end2='';if(last){const px=X(last.t),py=Y(last.v),tx=Math.min(Math.max(px,L+14),W-Rr-14);
   end2=ms.length>2?`<circle cx="${px}" cy="${py}" r="4.6" fill="${fix}" stroke="var(--card)" stroke-width="2"/>`:`${one?`<line x1="${px}" y1="${py}" x2="${px}" y2="${Y(0)}" stroke="${fix}" stroke-width="1.5" stroke-dasharray="3 4" opacity=".55"/>`:''}<circle cx="${px}" cy="${py}" r="9" fill="${fix}" opacity=".22"/><circle cx="${px}" cy="${py}" r="5.2" fill="${fix}" stroke="var(--card)" stroke-width="2.5"/><g transform="translate(${tx} ${Math.max(py-26,2)})"><rect x="-17" y="-2" width="34" height="20" rx="10" fill="${fix}"/><text x="0" y="12.5" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0a0a0a">${Math.round(last.v*10)/10}</text></g>`}
  return {def:one?`<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${fix};stop-opacity:.34"/><stop offset="1" style="stop-color:${fix};stop-opacity:0"/></linearGradient>`:'',body:area+line+dots+end2,have:d.length}}).reduce((a,x)=>({def:a.def+x.def,body:a.body+x.body,have:a.have+x.have}),{def:'',body:'',have:0});
 const grid=[0,5,10].map(v=>`<line x1="${L}" y1="${Y(v)}" x2="${W-Rr}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1" ${v===5?'stroke-dasharray="4 5"':''}/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--mute)">${v}</text>`).join('');
 let lab='';for(let t=t0;t<=t1+1;t+=3*H)lab+=`<text x="${X(t)}" y="${Hh-8}" text-anchor="${t===t0?'start':'middle'}" font-size="10.5" fill="var(--mute)">${new Date(t).toLocaleTimeString('en-US',{hour:'numeric'})}</text>`;
 const nowL=isT&&now>=t0&&now<=t1?`<line x1="${X(now)}" y1="${T}" x2="${X(now)}" y2="${Y(0)}" stroke="var(--fg)" stroke-width="1" stroke-dasharray="2 4" opacity=".35"/>`:'';
 const empty=lines.have?'':`<text x="${W/2}" y="${Hh/2-4}" text-anchor="middle" font-size="13" fill="var(--mute)">${isT?'No check-ins yet today':'No check-ins on this day'}</text>`;
 const pick=`<button class="chip sm ${all?'on':''}" data-a="trendM" data-v="all"><span class="tdots"><i style="background:#FFB629"></i><i style="background:#2FD27E"></i><i style="background:#A66BFF"></i><i style="background:#FF8A2B"></i></span>All</button>`+MET.map(x=>`<button class="chip sm ${sel.includes(x.k)?'on':''}" data-a="trendM" data-v="${x.k}"><i class="tdot" style="background:${metFix(x)}"></i>${x.n}</button>`).join('');
 return `<div class="card trend"><div class="eyebrow">How you are doing${isT?' today':''}</div><div class="tbig">${esc(head)}</div>${sub?`<p class="muted small" style="margin:4px 0 0">${sub}</p>`:''}<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">${delta}</div>
 <div class="tpick">${pick}</div><p class="muted small" style="margin:8px 0 0">Tap up to three metrics to compare them.</p>
 <svg class="spark ${R.trAnim?'draw':''}" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${ms.map(x=>x.n).join(' and ')} ${isT?'so far today':'on this day'}"><defs>${lines.def}</defs>${grid}${nowL}${lines.body}${lab}${empty}</svg></div>`}
A.trendM=el=>{const v=el.dataset.v;let a=(R.trendSel||[]).slice();if(v==='all')a=[];else if(a.includes(v))a=a.filter(q=>q!==v);else{a.push(v);if(a.length>3)a.shift()}R.trendSel=a;R.trAnim=1;render();R.trAnim=0};

 const head=sc.n==null?`<div class="card row" style="gap:16px">${ringSvg(0,96,9,'var(--fg)',ringTxt('–'))}<div><h2 style="font-size:20px">No score yet</h2><p class="muted small">${fmtDate(k2t(k))}</p></div></div>`:`<div class="card row" style="gap:16px">${ringSvg(sc.n/100,96,9,'var(--fg)',ringTxt(sc.n,'of 100'))}<div><h2 style="font-size:20px;line-height:1.2">${esc(sc.head)}</h2><p class="muted small" style="margin-top:6px">${fmtDate(k2t(k))}</p></div></div>`;
 const cards=all.map(([id,n,w])=>{const p=sc.parts.find(x=>x.id===id),col={tasks:'var(--ok)',study:'var(--warn)',time:'var(--info)'}[id];
  if(!p)return `<div class="card" style="opacity:.7"><div class="row"><h3 style="margin:0">${n}</h3><span class="muted small">${w}% of score</span></div><p class="muted small gap">No data for this part, so it is left out and the rest are scaled up.</p></div>`;
  const pct=Math.round(p.r*100);return `<div class="card"><div class="row"><h3 style="margin:0">${n}</h3><span class="muted small">${w}% of score</span></div><div class="row gap"><span class="muted">${esc(p.line)}</span><b>${pct}% → ${Math.round(p.r*w)} of ${w}</b></div><div class="bar gap"><i style="width:${pct}%;background:${col}"></i></div></div>`}).join('');
 return pageHdr('Lock-in score')+head+cards+`<div class="card"><h3>How it works</h3><p class="muted small">If a part has no data, such as no tasks planned, it is left out and the rest are scaled up. Missing data is never counted as zero. The score describes one day only. It says nothing about you as a person.</p><button class="btn sec gap" data-a="sheet" data-s="weights">Change the weights</button></div>`};

  const dn=i%3===0?5:rnd(2,4);S2.tasks[k]={planned:5,done:dn,pri:{High:[Math.min(dn,2),2],Medium:[Math.max(0,dn-2),2],Low:[0,1]},st:{Completed:dn,Partial:1,Cancelled:i%4===0?1:0,Delayed:i%5===0?1:0}};

 }

function mDelta(cs,m){const a=cs.filter(c=>c[m.k]!=null);if(!a.length)return null;const l=a[a.length-1],p=a[a.length-2];let note=fmtT(l.ts);if(p){const d=l[m.k]-p[m.k];note+=' · '+(d===0?'same as '+fmtT(p.ts):Math.abs(d)+(d<0?' lower':' higher')+' than '+fmtT(p.ts))}return{v:l[m.k],note}}

 let prev='';if(days>=5){const all=insights().filter(x=>!S.hidden.includes(x.id)),i=all.find(x=>!x.insuff)||all[0];if(i)prev=`<div class="card"><h3>Insight preview</h3><span class="lab ${i.cls}">${i.lab}</span><p class="gap" style="font-size:16px">${esc(i.text)}</p><p class="muted small gap">${i.range?esc(i.range)+' · ':''}n = ${i.n} · An association, not proof of cause.</p><button class="btn sec gap" data-a="openIns">Open Insights</button></div>`}

d=\"fbtn\" hidden aria-haspopup=\"menu\" aria-label=\"Week range\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 7h10M18 7h2M4 17h2M10 17h10\"/><circle cx=\"16\" cy=\"7\" r=\"2\"/><circle cx=\"8\" cy=\"17\" r=\"2\"/><\/svg><\/button><\/div>\n  <div id=\"main\"><\/div>\n<\/div>\n<div class=\"dock\"><button class=\"fab\" id=\"fab\" aria-label=\"New block\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 5v14M5 12h14\"/><\/svg><\/button><\/div>\n<div class=\"fmenu\" id=\"fmenu\" role=\"menu\"><\/div><div class=\"toast\" id=\"toast\" role=\"status\"><\/div><div class=\"dtip\" id=\"dtip\" aria-hidden=\"true\"><\/div>\n<div class=\"sheet\" id=\"csheet\"><div class=\"scrim\" id=\"cscrim\"><\/div><div class=\"panel\" id=\"cpanel\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Choose a date\"><\/div><\/div>\n<div class=\"sheet\" id=\"sheet\"><div class=\"scrim\" id=\"scrim\"><\/div><div class=\"panel\" id=\"panel\" role=\"dialog\" aria-modal=\"true\"><\/div><\/div>\n<script>\nconst TYPES=['study','revision','test','class','sleep','meal','gym','break','travel','other'];\nconst SUBJ=['physics','chemistry','maths','general'];\nconst SUBJC={physics:'#5EA8FF',chemistry:'#3FD1A0',maths:'#B38CFF',general:'#8A8C96'};\nconst SUBJ_TYPES=['study','revision','test'];\nconst KEY='plan.blocks.v5',DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],DL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];\nconst tc=t=>`var(--${t})`;\nlet blocks=[],view='day',sel=ymd(new Date()),editing=null,draft=null;\nfunction ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}\nfunction pd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}\nfunction addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)}\nconst today=()=>ymd(new Date());\nconst m2t=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');\nconst t2m=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};\nfunction fmt(m){let h=Math.floor(m/60),mm=m%60,ap=h>=12&&h<24?'PM':'AM';h=h%12||12;return h+':'+String(mm).padStart(2,'0')+' '+ap}\nfunction dur(m){const h=Math.floor(m/60),r=m%60;return ((h?h+'h ':'')+(r?r+'m':'')).trim()||'0m'}\nconst nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};\nconst studyMin=l=>l.filter(b=>SUBJ_TYPES.includes(b.type)).reduce((a,b)=>a+b.end-b.start,0);\nfunction save(){try{parent.postMessage({ms:1,type:'blocks',blocks:blocks},'*')}catch(e){}}\nfunction load(){blocks=((window.__INIT&&window.__INIT.blocks)||[]).slice()}\nfunction demo(){\n  const t=today(),out=[];let id=1;const a0=addDays(t,-14);\n  const add=(type,start,end,o={})=>out.push({id:id++,type,start:start*60,end:end*60,date:t,repeat:'none',...o});\n  add('sleep',0,6.5,{name:'Sleep',repeat:'daily',date:a0});\n  add('meal',7.5,8,{name:'Breakfast',repeat:'daily',date:a0});\n  add('meal',13,13.75,{name:'Lunch',repeat:'daily',date:a0});\n  add('meal',20,20.75,{name:'Dinner',repeat:'daily',date:a0});\n  const wk=[['class',9,11,'Physics lecture'],['class',9,11,'Chemistry lecture'],['class',9,10.5,'Maths class'],['class',9,11,'Biology lecture'],['class',9,12,'Chemistry practical'],['class',10,12,'Maths practice'],['class',9,11,'English and language']];\n  wk.forEach((w,i)=>add(w[0],w[1],w[2],{name:w[3],date:addDays(t,i),repeat:'weekly'}));\n  [[0,'Gym: push day'],[2,'Gym: legs'],[4,'Gym: pull day']].forEach(([i,n])=>add('gym',6.75,7.5,{name:n,date:addDays(t,i),repeat:'weekly'}));\n  [0,1,3].forEach(i=>add('travel',8.25,9,{name:'Commute to college',date:addDays(t,i),repeat:'weekly'}));\n  const subs=['physics','chemistry','maths','physics','chemistry','maths'];\n  for(let i=-3;i<10;i++){const d=addDays(t,i),k=(i+9)%6;\n    add('study',14.25,16,{subject:subs[k],name:['Rotation PYQs','Electrochemistry notes','Integration drill','Wave optics problems','Organic reactions','Probability sets'][k],date:d});\n    add('study',16.5,18,{subject:subs[(k+1)%6],name:['Numericals','Mole concept revision','Calculus PYQs'][k%3],date:d});\n    add('revision',18.25,19.25,{subject:'general',name:'Flashcards and error log',date:d})}\n  add('test',10,13,{subject:'maths',name:'Maths mock test',date:addDays(t,2)});\n  add('test',9,12,{subject:'physics',name:'Physics unit test',date:addDays(t,5)});\n  add('other',17,17.75,{name:'Call with mentor'});\n  add('travel',15,17,{name:'Trip to coaching centre',date:addDays(t,3)});\n  return out;\n}\nconst uid=()=>Date.now()+Math.floor(Math.random()*1000);\nfunction on(b,d){if(!b.repeat||b.repeat==='none')return b.date===d;if(d<b.date)return false;const x=pd(d),w=x.getDay(),a=pd(b.date);switch(b.repeat){case'daily':return true;case'weekdays':return w>0&&w<6;case'weekly':return w===a.getDay();case'monthly':return x.getDate()===a.getDate();case'custom':return (b.days||[]).includes(w);default:return false}}\nconst forDay=d=>blocks.filter(b=>on(b,d)).sort((a,b)=>a.start-b.start);\nconst label=b=>b.name||(SUBJ_TYPES.includes(b.type)&&b.subject?b.subject+' '+b.type:b.type);\nconst nextFree=()=>sel===today()?Math.min(Math.floor(nowMin()/60)*60,22*60):9*60;\nfunction lanes(list){const out=[];let cl=[],end=0;\n  const flush=()=>{const n=Math.max(1,...cl.map(c=>c.lane+1));cl.forEach(c=>c.n=n);out.push(...cl);cl=[]};\n  list.forEach(b=>{if(cl.length&&b.start>=end)flush();\n    const used=cl.filter(c=>c.b.end>b.start).map(c=>c.lane);let l=0;while(used.includes(l))l++;\n    cl.push({b,lane:l});end=Math.max(end,b.end)});\n  flush();return out}\nfunction drag(el,h,b,mode,PX,apply){\n  let y0,s0,e0,mv,ns,ne;\n  h.onpointerdown=e=>{e.preventDefault();e.stopPropagation();h.setPointerCapture(e.pointerId);y0=e.clientY;s0=b.start;e0=b.end;mv=0;el.classList.add('drag')};\n  h.onpointermove=e=>{if(y0==null)return;const dm=Math.round((e.clientY-y0)/(typeof PX==='function'?PX():PX)*4)*15,len=e0-s0;\n    if(mode==='move'){ns=Math.max(0,Math.min(1440-len,s0+dm));ne=ns+len}else{ns=s0;ne=Math.max(s0+15,Math.min(1440,e0+dm))}\n    mv=ns!==s0||ne!==e0;apply(el,ns,ne)};\n  const end=()=>{if(y0==null)return;y0=null;if(mv){b.start=ns;b.end=ne;save()}render()};\n  h.onpointerup=end;h.onpointercancel=end}\nconst ROUTINE=['sleep','meal','break'];\n\n\n\nlet HH=72;try{HH=+localStorage.getItem('plan.zoom')||72}catch(e){}\nconst clampHH=v=>Math.max(36,Math.min(260,v)),applyHH=()=>document.documentElement.style.setProperty('--hh',HH+'px');\nconst $=id=>document.getElementById(id);\nconst CAP=s=>s[0].toUpperCase()+s.slice(1);\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst isR=b=>ROUTINE.includes(b.type),focus=d=>forDay(d).filter(b=>!isR(b));\nconst bcol=b=>b.color||(SUBJ_TYPES.includes(b.type)&&b.subject?SUBJC[b.subject]:tc(b.type));\nconst PALETTE=['#5EA8FF','#8F9BFF','#B38CFF','#FF8AC2','#FF6B5E','#FFB25E','#F7CF55','#9BDB6A','#3FD1A0','#5ED3F3','#A0A6B8'];\nconst MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],MON=['January','February','March','April','May','June','July','August','September','October','November','December'];\nlet tab='timeline';try{tab=localStorage.getItem('plan.tab2')||'timeline'}catch(e){}\nconst REPS=[['none','Never'],['daily','Daily'],['weekdays','Weekdays'],['weekly','Weekly'],['monthly','Monthly'],['custom','Custom']];\nconst DAYB=[['M',1],['T',2],['W',3],['T',4],['F',5],['S',6],['S',0]];\nconst CHEV='<svg viewBox=\"0 0 24 24\"><path d=\"M6 9l6 6 6-6\"/><\/svg>';\n\n\n/* ---- Task tab data (replace with the real store when merging) ---- */\nconst TKEY='mindspace.tasks.v1';let tasks=[];\nfunction seedTasks(){const o=n=>addDays(today(),n);return[\n {id:1,title:'Daily update',date:o(0),time:'23:45',repeat:'Daily',list:'My tasks',pri:2,done:false},\n {id:2,title:'Finish basic concepts of Chemistry',date:o(0),list:'Study',pri:3,done:false},\n {id:3,title:'Study the first chapter of Biology',date:o(0),list:'Study',pri:2,done:false},\n {id:4,title:'Finish units and dimensions of Physics',date:o(-5),list:'Study',pri:3,done:false},\n {id:5,title:'Journal',date:o(-5),time:'21:00',repeat:'Daily',list:'My tasks',pri:1,done:false},\n {id:6,title:'Complete complex numbers',date:o(0),list:'Study',pri:2,done:true},\n {id:7,title:'Plan next week\\u2019s timetable',date:o(1),time:'09:00',repeat:'Weekly',list:'My tasks',pri:2,done:false},\n {id:8,title:'Organic chemistry mock test',date:o(3),time:'16:00',list:'Study',pri:3,done:false},\n {id:9,title:'Solve 15 algebra problems',date:o(-1),time:'18:00',list:'Study',pri:2,done:true},\n {id:10,title:'Morning walk, 20 minutes',date:o(-2),time:'06:30',list:'My tasks',pri:1,done:true}]}\nfunction loadTasks(){tasks=((window.__INIT&&window.__INIT.tasks)||[]).slice()}\nconst saveTasks=()=>{try{parent.postMessage({ms:1,type:'tasks',tasks:tasks},'*')}catch(e){}};\nconst taskById=id=>tasks.find(t=>t.id==id);\nconst PRI=['Low','Medium','High'],PRIC=['#7E94B8','#5EA8FF','#FF6B5E'];\nfunction tsub(t){let d='';if(t.date){const o=Math.round((pd(t.date)-pd(today()))/864e5);d=o===0?'Today':o===1?'Tomorrow':o===-1?'Yesterday':DN[pd(t.date).getDay()]+', '+pd(t.date).getDate()+' '+MS[pd(t.date).getMonth()]}\n  return [t.list,d+(t.time?', '+fmt(t2m(t.time)):'')].filter(Boolean).join(' - ')}\nfunction attachDemo(){const t=today(),st=blocks.filter(b=>b.type==='study'&&b.date===t).sort((a,b)=>a.start-b.start);\n  if(st[0])st[0].tasks=[2,3];if(st[1])st[1].tasks=[4];const m=blocks.find(b=>b.type==='test'&&b.subject==='maths');if(m)m.tasks=[8]}\n\n/* ---- month calendar ---- */\nlet cm={y:0,m:0};\nlet calDir=0;\nfunction openCal(){const d=pd(sel);cm={y:d.getFullYear(),m:d.getMonth()};calDir=0;drawCal();$('csheet').classList.add('on')}\nconst closeCal=()=>$('csheet').classList.remove('on');\nfunction drawCal(){\n  const T=today(),first=new Date(cm.y,cm.m,1),pad=(first.getDay()+6)%7,days=new Date(cm.y,cm.m+1,0).getDate();let g='';\n  for(let i=0;i<pad;i++)g+='<span><\/span>';\n  for(let n=1;n<=days;n++){const s=ymd(new Date(cm.y,cm.m,n));g+=`<button class=\"cdy${s===sel?' sel':'
