<!doctype html>
<html lang="en"><head><meta charset="utf-8"></head><body>
<title>Mindspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-width column. Fixed header, scrolling body, floating pill nav, bottom sheets.
   Colour: neutral surfaces + one UI accent (3 switchable styles); wellbeing has its own palette. */
:root{
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#000;--card:#0e0f11;--card2:#17181b;--line:#25272b;--fg:#f5f6f7;--mute:#8d9198;--dim:#5b5f66;--outer:#070708;
  --emerald:#ee1c14;--emerald-fg:#fff;--brick:#6e1d17;--red:#e0120a;
  --ok:#2fd28b;--mood:#f7c948;--warn:#f5b73b;--bad:#c4543f;--info:#5a9bf5;
  --w-mood:#f59e8b;--w-energy:#6ed0e0;--w-focus:#b39dff;--w-mot:#f3d36b;--w-sleep:#7c86ff;
  --m0:#5a47a8;--m1:#8a4aa0;--m2:#b0508a;--m3:#e8795f;--m4:#f7b267;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f2f2ee;--card:#fff;--card2:#eeeee9;--line:#deded7;--fg:#0b0c0d;--mute:#62666d;--dim:#9a9ea5;--outer:#dcdcd5;
  --mood:#d9a000;--emerald:#d40f08;--emerald-fg:#fff;--brick:#7a1812;--red:#d40f08;
  --w-mood:#d9644f;--w-energy:#1a98ae;--w-focus:#7254ec;--w-mot:#a88410;--w-sleep:#5058e0;
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f2ee;--card:#fff;--card2:#eeeee9;--line:#deded7;--fg:#0b0c0d;--mute:#62666d;--dim:#9a9ea5;--outer:#dcdcd5;
  --mood:#d9a000;--emerald:#d40f08;--emerald-fg:#fff;--brick:#7a1812;--red:#d40f08;
  --w-mood:#d9644f;--w-energy:#1a98ae;--w-focus:#7254ec;--w-mot:#a88410;--w-sleep:#5058e0;
  color-scheme:light}
/* UI styles. A: emerald + dim brick red. B: preview look (white buttons, red). C: red only. */
:root[data-ui="a"]{--pri:var(--emerald);--pri-fg:var(--emerald-fg);--tog:var(--emerald);--dng-bg:var(--brick);--dng-fg:#fff;--dng-bd:transparent;--flame:var(--brick);--link:var(--emerald)}
:root,:root[data-ui="b"]{--pri:var(--fg);--pri-fg:var(--bg);--tog:var(--red);--dng-bg:var(--red);--dng-fg:#fff;--dng-bd:transparent;--flame:var(--red);--link:var(--fg)}
:root[data-ui="c"]{--pri:var(--emerald);--pri-fg:var(--emerald-fg);--tog:var(--emerald);--dng-bg:transparent;--dng-fg:var(--emerald);--dng-bd:var(--emerald);--flame:var(--emerald);--link:var(--emerald)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#app{height:100%;display:flex;justify-content:center;background:var(--bg)}
.phone{position:relative;width:100%;max-width:430px;height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:520px){
  body{background:var(--outer)}#app{background:var(--outer);align-items:center}
  .phone{height:min(880px,100%);border-radius:40px;border:1px solid var(--line);box-shadow:0 30px 80px #0007}
}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.pg{padding-top:14px;padding-bottom:36px;animation:pgin .24s ease-out}
.scroll.withnav .pg{padding-bottom:110px}
@keyframes pgin{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}

/* header */
.hdr{padding-top:8px;padding-bottom:12px}
.hdr.home{background:var(--card);border-bottom:1px solid var(--line);border-radius:0 0 30px 30px;padding-top:14px}
.hrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:48px;height:48px;border-radius:15px;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand small{display:block;font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:3px}
.title{font-size:28px;font-weight:800;letter-spacing:-.03em}
.chips{display:flex;gap:8px;flex:none}
.cb{height:42px;min-width:42px;padding:0 13px;border-radius:21px;border:1px solid var(--line);background:var(--card2);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;position:relative}
.hdr.home .cb{background:var(--bg)}
.cb svg{flex:none}
.cb.fl svg{color:var(--flame)}
.cb .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#e0a62b 70%);box-shadow:inset 0 0 0 2px #c98e1c55;display:inline-block}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.wd i{font-style:normal;width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:700;letter-spacing:0;background:var(--bg);border:1px solid var(--line);color:var(--fg)}
.wd.wsel i{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.wd.now i{border-color:var(--pri)}
.wd.wsel.now i{border-color:var(--fg)}
.wd u{width:5px;height:5px;border-radius:50%;background:var(--dim);display:block}
.wd u.off{visibility:hidden}
.phdr{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:6px}
.phdr .title{font-size:25px;flex:1;min-width:0}
.back{width:42px;height:42px;border-radius:21px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px}
.card>h3,.h3{font-size:19px;font-weight:700;letter-spacing:-.015em;margin-bottom:12px}
.card>.row>h3{font-size:19px;font-weight:700;letter-spacing:-.015em}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.muted{color:var(--mute)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.col{display:flex;flex-direction:column;gap:10px}
.gap{margin-top:12px}.gap2{margin-top:18px}
.sp{height:12px}
.list>.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line);font-weight:600;min-height:48px}
.list>.li:first-child{border-top:0}
.list>.li small{display:block;font-weight:400;color:var(--mute);font-size:12.5px;margin-top:2px}
.li .v{font-weight:700;white-space:nowrap}
.note{border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--mute)}
.note.warn{border-color:var(--warn);color:var(--warn)}
.note.info{border-color:var(--info);color:var(--info)}
.note.ok{border-color:var(--ok);color:var(--ok)}
.empty{text-align:center;padding:26px 12px;color:var(--mute)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* controls */
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:16px;background:var(--pri);color:var(--pri-fg);font-weight:700;font-size:15px;text-align:center;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98)}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.dng{background:var(--dng-bg);color:var(--dng-fg);border:1px solid var(--dng-bd)}
.btn.sm{min-height:38px;width:auto;padding:0 15px;border-radius:12px;font-size:13px;display:inline-flex}
.btn[disabled]{opacity:.4;pointer-events:none}
.btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:12px}
.btns.eq{grid-template-columns:1fr 1fr}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:14px;color:var(--fg);white-space:nowrap}
.chip.on{background:var(--pri);color:var(--pri-fg);border-color:transparent}
.chip.sm{min-height:32px;padding:0 12px;font-size:12.5px}
.chips-w{display:flex;flex-wrap:wrap;gap:8px}
.chips-w .grp{width:100%;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-top:8px;color:var(--mute)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px;margin-bottom:12px}
.seg button{padding:11px 4px;border-radius:14px;font-weight:600;color:var(--mute);font-size:14px;text-align:center}
.seg button.on{background:var(--card2);color:var(--fg)}
.seg.sm button{padding:8px 4px;font-size:13px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.scale button{min-height:46px;border-radius:13px;border:1px solid color-mix(in srgb,var(--mc,var(--line)) 55%,transparent);font-size:12px;font-weight:700;text-align:center;padding:0 2px;line-height:1.15}
.scale button.on{background:color-mix(in srgb,var(--mc,var(--pri)) 24%,transparent);border-color:var(--mc,var(--pri));box-shadow:0 0 0 1.5px var(--mc,var(--pri))}
.feel{--mc:var(--dim)}
.feel .chip{border-color:color-mix(in srgb,var(--mc) 45%,transparent)}
.feel .chip.on{background:var(--mc);color:#0b0c0d;border-color:transparent}
.inp,.sel{width:100%;min-height:50px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:0 14px;color:var(--fg)}
textarea.inp{padding:12px 14px;min-height:92px;resize:vertical}
.lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}
.lbl:first-child{margin-top:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border:1px solid var(--line);border-radius:14px;min-height:50px;padding:0 4px}
.stepper button{width:44px;height:44px;border-radius:12px;font-size:22px;font-weight:500;display:grid;place-items:center}
.stepper b{font-size:18px;min-width:40px;text-align:center}
.tog{position:relative;width:52px;height:30px;border-radius:15px;background:var(--line);flex:none;transition:background .18s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px #0005}
.tog.on{background:var(--tog)}.tog.on::after{transform:translateX(22px)}
.tile{background:var(--card2);border-radius:16px;padding:12px 8px;text-align:center}
.tile b{display:block;font-size:26px;font-weight:700;line-height:1.1}
.tile small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiles.two{grid-template-columns:1fr 1fr}
.tiles.three{grid-template-columns:repeat(3,1fr)}
.bar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--pri);transition:width .4s}
.hb{display:grid;grid-template-columns:96px 1fr 46px;align-items:center;gap:10px;font-size:14px;font-weight:500;padding:6px 0}
.hb .bar{height:12px}
.hb b{text-align:right}
.lab{display:inline-block;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.lab.early{color:var(--warn);border-color:var(--warn)}.lab.rep{color:var(--ok);border-color:var(--ok)}.lab.user{color:var(--info);border-color:var(--info)}
.link{color:var(--link);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:left;padding:6px 6px 8px 0;font-weight:600}
.tbl td{padding:10px 6px 10px 0;border-top:1px solid var(--line);font-weight:600}
.tbl td.m{color:var(--mute);font-weight:500}

/* orb + companion */
.orb{--oc:#8d9198;width:84px;height:84px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 26%,#fff9 0,#fff0 38%),radial-gradient(circle at 50% 55%,var(--oc),color-mix(in srgb,var(--oc) 50%,#000));box-shadow:0 0 calc(10px + var(--glow,0)*28px) color-mix(in srgb,var(--oc) 55%,transparent);animation:breathe var(--dur,4s) ease-in-out infinite}
.orb.lg{width:132px;height:132px}
@keyframes breathe{50%{transform:scale(1.06)}}
.ring text{font-family:var(--font)}

/* sheets */
.sbg{position:absolute;inset:0;background:#000a;z-index:40;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{width:100%;max-height:90%;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;border-top:1px solid var(--line);padding:12px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--dim);margin:0 auto 16px}
.sheet h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.coinbig{width:128px;height:128px;margin:6px auto 12px;border-radius:50%;display:grid;place-items:center;font-size:62px;font-weight:800;color:#7a4d0a;background:radial-gradient(circle at 32% 28%,#fff0b3,#f1bb3a 55%,#c98a14);box-shadow:inset 0 0 0 7px #e8b43a,inset 0 0 0 9px #b57b10,0 10px 40px #e0a62b44}

/* nav */
.nav{position:absolute;z-index:20;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:28px;padding:6px}
.nav button{height:48px;border-radius:22px;font-size:12.5px;font-weight:600;color:var(--mute);text-align:center;transition:background .15s,color .15s}
.nav button.on{background:var(--card2);color:var(--fg)}

/* timeline & plan & misc */
.tl{position:relative;padding-left:4px}
.tl .ev{display:grid;grid-template-columns:62px 14px 1fr;gap:10px;padding:10px 0;position:relative}
.tl .ev::before{content:"";position:absolute;left:72px;top:0;bottom:0;width:2px;background:var(--line)}
.tl .ev:first-child::before{top:18px}.tl .ev:last-child::before{bottom:calc(100% - 22px)}
.tl .t{font-size:12.5px;font-weight:600;color:var(--mute);padding-top:2px}
.tl .d{width:14px;height:14px;border-radius:50%;margin-top:3px;position:relative;z-index:1;background:var(--dc,var(--dim))}
.tl .x b{display:block;font-weight:700}.tl .x small{color:var(--mute);font-size:12.5px}.tl .x em{font-style:normal;font-size:10.5px;letter-spacing:.1em;font-weight:600;color:var(--mute);margin-left:6px;text-transform:uppercase}
.plan{position:relative;margin-top:4px}
.plan .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:11.5px;color:var(--mute)}
.plan .hr span{position:absolute;top:-8px;left:0;background:var(--card);padding-right:6px}
.plan .blk{position:absolute;left:52px;right:26px;border-radius:14px;padding:8px 12px;overflow:hidden;border:1px solid var(--bc);background:color-mix(in srgb,var(--bc) 20%,var(--card));color:var(--bc);font-weight:700;font-size:13.5px;text-align:left}
.plan .blk small{display:block;font-weight:500;font-size:11.5px;opacity:.85}
.plan .trk{position:absolute;right:6px;width:7px;border-radius:4px;background:var(--bc)}
.plan .now{position:absolute;left:44px;right:0;height:2px;background:var(--bad);z-index:2}
.plan .now::before{content:"";position:absolute;left:-5px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--mute);text-align:center;padding-bottom:4px}
.cal button,.cal span{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px}
.cal span.e{visibility:hidden}
.cal .z{background:var(--card2);color:var(--mute)}
.cal .today{box-shadow:0 0 0 2px var(--fg)}
.legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:12px;color:var(--mute);margin-top:10px}
.legend i{width:16px;height:16px;border-radius:5px;display:block}
.dash{border:1.5px dashed var(--dim);background:transparent!important}
.trow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.cbar{width:5px;align-self:stretch;border-radius:3px;background:var(--bc)}
.runbig{font-size:54px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.center{text-align:center}
.ntf{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;color:#0b0c0d;flex:none}
#toast{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:.22s;z-index:60;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.cf{position:absolute;left:50%;top:44%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;display:grid;place-items:center;font-size:44px;font-weight:800;color:#7a4d0a;background:radial-gradient(circle at 32% 28%,#fff0b3,#f1bb3a 55%,#c98a14);box-shadow:inset 0 0 0 5px #e8b43a,0 0 60px #f1bb3a88}
.cp{position:absolute;left:50%;top:44%;width:6px;height:6px;border-radius:50%;background:#f7d46a}
.pulse{animation:pulse .5s}
@keyframes pulse{40%{transform:scale(1.2)}}
svg text{font-family:var(--font)}
.copy{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;min-height:160px}
#savepill{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:64;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
#savepill.saved{color:var(--ok)}#savepill.error{color:var(--warn);border-color:var(--warn)}
.sk i{display:block;height:14px;border-radius:7px;background:var(--card2);margin:12px 0;animation:shim 1.1s ease-in-out infinite alternate}.sk i.s{width:60%}.sk{padding:16px 18px}
@keyframes shim{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}.orb{animation:none}}

.week{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.week.wa-r{animation:wsr .28s ease-out}.week.wa-l{animation:wsl .28s ease-out}
@keyframes wsr{from{transform:translateX(34px);opacity:.2}}@keyframes wsl{from{transform:translateX(-34px);opacity:.2}}
.scale button{background:color-mix(in srgb,var(--mc,transparent) 11%,transparent)}

<script>
/* ===== Mindspace v3 · core ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const addDays=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()};
const k2t=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).getTime()};
const fmtT=t=>new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const fmtD=m=>{m=Math.round(m);if(m<1)return '0m';const h=Math.floor(m/60),r=m%60;return h?(r?h+'h '+r+'m':h+'h'):r+'m'};
const fmtH=m=>(m/60).toFixed(1)+'h';
const fmtDate=(t,o)=>new Date(t).toLocaleDateString('en-US',o||{weekday:'short',day:'numeric',month:'short'});
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const atTime=(day,v)=>{const [h,m]=v.split(':').map(Number);const d=new Date(day);d.setHours(h,m,0,0);return d.getTime()};
const weekStart=t=>{const d=new Date(sod(t));return addDays(d.getTime(),-((d.getDay()+6)%7))};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const r1=v=>v==null?'–':(Math.round(v*10)/10).toFixed(1);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const today=()=>sod(Date.now());
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

const I={
 flame:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .5 1.5 1.5 2 2 2 0-3-1-5 1-8z"/></svg>',
 bell:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"/></svg>',
 back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
 next:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
 chev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
 close:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 plus:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 logo:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg>'
};

/* ---------- data ---------- */
const GROUPS=[{id:'Health',c:'#2fd28b'},{id:'Study',c:'#f5b73b'},{id:'College',c:'#e0629f'},{id:'Commute',c:'#5a9bf5'},{id:'Wasted',c:'#c4543f'}];
const gcol=g=>(GROUPS.find(x=>x.id===g)||{c:'#8d9198'}).c;
function defCats(){const m={Health:['Exercise','Sleep','Meal','Skin care','Nap'],Study:['Maths','Physics','Chemistry','General','Lecture','Revision','Test'],College:['College','Practical','Exam'],Commute:['Commute','In train','Walking'],Wasted:['Scrolling','Doing nothing','Using phone']};
 const out=[];for(const g in m)m[g].forEach(n=>out.push({id:g.toLowerCase()+'-'+n.toLowerCase().replace(/\s+/g,'-'),name:n,group:g}));return out}
const KEY='mindspace.v3';
const defaults=()=>({v:3,name:'',ui:{style:'b',theme:'system',sound:false},settings:{focus:25,short:5,long:15,blocks:4,auto:false},
 weights:{tasks:30,study:40,time:30},cats:defCats(),studyTarget:480,exam:null,entries:[],plan:[],running:null,lastCat:null,
 checkins:[],events:[],sleep:[],naps:[],tasks:{},taskLog:[],coinLog:[],fw:{have:0,used:[],lastCheck:null,awarded:[]},
 notes:[],hidden:[],fb:{},companion:null,tab:'home',tk:null,cfg:{},tkCancel:{},tkDays:[],sample:false});
let storageOk=true;
let loadErr=false;
function load(){let r=null;try{r=localStorage.getItem(KEY)}catch(e){storageOk=false;return defaults()}
 if(r){try{const o=JSON.parse(r),d=defaults();loadErr=false;return Object.assign(d,o,{ui:Object.assign(d.ui,o.ui),settings:Object.assign(d.settings,o.settings),weights:Object.assign(d.weights,o.weights),fw:Object.assign(d.fw,o.fw)})}catch(e){loadErr=true;return defaults()}}
 return defaults()}
let S=load(),_st=0;
function flush(){if(loadErr)return false;try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true;return true}catch(e){storageOk=false;return false}}
let _sig=null;const sigNow=()=>JSON.stringify(S,(k,v)=>k==='tab'?undefined:v);
function save(){if(loadErr)return;clearTimeout(_st);let ch=true;try{const g=sigNow();ch=g!==_sig;_sig=g}catch(e){}
 if(ch&&typeof pill==='function')pill('saving');_st=setTimeout(()=>{const ok=flush();if(ch&&typeof pill==='function')pill(ok?'saved':'error')},120)}
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();else{tick();}});
const cat=id=>S.cats.find(c=>c.id===id);
const catLabel=id=>{const c=cat(id);return c?(c.group===c.name?c.name:c.group+' · '+c.name):'Deleted category'};
const catCol=id=>{const c=cat(id);return c?gcol(c.group):'#8d9198'};

/* ---------- derived: time, score, streak, coins ---------- */
function runSeg(){const r=S.running;if(!r)return null;if(r.mode==='sw')return{start:r.start};if(r.phase==='focus'&&!r.waiting)return{start:r.segStart};return null}
function entriesOn(k,live=true){const a=S.entries.filter(e=>dk(e.start)===k);const s=runSeg();if(live&&s&&dk(s.start)===k)a.push({id:'live',catId:S.running.catId,start:s.start,end:S.running.pausedAt||Date.now(),live:true});return a}
const mins=e=>Math.max(0,(e.end-e.start)/6e4);
const grpMin=(k,g,live=true)=>entriesOn(k,live).filter(e=>(cat(e.catId)||{}).group===g).reduce((a,e)=>a+mins(e),0);
const trackedMin=(k,live=true)=>entriesOn(k,live).reduce((a,e)=>a+mins(e),0);
const catMin=(k,id,live=true)=>entriesOn(k,live).filter(e=>e.catId===id).reduce((a,e)=>a+mins(e),0);
function score(k){
 const parts=[],W=S.weights,t=S.tasks[k];
 if(t&&t.planned>0)parts.push({id:'tasks',name:'Tasks',w:W.tasks,r:Math.min(1,t.done/t.planned),line:`${t.done} of ${t.planned} completed`});
 const sm=grpMin(k,'Study');
 if(S.studyTarget>0&&sm>0)parts.push({id:'study',name:'Study',w:W.study,r:Math.min(1,sm/S.studyTarget),line:`${fmtH(sm)} of ${fmtH(S.studyTarget)} goal`});
 const tr=trackedMin(k),wm=grpMin(k,'Wasted');
 if(tr>=5)parts.push({id:'time',name:'Time well spent',w:W.time,r:(tr-wm)/tr,line:`${fmtD(tr)} tracked, ${fmtD(wm)} Wasted`});
 const tw=parts.reduce((a,p)=>a+p.w,0);
 if(!parts.length||tw<=0)return{n:null,parts,tw};
 const n=Math.round(parts.reduce((a,p)=>a+p.w*p.r,0)/tw*100);
 const weak=[...parts].sort((a,b)=>a.r-b.r)[0];
 let head=n>=85?'Excellent day.':n>=70?'Doing well.':n>=50?'Getting there.':'A slow start.';
 if(weak.r<.7)head+={tasks:' Tasks are behind.',study:' Study is behind goal.',time:' Too much time lost.'}[weak.id];
 return{n,parts,tw,head}}
function dayActive(k){const t=S.tasks[k],tm=S.cfg&&S.cfg.streakMode==='time';return (!tm&&((t&&t.done>0)||(S.tkDays||[]).includes(k)))||S.entries.some(e=>dk(e.start)===k)||(S.running&&dk(S.running.start)===k)}
const covered=k=>dayActive(k)||S.fw.used.includes(k);
function streakEnd(ts){let n=0,t=ts;while(covered(dk(t))){n++;t=addDays(t,-1)}return n}
function streak(){const td=today();if(covered(dk(td)))return streakEnd(td);return streakEnd(addDays(td,-1))}
function longestStreak(){const ds=new Set([...S.entries.map(e=>dk(e.start)),...Object.keys(S.tasks).filter(k=>S.tasks[k].done>0),...S.fw.used]);let best=0;[...ds].sort().forEach(k=>{if(!ds.has(dk(addDays(k2t(k),-1)))){let n=0,t=k2t(k);while(ds.has(dk(t))){n++;t=addDays(t,1)}best=Math.max(best,n)}});return Math.max(best,streak())}
function timedStreak(){const has=k=>S.entries.some(e=>e.src==='timer'&&dk(e.start)===k)||(S.running&&dk(S.running.start)===k);let t=today(),n=0;if(!has(dk(t)))t=addDays(t,-1);while(has(dk(t))){n++;t=addDays(t,-1)}return n}
function runFirewood(){
 const td=today();let first=null;
 const ks=[...S.entries.map(e=>dk(e.start)),...Object.keys(S.tasks).filter(k=>S.tasks[k].done>0)].sort();first=ks[0]?k2t(ks[0]):null;
 if(first==null)return;
 let from=S.fw.lastCheck?addDays(k2t(S.fw.lastCheck),1):first;
 for(let t=from;t<td;t=addDays(t,1)){
  const k=dk(t);
  if(!covered(k)&&streakEnd(addDays(t,-1))>0&&S.fw.have>0&&cfgOn('autoWood')){S.fw.have--;S.fw.used.push(k);addNote('imp','Firewood saved your streak on '+fmtDate(t),'fw-'+k)}
  if(new Date(t).getDay()===0){const ws=weekStart(t),wk=dk(ws);if(!S.fw.awarded.includes(wk)){S.fw.awarded.push(wk);let p=0,d=0;for(let i=0;i<7;i++){const x=S.tasks[dk(addDays(ws,i))];if(x){p+=x.planned;d+=x.done}}if(p>0&&d>=p){S.fw.have=Math.min(3,S.fw.have+1);addNote('prog','Perfect week. You earned a firewood.','fwe-'+wk)}}}
 }
 S.fw.lastCheck=dk(addDays(td,-1));save()}
const bal=()=>S.coinLog.reduce((a,c)=>a+c.amt,0);
const earned=()=>S.coinLog.filter(c=>c.amt>0).reduce((a,c)=>a+c.amt,0);
const spent=()=>-S.coinLog.filter(c=>c.amt<0).reduce((a,c)=>a+c.amt,0);
function addCoins(n,label){S.coinLog.push({id:uid(),ts:Date.now(),amt:n,label:label||'Coins'});save();if(n>0){coinFx();chime()}render()}
function spendCoins(n,label){if(bal()<n)return false;S.coinLog.push({id:uid(),ts:Date.now(),amt:-n,label:label||'Purchase'});save();render();return true}

/* ---------- public hooks for the separately built Tasks tab and Store ---------- */

function startRun(catId,mode){const now=Date.now();S.lastCat=catId;
 S.running=mode==='pomo'?{catId,mode:'pomo',start:now,phase:'focus',phaseStart:now,dur:S.settings.focus*6e4,block:1,segStart:now,waiting:false}:{catId,mode:'sw',start:now};save();render()}
function saveSeg(r,start,end){if(end-start<((S.cfg&&S.cfg.minSess)?S.cfg.minSess*60000:30000))return null;const e={id:uid(),catId:r.catId,start,end,src:'timer'};S.entries.push(e);save();return e}
function askFocus(e){if(e&&cfgOn('rateFocus')&&(cat(e.catId)||{}).group==='Study'&&mins(e)>=5)openSheet('focus',{id:e.id})}
function stopRun(){const r=S.running;if(!r)return;let e=null;
 const nowE=r.pausedAt||Date.now();if(r.mode==='sw')e=saveSeg(r,r.start,nowE);else if(r.phase==='focus'&&!r.waiting)e=saveSeg(r,r.segStart,nowE);
 S.running=null;save();render();checkNotes();if(e){toast('Saved '+fmtD(mins(e))+' · '+catLabel(e.catId));askFocus(e)}}
function phaseEnd(){const r=S.running;if(!r||r.mode!=='pomo'||r.waiting)return;const end=r.phaseStart+r.dur;let e=null;
 if(r.phase==='focus'){e=saveSeg(r,r.segStart,end);const long=r.block%S.settings.blocks===0;r.next=long?'long':'short'}else r.next='focus';
 r.waiting=true;r.endedAt=end;save();chime();render();
 if(S.settings.auto)nextPhase();else{toast(r.phase==='focus'?'Focus block done':'Break over');if(e)askFocus(e)}}
function nextPhase(){const r=S.running;if(!r||!r.waiting)return;const now=Date.now(),nx=r.next;
 if(nx==='focus'){r.block=r.phase==='long'?1:r.block+1;r.phase='focus';r.dur=S.settings.focus*6e4;r.segStart=now}
 else{r.phase=nx;r.dur=(nx==='long'?S.settings.long:S.settings.short)*6e4}
 r.phaseStart=now;r.waiting=false;save();render()}
function pauseRun(){const r=S.running;if(!r||r.pausedAt||r.waiting)return;r.pausedAt=Date.now();save();render()}
function resumeRun(){const r=S.running;if(!r||!r.pausedAt)return;const d=Date.now()-r.pausedAt;r.start+=d;if(r.phaseStart)r.phaseStart+=d;if(r.segStart)r.segStart+=d;delete r.pausedAt;save();render()}
function runText(){const r=S.running;if(!r)return '00:00:00';const now=r.pausedAt||Date.now();
 if(r.mode==='sw'){const s=Math.floor((now-r.start)/1e3),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
 const left=r.waiting?0:Math.max(0,Math.ceil((r.phaseStart+r.dur-now)/1e3));return String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}

 const chg=x=>{const c=ser(x).filter(d=>d.v!=null).map(d=>d.v),p=[7,8,9,10,11,12,13].map(i=>dayAvg(dk(addDays(end,-i)),x.k)).filter(v=>v!=null);return c.length&&p.length?avg(c)-avg(p):null};
 let delta='<span class="delta">Log a few more days to see change</span>';
 if(all){let best=null;MET.forEach(x=>{const d=chg(x);if(d!=null&&(best==null||Math.abs(d)>Math.abs(best.d)))best={x,d}});
  if(best)delta=Math.abs(best.d)<.3?'<span class="delta">All four steady vs last week</span>':`<span class="delta ${best.d>0?'up':'dn'}">${best.d>0?'▲ ':'▼ '}Biggest change: ${best.x.n} ${best.d>0?'up':'down'} ${Math.abs(best.d).toFixed(1)}</span>`}
 else{const d=chg(m);if(d!=null){const a=Math.abs(d)<.3;delta=`<span class="delta ${a?'':d>0?'up':'dn'}">${a?'■ '+m.n+' steady vs last week':(d>0?'▲ ':'▼ ')+m.n+(d>0?' up ':' down ')+Math.abs(d).toFixed(1)+' vs last week'}</span>`}}
 const cd=S.checkins.filter(c=>dk(c.ts)===k).sort((a,b)=>a.ts-b.ts),l=cd[cd.length-1];
 let head='No check-in yet',sub=isT?'Check in above and your day appears here.':'Nothing was logged on this day.';
 if(l&&l.mood!=null){head=MET[0].lab[lvl(l.mood)];const sfx=l.focus!=null&&l.focus>=7?'with '+MET[2].lab[lvl(l.focus)].toLowerCase()+' focus':l.energy!=null&&l.energy<5?'with low energy':l.mot!=null&&l.mot>=7?'and '+MET[3].lab[lvl(l.mot)].toLowerCase():'';head+=sfx?', '+sfx:'';sub=''}
 const W=320,H=150,L=30,Rr=12,T=14,B=30,X=i=>L+i*(W-L-Rr)/6,Y=v=>T+(1-v/10)*(H-T-B);
 const dl=[0,1,2,3,4,5,6].map(i=>addDays(end,i-6));
 const lines=(all?MET:[m]).map(x=>{const d=ser(x),have=d.filter(z=>z.v!=null),last=have[have.length-1],fix=all?metFix(x):(last?metCol(x,last.v):'var(--dim)');
  const segs=[];let c2=[];d.forEach((z,i)=>{if(z.v==null){if(c2.length)segs.push(c2);c2=[]}else c2.push([X(i),Y(z.v)])});if(c2.length)segs.push(c2);
  const gid='tg'+x.k,multi=segs.filter(s=>s.length>1);
  const area=all?'':multi.map(s=>`<path d="${curvePath(s)} L${s[s.length-1][0].toFixed(1)} ${Y(0)} L${s[0][0].toFixed(1)} ${Y(0)}Z" fill="url(#${gid})"/>`).join('');
  const line=multi.map(s=>`<path class="ln" pathLength="1" d="${curvePath(s)}" fill="none" stroke="${fix}" stroke-width="${all?2.4:3.2}" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  const dots=all?'':d.map((z,i)=>z.v==null||z===last?'':`<circle cx="${X(i)}" cy="${Y(z.v)}" r="3.6" fill="${metCol(x,z.v)}" stroke="var(--card)" stroke-width="2"/>`).join('');
  let end2='';if(last){const li=d.indexOf(last),px=X(li),py=Y(last.v);
   end2=all?`<circle cx="${px}" cy="${py}" r="4.6" fill="${fix}" stroke="var(--card)" stroke-width="2"/>`:`<line x1="${px}" y1="${py}" x2="${px}" y2="${Y(0)}" stroke="${fix}" stroke-width="1.5" stroke-dasharray="3 4" opacity=".55"/><circle cx="${px}" cy="${py}" r="9" fill="${fix}" opacity=".22"/><circle cx="${px}" cy="${py}" r="5.2" fill="${fix}" stroke="var(--card)" stroke-width="2.5"/><g transform="translate(${Math.min(Math.max(px,L+14),W-Rr-14)} ${Math.max(py-26,2)})"><rect x="-17" y="-2" width="34" height="20" rx="10" fill="${fix}"/><text x="0" y="12.5" text-anchor="middle" font-size="11.5" font-weight="800" fill="${x.k==='focus'?'var(--bg)':'#0a0a0a'}">${Math.round(last.v*10)/10}</text></g>`}
  return {def:all?'':`<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${fix};stop-opacity:.34"/><stop offset="1" style="stop-color:${fix};stop-opacity:0"/></linearGradient>`,body:area+line+dots+end2,have:have.length}}).reduce((a,x)=>({def:a.def+x.def,body:a.body+x.body,have:a.have+x.have}),{def:'',body:'',have:0});
 const grid=[0,5,10].map(v=>`<line x1="${L}" y1="${Y(v)}" x2="${W-Rr}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1" ${v===5?'stroke-dasharray="4 5"':''}/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--mute)">${v}</text>`).join('');
 const lab=dl.map((t,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" ${t===end?'font-weight="800" fill="var(--fg)"':'fill="var(--mute)"'}>${t===end&&isT?'Today':new Date(t).toLocaleDateString('en-US',{weekday:'short'}).slice(0,3)}</text>`).join('');
 const empty=lines.have?'':`<text x="${W/2}" y="${H/2-4}" text-anchor="middle" font-size="13" fill="var(--mute)">No check-ins in the last 7 days</text>`;
 const lc1=all?'var(--fg)':(()=>{const d=ser(m).filter(z=>z.v!=null);return d.length?metCol(m,d[d.length-1].v):'var(--dim)'})();
 const pick=`<button class="chip sm ${all?'on':''}" data-a="trendM" data-v="all"><span class="tdots"><i style="background:var(--mood)"></i><i style="background:var(--ok)"></i><i style="background:var(--fg)"></i><i style="background:var(--info)"></i></span>All</button>`+MET.map(x=>`<button class="chip sm ${x.k===mk?'on':''}" data-a="trendM" data-v="${x.k}"><i class="tdot" style="background:${metFix(x)}"></i>${x.n}</button>`).join('');
 return `<div class="card trend"><div class="eyebrow">How you are doing</div><div class="tbig">${esc(head)}</div>${sub?`<p class="muted small" style="margin:4px 0 0">${sub}</p>`:''}<div style="margin-top:8px">${delta}</div>

 const cards=all.map(([id,n,w])=>{const p=sc.parts.find(x=>x.id===id),col={tasks:'var(--ok)',study:'var(--warn)',time:'var(--info)'}[id];
  if(!p)return `<div class="card" style="opacity:.7"><div class="row"><h3 style="margin:0">${n}</h3><span class="muted small">${w}% of score</span></div><p class="muted small gap">No data for this part, so it is left out and the rest are scaled up.</p></div>`;
  const pct=Math.round(p.r*100);return `<div class="card"><div class="row"><h3 style="margin:0">${n}</h3><span class="muted small">${w}% of score</span></div><div class="row gap"><span class="muted">${esc(p.line)}</span><b>${pct}% → ${Math.round(p.r*w)} of ${w}</b></div><div class="bar gap"><i style="width:${pct}%;background:${col}"></i></div></div>`}).join('');
 return pageHdr('Today’s score')+head+cards+`<div class="card"><h3>How it works</h3><p class="muted small">If a part has no data, such as no tasks planned, it is left out and the rest are scaled up. Missing data is never counted as zero. The score describes one day only. It says nothing about you as a person.</p><button class="btn sec gap" data-a="sheet" data-s="weights">Change the weights</button></div>`};

 S2.ui=S.ui;S2.settings=S.settings;S2.name=S.name||'Sumit';S2.tab='home';S=S2;S.sample=true;resetTkFrame();save();flush&&flush();R.sel=today();R.wk=weekStart(R.sel);R.stack=[];R.page=null;applyUI();render(true);toast('Sample data loaded')}

A.saveName=()=>{S.name=$('#nm').value.trim();save();closeSheet();render()};

A.wipe=()=>{try{localStorage.removeItem(KEY)}catch(e){}S=defaults();applyUI();R.stack=[];R.page=null;R.sheet=null;R.sel=today();R.wk=weekStart(R.sel);render(true);toast('Local data deleted')};
function applyUI(){const r=document.documentElement;S.ui.style='b';r.dataset.ui='b';if(S.ui.theme==='system')delete r.dataset.theme;else r.dataset.theme=S.ui.theme}

PAGES.import=()=>pageHdr('Import backup')+`<div class="card"><p class="muted small">Paste a backup you exported earlier. It replaces what is on this phone now.</p><textarea class="inp copy gap" id="imp" placeholder="Paste backup here"></textarea><button class="btn gap" data-a="doImport">Import</button></div>`;

PAGES.settingsOld=()=>pageHdr('Pomodoro and reminders')+`<div class="card"><div class="eyebrow">Merge slot</div><h3 style="margin-top:6px">Your Settings pages go here</h3><p class="muted small">The settings pages are built separately and merge in later. The timer already reads these values.</p><div class="list gap"><div class="li"><span>Focus</span><span class="v">${S.settings.focus} min</span></div><div class="li"><span>Short break</span><span class="v">${S.settings.short} min</span></div><div class="li"><span>Long break</span><span class="v">${S.settings.long} min</span></div><div class="li"><span>Blocks per set</span><span class="v">${S.settings.blocks}</span></div></div></div>`;

/* ----- history ----- */
PAGES.history=()=>{const k=dk(R.hdate),m=R.hmode;
 const seg=`<div class="seg">${[['time','Time'],['tasks','Tasks'],['mood','Mood']].map(([a,n])=>`<button class="${m===a?'on':''}" data-a="hmode" data-v="${a}">${n}</button>`).join('')}</div>`;
 let body='';
 if(m==='time'){
  const es=entriesOn(k,false).sort((a,b)=>a.start-b.start),ns=S.naps.filter(n=>dk(n.start)===k).map(n=>({nap:1,start:n.start,end:n.end,id:n.id}));
  const all=[...es,...ns].sort((a,b)=>a.start-b.start);let prev=null,rows='';
  all.forEach(e=>{if(prev&&e.start-prev>=15*6e4)rows+=`<div class="trow" style="grid-template-columns:1fr auto"><span class="muted small">No time tracked ${fmtD((e.start-prev)/6e4)} · ${fmtT(prev)} – ${fmtT(e.start)}</span><button class="chip sm" data-a="sheet" data-s="logtime" data-q='{"day":${R.hdate},"s":${prev},"e":${e.start}}'>+ Log</button></div>`;
   rows+=e.nap?`<div class="trow"><i class="cbar" style="--bc:var(--w-sleep)"></i><div><b>Nap</b><div class="muted small">${fmtT(e.start)} – ${fmtT(e.end)}</div></div><b>${fmtD(mins(e))}</b></div>`:`<button class="trow" data-a="sheet" data-s="entry" data-q='{"id":"${e.id}"}' style="width:100%"><i class="cbar" style="--bc:${catCol(e.catId)}"></i><div><b>${esc(catLabel(e.catId))}</b><div class="muted small">${fmtT(e.start)} – ${fmtT(e.end)}${e.focus!=null?' · focus '+e.focus:''}</div></div><b>${fmtD(mins(e))}</b></button>`;prev=Math.max(prev||0,e.end)});
  body=`<div class="card">${rows||'<div class="empty"><b>No time logged</b>Start the timer or log time by hand.</div>'}</div><button class="btn" data-a="sheet" data-s="logtime" data-q='{"day":${R.hdate}}'>${I.plus} Log time</button>`}
 else if(m==='tasks'){const t=S.tasks[k],L=S.taskLog.filter(x=>dk(x.ts)===k);
  body=`<div class="card"><div class="tiles two"><div class="tile"><b>${t?t.done:0}</b><small>done</small></div><div class="tile"><b>${t?t.planned:0}</b><small>planned</small></div></div>${L.length?`<div class="list gap">${L.map(x=>`<div class="li"><span>${esc(x.title)}</span><span class="muted small">${fmtT(x.ts)}</span></div>`).join('')}</div>`:''}${!t?'<p class="muted small gap center">No tasks recorded for this day.</p>':''}</div>`}
 else{const cs=S.checkins.filter(c=>dk(c.ts)===k).sort((a,b)=>a.ts-b.ts);
  body=`<div class="card">${cs.length?cs.map(checkinRow).join(''):'<div class="empty"><b>No check-ins</b>Nothing was recorded on this day.</div>'}</div>`}
 return pageHdr('History')+seg+dayNav('hdate',fmtDate(R.hdate,{weekday:'short',day:'numeric',month:'short'}))+body};
A.hmode=el=>{R.hmode=el.dataset.v;render()};
/* ===== Time: track (stopwatch, pomodoro, study goals), plan, sheets ===== */
const tmin=v=>{const [h,m]=v.split(':').map(Number);return h*60+m};
const minVal=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const catOptions=sel=>GROUPS.map(g=>`<optgroup label="${g.id}">${S.cats.filter(c=>c.group===g.id).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('');
const studyCats=()=>S.cats.filter(c=>c.group==='Study');
R.pdate=today();R.catEdit=false;
TABS.time=()=>`<div class="seg">${[['track','Track'],['plan','Plan']].map(([k,n])=>`<button class="${R.ttab===k?'on':''}" data-a="ttab" data-v="${k}">${n}</button>`).join('')}</div>`+(R.ttab==='plan'?planView():trackView());
A.ttab=el=>{R.ttab=el.dataset.v;render()};

function studyCard(){const k=dk(today()),sm=grpMin(k,'Study'),T=S.studyTarget,left=Math.max(0,T-sm);
 const subj=studyCats().filter(c=>c.goal>0||catMin(k,c.id)>0);
 let ex='';if(S.exam){const d=Math.ceil((k2t(S.exam.date)-today())/864e5);ex=`<button class="exb" data-a="sheet" data-s="exam" aria-label="Exam countdown"><b>${d>0?d:d===0?'0':'–'}</b><small>${d>0?'day'+(d===1?'':'s')+' to '+esc(S.exam.name||'exam'):d===0?esc(S.exam.name||'Exam')+' today':'passed'}</small></button>`}
 else ex=`<button class="chip sm" data-a="sheet" data-s="exam">${I.plus} Exam date</button>`;
 const rows=subj.map(c=>{const m=catMin(k,c.id),g=c.goal||0;return `<button class="srow" data-a="sheet" data-s="goal" data-q='{"id":"${c.id}"}'><span class="sn">${esc(c.name)}</span><span class="sb"><i style="width:${g?Math.min(100,m/g*100):(m?100:0)}%"></i></span><span class="sv">${fmtH(m)}${g?' / '+fmtH(g):''}</span></button>`}).join('');
 return `<div class="card study"><div class="row"><div class="eyebrow" style="margin:0">Today’s study target</div>${ex}</div>
 <div class="row" style="gap:18px;margin-top:14px">${ringSvg(T?sm/T:0,118,11,'var(--warn)',`<text x="50%" y="52%" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="800" fill="var(--fg)">${T?Math.round(100*Math.min(1,sm/T)):0}%</text>`)}<div style="flex:1;min-width:0"><div><b style="font-size:34px;font-weight:800;letter-spacing:-.02em">${fmtH(sm)}</b></div><div class="muted small" style="margin:2px 0 12px">${sm>=T&&T?'Target reached':fmtH(left)+' to go'} · target ${fmtH(T)}</div><div class="stepper" style="min-height:42px"><button data-a="tgt" data-d="-1" aria-label="Lower target">−</button><b style="font-size:15px">${fmtH(T)}</b><button data-a="tgt" data-d="1" aria-label="Raise target">+</button></div></div></div>
 ${rows?`<div class="srows">${rows}</div>`:''}
 <button class="chip sm gap2" data-a="sheet" data-s="goal">${I.plus} Subject goal</button></div>`}
A.tgt=el=>{S.studyTarget=clamp(S.studyTarget+30*(+el.dataset.d),30,960);save();render()};

/* ----- activity picker ----- */
function catPicker(id,sel,o={}){return `<button type="button" class="pkbtn" id="${id}" data-a="pkOpen" data-val="${sel||''}" ${o.none?`data-none="${esc(o.none)}"`:''} ${o.cb?`data-cb="${o.cb}"`:''} ${o.off?'disabled':''} aria-haspopup="dialog"><i class="pkd" style="background:${sel?catCol(sel):'var(--dim)'}"></i><span class="pkl">${esc(sel?catLabel(sel):(o.none||'Choose activity'))}</span>${I.next}</button>`}
function setPicker(id,v){const t=$('#'+id);if(!t)return;t.dataset.val=v||'';$('.pkl',t).textContent=v?catLabel(v):(t.dataset.none||'Choose activity');$('.pkd',t).style.background=v?catCol(v):'var(--dim)'}
let _pkT=null;
A.pkOpen=el=>{_pkT=el.id;const sel=el.dataset.val,none=el.dataset.none;
 const rec=[];S.entries.slice().sort((a,b)=>b.end-a.end).forEach(e=>{if(cat(e.catId)&&!rec.includes(e.catId)&&rec.length<5)rec.push(e.catId)});
 const it=c=>`<button class="pk-it ${c.id===sel?'on':''}" data-a="pkPick" data-v="${c.id}" data-n="${esc((c.name+' '+c.group).toLowerCase())}"><i class="pkd" style="background:${gcol(c.group)}"></i>${esc(c.name)}</button>`;
 const html=`<div class="sbg" id="pk" data-a="pkbg" style="z-index:60"><div class="sheet" role="dialog" aria-label="Choose activity"><div class="grab"></div><h2>Choose activity</h2><input class="inp" placeholder="Search" data-live="pks" autocomplete="off" aria-label="Search activities">
 ${none?`<button class="pk-it none ${!sel?'on':''}" data-a="pkPick" data-v="" style="margin-top:12px">${esc(none)}</button>`:''}
 ${rec.length?`<div class="pk-g"><div class="grp">Recent</div><div class="chips-w">${rec.map(id=>it(cat(id))).join('')}</div></div>`:''}
 ${GROUPS.map(g=>`<div class="pk-g"><div class="grp" style="color:${g.c}">${g.id}</div><div class="chips-w">${S.cats.filter(c=>c.group===g.id).map(it).join('')}</div></div>`).join('')}</div></div>`;
 $('.phone').insertAdjacentHTML('beforeend',html)};
A.pkbg=(el,e)=>{if(e.target===el)el.remove()};
A.pkPick=el=>{const t=$('#'+_pkT);const v=el.dataset.v;$('#pk').remove();if(!t)return;setPicker(_pkT,v);if(t.dataset.cb&&A[t.dataset.cb])A[t.dataset.cb](t)};

/* ----- stopwatch / pomodoro card (lives on Home) ----- */
function timerCard(){const r=S.running,mode=r?(r.mode==='pomo'?'pomo':'sw'):(S.tmode||'sw');
 if(!R.selCat||!cat(R.selCat))R.selCat=(S.lastCat&&cat(S.lastCat)?S.lastCat:studyCats()[0].id);
 const sel=r?r.catId:R.selCat;let clock,btn='',bar='';
 if(r){clock=runText();
  if(r.mode==='pomo'){bar=`<div class="bar gap"><i data-t="runbar" style="width:${r.waiting?100:(100*(Date.now()-r.phaseStart)/r.dur).toFixed(1)}%"></i></div>`;
   if(r.waiting)btn=`<button class="btn" data-a="nextPhase">Start ${r.next==='focus'?'next focus block':r.next==='long'?'long break':'short break'}</button>`}
  if(!r.waiting)btn+=`<button class="btn ${btn?'gap':''}" data-a="${r.pausedAt?'resume':'pause'}">${r.pausedAt?'Resume':'Pause'}</button>`;
  btn+=`<button class="btn dng gap" data-a="stop">Stop and save</button>`}
 else{clock=mode==='pomo'?String(S.settings.focus).padStart(2,'0')+':00':'00:00:00';btn=`<button class="btn" data-a="start">Start</button>`}
 const lab=r?(r.pausedAt?'Paused':r.mode==='pomo'?(r.waiting?'Ready':r.phase==='focus'?'Focus · block '+r.block:'Break'):'Running'):(mode==='pomo'?'Pomodoro ready':'Stopwatch ready');
 return `<div class="card"><div class="seg sm" style="${r?'opacity:.5;pointer-events:none':''}"><button class="${mode==='sw'?'on':''}" data-a="tmode" data-v="sw">Stopwatch</button><button class="${mode==='pomo'?'on':''}" data-a="tmode" data-v="pomo">Pomodoro</button></div>
 <div class="gap2">${catPicker('home-cat',sel,{cb:'homeCat',off:!!r})}</div>
 <div class="eyebrow center gap2">${esc(lab)}</div><div class="runbig center" data-t="run" style="margin-top:6px">${clock}</div>${bar}<div class="gap2">${btn}</div>
 <p class="center small muted gap"><button class="link" data-a="go" data-p="settings">Focus ${S.settings.focus} · Break ${S.settings.short} · Long break ${S.settings.long} · Settings</button></p></div>`}
A.homeCat=el=>{R.selCat=el.dataset.val;render()};

/* ----- Time > Track ----- */
function ctile(c,run){const k=dk(today()),m=catMin(k,c.id),g=c.goal||0,live=run&&run.catId===c.id;
 return `<button class="ctile ${live?'live':''}" style="--cc:${gcol(c.group)}" ${R.catEdit?`data-a="sheet" data-s="catedit" data-q='{"id":"${c.id}"}'`:`data-a="catgo" data-v="${c.id}"`} aria-label="${esc(c.name)}${live?', running, tap to stop':', tap to start'}"><span class="cn">${esc(c.name)}</span><b ${live?'data-t="run"':''}>${live?runText():(m?fmtH(m):'–')}</b><small>${R.catEdit?'Edit':live?'Tap to stop':m?'today · tap to start':'Tap to start'}</small>${g?`<span class="gb"><i style="width:${Math.min(100,m/g*100)}%"></i></span>`:''}</button>`}
function trackView(){const run=S.running;
 const strip=run?`<div class="card row runstrip"><div><div class="eyebrow" style="margin:0">${run.pausedAt?'Paused':run.mode==='pomo'?'Pomodoro':'Tracking'} · ${esc(catLabel(run.catId))}</div><div class="runbig" data-t="run" style="font-size:34px;margin-top:6px">${runText()}</div></div><div class="btns" style="gap:8px;flex:none">${run.waiting?'':`<button class="btn sm sec" data-a="${run.pausedAt?'resume':'pause'}">${run.pausedAt?'Resume':'Pause'}</button>`}<button class="btn dng sm" data-a="stop">Stop</button></div></div>`:'';
 const groups=GROUPS.map(g=>{const cs=S.cats.filter(c=>c.group===g.id);const tot=grpMin(dk(today()),g.id);return `<div class="cg"><div class="row cgh"><span class="grp" style="color:${g.c};margin:0">${g.id}</span><span class="muted small">${tot?fmtH(tot)+' today':''}</span></div><div class="ctiles">${cs.map(c=>ctile(c,run)).join('')}</div></div>`}).join('');
 return studyCard()+strip+`<div class="card"><div class="row"><h3 style="margin:0">Activities</h3><button class="link small" data-a="catedit">${R.catEdit?'Done':'Edit'}</button></div><p class="muted small" style="margin:6px 0 0">${R.catEdit?'Tap an activity to rename or delete it.':run?'Tap another activity to switch, or the running one to stop.':'Tap an activity to start tracking right away.'}</p>${groups}<div class="btns eq gap2"><button class="btn sec" data-a="sheet" data-s="newcat">${I.plus} New activity</button><button class="btn sec" data-a="sheet" data-s="logtime" data-q='{"day":${today()}}'>${I.plus} Log manually</button></div></div>`}
A.catgo=el=>{const id=el.dataset.v,r=S.running;R.selCat=id;
 if(r&&r.catId===id){stopRun();return}
 if(r&&r.pausedAt){toast('Another activity is paused. Resume or stop it first.');return}
 const m=r?r.mode:(S.tmode||'sw');if(r)stopRun();startRun(id,m);toast('Tracking '+catLabel(id))};
A.tmode=el=>{S.tmode=el.dataset.v;save();render()};A.catedit=()=>{R.catEdit=!R.catEdit;render()};
A.pause=()=>pauseRun();A.resume=()=>resumeRun();A.start=()=>{if(S.running)return;startRun(R.selCat,S.tmode||'sw')};A.nextPhase=()=>nextPhase();

/* ----- plan ----- */
const HH=56,H0=5,H1=24;
function planView(){const k=dk(R.pdate),isT=R.pdate===today(),blocks=S.plan.filter(b=>b.day===k),tr=entriesOn(k).filter(e=>(e.end-R.pdate)/6e4>H0*60);
 const nav=`<div class="row" style="margin-bottom:12px"><button class="back" data-a="pnav" data-d="-1" aria-label="Previous day">${I.back}</button><b>${fmtDate(R.pdate,{weekday:'short',day:'numeric',month:'short'})}</b><button class="back" data-a="pnav" data-d="1" aria-label="Next day">${I.next}</button></div>`;
 const quick=`<div class="chips-w" style="margin-bottom:12px">${['Study','College','Health','Commute'].map(g=>`<button class="chip" data-a="sheet" data-s="block" data-q='{"day":"${k}","g":"${g}"}'>${g}</button>`).join('')}</div>`;
 let grid='';for(let h=H0;h<H1;h++){const y=(h-H0)*HH;grid+=`<div class="hr" style="top:${y}px"><span>${h%12||12}${h<12||h===24?' AM':' PM'}</span></div><button aria-label="Add block at ${h}:00" data-a="sheet" data-s="block" data-q='{"day":"${k}","s":${h*60}}' style="position:absolute;left:44px;right:0;top:${y}px;height:${HH}px"></button>`}
 const top=m=>clamp((m-H0*60)/60*HH,0,(H1-H0)*HH);
 const bl=blocks.map(b=>{const t=top(b.s),h=Math.max(28,top(b.e)-t);return `<button class="blk" style="--bc:${catCol(b.catId)};top:${t}px;height:${h}px" data-a="sheet" data-s="block" data-q='{"id":"${b.id}"}'>${esc(catLabel(b.catId))}<small>${fmtT(atTime(R.pdate,minVal(b.s)))} – ${fmtT(atTime(R.pdate,minVal(b.e)))}</small></button>`}).join('');
 const trk=tr.map(e=>{const s=(e.start-R.pdate)/6e4,en=(e.end-R.pdate)/6e4,t=top(s);return `<i class="trk" style="--bc:${catCol(e.catId)};top:${t}px;height:${Math.max(4,top(en)-t)}px"></i>`}).join('');
 let now='';if(isT){const m=(Date.now()-R.pdate)/6e4;if(m>=H0*60&&m<=H1*60)now=`<i class="now" style="top:${top(m)}px"></i>`}
 return nav+quick+`<div class="card" style="padding:14px 12px"><div class="plan" style="height:${(H1-H0)*HH}px">${grid}${bl}${trk}${now}</div></div><p class="muted small center">Tap an hour to add a block, or a block to edit it. The thin bar on the right shows what you tracked.</p>`}
A.pnav=el=>{R.pdate=addDays(R.pdate,+el.dataset.d);render()};

/* ----- sheets ----- */
SHEETS.logtime=P=>{const day=P.day||today(),isT=day===today();
 let s=P.s,e=P.e;if(!e){e=isT?Date.now():atTime(day,'18:00');s=e-30*6e4}
 return `<h2>Log time</h2><label class="lbl" for="lt-c">Category</label>${catPicker('lt-c',R.selCat)}<label class="lbl" for="lt-d">Date</label><input class="inp" type="date" id="lt-d" value="${dk(day)}" max="${dk(today())}"><div class="two"><div><label class="lbl" for="lt-s">Start</label><input class="inp" type="time" id="lt-s" value="${hhmm(s)}"></div><div><label class="lbl" for="lt-e">End</label><input class="inp" type="time" id="lt-e" value="${hhmm(e)}"></div></div><div class="btns"><button class="btn sec" data-a="close">Cancel</button><button class="btn" data-a="saveLog">Save</button></div>`};
A.saveLog=()=>{const d=k2t($('#lt-d').value),s=atTime(d,$('#lt-s').value),e=atTime(d,$('#lt-e').value);if(!(e>s)){toast('End must be after start');return}if(e>Date.now()){toast('That time is in the future');return}

 <div class="row gap2"><div><b>Bedtime is approximate</b><div class="muted small">Marked with a ~ and kept apart from exact times.</div></div>${toggle('sl-ap',ed&&ed.approx,'slAp','Approximate bedtime')}</div>

 const days=[...Array(7)].map((_,i)=>addDays(td,i-6)),nights=days.map(d=>S.sleep.find(s=>s.date===dk(d)));
 const bars=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px">${nights.map(n=>n?`<div style="height:${Math.min(100,sdur(n)/60/10*100)}%;border-radius:10px;background:linear-gradient(var(--w-focus),var(--w-sleep))" title="${fmtD(sdur(n))}"></div>`:`<div class="dash" style="height:60%;border-radius:10px"></div>`).join('')}</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:6px;text-align:center" class="muted tiny">${days.map(d=>`<span>${'SMTWTFS'[new Date(d).getDay()]}</span>`).join('')}</div>`;
 const rec=S.sleep.filter(s=>days.some(d=>dk(d)===s.date)),bm=rec.map(bedMin),wm=rec.map(wakeMin);
 const last7=`<div class="card"><div class="row"><h3 style="margin:0">Last 7 nights</h3><span class="muted small">Duration</span></div><div class="gap2">${bars}</div>${rec.length<7?`<p class="muted small gap">${7-rec.length} night${7-rec.length===1?'':'s'} not recorded. They stay blank and are not counted.</p>`:''}<div class="list gap"><div class="li"><span>Typical bedtime</span><span class="v">${rec.length>1?clock((avg(bm)+1080)%1440)+' ± '+Math.round(sdv(bm))+' min':'Needs 2+ nights'}</span></div><div class="li"><span>Typical wake time</span><span class="v">${rec.length>1?clock(avg(wm))+' ± '+Math.round(sdv(wm))+' min':'Needs 2+ nights'}</span></div></div>${rec.length?`<p class="muted small gap">Based on ${rec.length} recorded night${rec.length===1?'':'s'}.</p>`:''}</div>`;

function insights(){
 const out=[],by={};S.checkins.forEach(c=>(by[dk(c.ts)]=by[dk(c.ts)]||[]).push(c));
 const wm=(k,w,m)=>avg((by[k]||[]).filter(c=>winOf(new Date(c.ts).getHours())===w&&c[m]!=null).map(c=>c[m]));
 const rng=ks=>{const s=[...ks].sort();return s.length?fmtDate(k2t(s[0]),{day:'numeric',month:'short'})+(s.length>1?' – '+fmtDate(k2t(s[s.length-1]),{day:'numeric',month:'short'}):''):''};
 const push=o=>{const [lab,cls]=evLabel(o.n,o.insuff,o.id);out.push(Object.assign({lab,cls},o))};
 // 1 sleep quality vs morning energy
 let P=S.sleep.filter(s=>s.q!=null).map(s=>({k:s.date,a:s.q,b:wm(s.date,'Morning','energy')})).filter(p=>p.b!=null),hi=P.filter(p=>p.a>=8),lo=P.filter(p=>p.a<8);
 if(S.sleep.some(s=>s.q!=null)){const ins=P.length<3||!hi.length||!lo.length,A1=avg(hi.map(p=>p.b)),B1=avg(lo.map(p=>p.b));
  push({id:'sq-me',title:'Morning energy and sleep quality',n:P.length,insuff:ins,range:rng(P.map(p=>p.k)),text:ins?`Only ${P.length} night${P.length===1?'':'s'} ${P.length===1?'has':'have'} both a sleep rating and a morning energy rating, and they need to include better and lower-rated nights.`:`Morning energy averaged ${r1(A1)} after nights rated Good or better and ${r1(B1)} after the rest.`,
   rec:{head:['Date','Sleep quality','Morning energy','Used'],rows:P.map(p=>[fmtDate(k2t(p.k),{weekday:'short',day:'numeric'}),QL[p.a/2-1],r1(p.b),p.a>=8?'Good or better':'Under Good'])},
   method:['Took mornings with a sleep quality rating and a morning energy rating.',`Split them: Good or better (${hi.length}) and the rest (${lo.length}).`,`Compared average morning energy: ${r1(A1)} and ${r1(B1)}.`]})}
 // 2 sleep duration vs morning energy
 P=S.sleep.map(s=>({k:s.date,a:sdur(s)/60,b:wm(s.date,'Morning','energy')})).filter(p=>p.b!=null);hi=P.filter(p=>p.a>=7);lo=P.filter(p=>p.a<6);
 if(P.length){const ins=hi.length+lo.length<3||!hi.length||!lo.length;
  push({id:'sd-me',title:'Sleep length and morning energy',n:hi.length+lo.length,insuff:ins,range:rng(P.map(p=>p.k)),text:ins?`Not enough nights with both 7h+ and under 6h of sleep and a morning energy rating yet.`:`Morning energy averaged ${r1(avg(hi.map(p=>p.b)))} after 7h or more and ${r1(avg(lo.map(p=>p.b)))} after under 6h.`,
   rec:{head:['Date','Slept','Morning energy','Used'],rows:P.map(p=>[fmtDate(k2t(p.k),{weekday:'short',day:'numeric'}),fmtD(p.a*60),r1(p.b),p.a>=7?'7h+':p.a<6?'Under 6h':'Left out'])},
   method:['Took nights with a morning energy rating.','Grouped them: 7h or more, and under 6h. Nights in between are left out.','Compared the averages of each group.']})}
 // 3 afternoon vs morning
 const dd=Object.keys(by).map(k=>({k,m:wm(k,'Morning','energy'),a:wm(k,'Afternoon','energy')})).filter(d=>d.m!=null&&d.a!=null);
 if(dd.length){const low=dd.filter(d=>d.a<d.m).length,ins=dd.length<3;
  push({id:'pm-am',title:'Afternoon and morning energy',n:dd.length,insuff:ins,range:rng(dd.map(d=>d.k)),text:ins?`Only ${dd.length} day${dd.length===1?'':'s'} with both a morning and an afternoon energy rating.`:`Afternoon energy was lower than morning on ${low} of ${dd.length} days with both.`,
   rec:{head:['Date','Morning','Afternoon','Used'],rows:dd.map(d=>[fmtDate(k2t(d.k),{weekday:'short',day:'numeric'}),r1(d.m),r1(d.a),d.a<d.m?'Lower':d.a>d.m?'Higher':'Same'])},method:['Took days with energy rated in both windows.','Averaged each window per day.',`Counted days where the afternoon average was lower: ${low}.`]})}
 // 4 mood by time of day
 const W=['Morning','Afternoon','Evening','Night'].map(w=>{const a=S.checkins.filter(c=>c.mood!=null&&winOf(new Date(c.ts).getHours())===w).map(c=>c.mood);return{w,n:a.length,v:avg(a)}}).filter(x=>x.n>=2);
 if(W.length>=2){const s=[...W].sort((a,b)=>b.v-a.v),tn=W.reduce((a,x)=>a+x.n,0);
  push({id:'tod',title:'Mood through the day',n:tn,insuff:false,range:rng(Object.keys(by)),text:`Mood was highest in the ${s[0].w.toLowerCase()} (${r1(s[0].v)}) and lowest in the ${s[s.length-1].w.toLowerCase()} (${r1(s[s.length-1].v)}).`,
   rec:{head:['Window','Check-ins','Avg mood'],rows:W.map(x=>[x.w,x.n,r1(x.v)])},method:['Put each check-in with a mood rating into its time-of-day window.','Left out windows with fewer than 2 check-ins.','Compared the average mood of each window.']})}
 // 5 activity and mood
 const overall=avg(S.checkins.filter(c=>c.mood!=null).map(c=>c.mood)),G={};
 S.checkins.filter(c=>c.mood!=null).forEach(c=>{let id=c.catId;if(!id){const e=S.entries.find(e=>e.start<=c.ts&&e.end>=c.ts-60000);id=e&&e.catId}if(id)(G[id]=G[id]||[]).push({k:dk(c.ts),m:c.mood})});
 const gl=Object.keys(G).filter(id=>G[id].length>=2&&cat(id)).map(id=>({id,n:G[id].length,d:avg(G[id].map(x=>x.m))-overall}));
 if(gl.length){const s=[...gl].sort((a,b)=>b.d-a.d),top=s[0],bot=s[s.length-1],n=gl.reduce((a,x)=>a+x.n,0);
  push({id:'act',title:'What goes with your mood',n,insuff:false,range:rng(Object.keys(by)),text:(top.d>0?`Mood was higher around ${cat(top.id).name} (${top.d>0?'+':''}${r1(top.d)})`:`Mood was closest to your average around ${cat(top.id).name}`)+(bot.id!==top.id&&bot.d<0?` and lower around ${cat(bot.id).name} (${r1(bot.d)}).`:'.'),
   rec:{head:['Activity','Check-ins','Mood vs your average'],rows:s.map(x=>[cat(x.id).name,x.n,(x.d>0?'+':'')+r1(x.d)])},method:['Linked each mood check-in to the activity you confirmed, or the timer running at that time.','Left out activities with fewer than 2 check-ins.',`Compared each activity’s average mood with your overall average (${r1(overall)}).`]})}
 // 6 focus by subject
 const F={};S.entries.filter(e=>e.focus!=null&&cat(e.catId)).forEach(e=>(F[e.catId]=F[e.catId]||[]).push(e.focus));
 const fl=Object.keys(F).filter(id=>F[id].length>=2).map(id=>({id,n:F[id].length,v:avg(F[id])}));
 if(fl.length>=2){const s=[...fl].sort((a,b)=>b.v-a.v);push({id:'fsub',title:'Focus by subject',n:fl.reduce((a,x)=>a+x.n,0),insuff:false,range:'Rated sessions',text:`Focus was rated highest in ${cat(s[0].id).name} (${r1(s[0].v)}) and lowest in ${cat(s[s.length-1].id).name} (${r1(s[s.length-1].v)}).`,
  rec:{head:['Subject','Sessions','Avg focus'],rows:s.map(x=>[cat(x.id).name,x.n,r1(x.v)])},method:['Took sessions where you rated your focus.','Left out subjects with fewer than 2 rated sessions.','Compared the average rating of each subject.']})}
 return out}

const INC=[['sleep','Sleep'],['energy','Energy'],['focus','Focus'],['mot','Motivation'],['mood','Mood and feelings'],['activity','Activity context'],['tasks','Tasks and discipline'],['study','Study']];
function wdata(from,to){const ks=[];for(let t=from;t<=to;t=addDays(t,1))ks.push(dk(t));
 const cs=S.checkins.filter(c=>ks.includes(dk(c.ts))).sort((a,b)=>a.ts-b.ts),nights=S.sleep.filter(s=>ks.includes(s.date));
 const m={};MET.forEach(x=>{const a=cs.filter(c=>c[x.k]!=null).map(c=>c[x.k]);m[x.k]={v:avg(a),n:a.length}});
 const fe={};cs.forEach(c=>(c.feelings||[]).forEach(f=>fe[f]=(fe[f]||0)+1));
 const ac={};ks.forEach(k=>entriesOn(k,false).forEach(e=>ac[e.catId]=(ac[e.catId]||0)+mins(e)));
 let p=0,d=0;ks.forEach(k=>{const t=S.tasks[k];if(t){p+=t.planned;d+=t.done}});
 const tod={Morning:0,Afternoon:0,Evening:0,Night:0};cs.forEach(c=>tod[winOf(new Date(c.ts).getHours())]++);
 return{ks,cs,nights,m,fe:Object.entries(fe).sort((a,b)=>b[1]-a[1]).slice(0,5),ac:Object.entries(ac).sort((a,b)=>b[1]-a[1]),tasks:{p,d},tod,
  daysWith:new Set(cs.map(c=>dk(c.ts))).size,events:S.events.filter(e=>ks.includes(dk(e.ts))).sort((a,b)=>a.ts-b.ts),
  sl:{n:nights.length,dur:avg(nights.map(sdur)),q:avg(nights.filter(x=>x.q!=null).map(x=>x.q)),bm:nights.map(bedMin)},
  study:ks.reduce((a,k)=>a+grpMin(k,'Study',false),0)}}

 sec('Data coverage',single?'This day':'',`<div class="list">${li('Days with check-ins',D.daysWith+' of '+D.ks.length)}${li('Nights recorded',D.sl.n+' of '+D.ks.length)}${kind==='monthly'?prevRow(from):''}</div>`);
