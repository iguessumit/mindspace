=\"false\" aria-label=\"Bedtime is approximate\"><\/button><\/div>\n    <div class=\"line\" id=\"sTolLine\" hidden><div><b>Give or take<\/b><small>How unsure the bedtime is.<\/small><\/div><div class=\"step\" data-k=\"tol\" data-step=\"5\" data-min=\"5\" data-max=\"60\"><button type=\"button\" data-d=\"-1\" aria-label=\"Less\">&minus;<\/button><output><\/output><button type=\"button\" data-d=\"1\" aria-label=\"More\">+<\/button><\/div><\/div>\n    <h3>Sleep quality<\/h3>\n    <div class=\"optrow\" id=\"sQ\"><\/div>\n    <h3>How rested do you feel?<\/h3>\n    <div class=\"optrow\" id=\"sR\"><\/div>\n    <h3>Details<\/h3>\n    <div class=\"line\"><b>Time to fall asleep<\/b><div class=\"step\" data-k=\"lat\" data-step=\"5\" data-max=\"120\" data-unit=\" min\"><button type=\"button\" data-d=\"-1\" aria-label=\"Less\">&minus;<\/button><output><\/output><button type=\"button\" data-d=\"1\" aria-label=\"More\">+<\/button><\/div><\/div>\n    <div class=\"line\"><b>Night awakenings<\/b><div class=\"step\" data-k=\"aw\" data-step=\"1\" data-max=\"20\" data-unit=\"\"><button type=\"button\" data-d=\"-1\" aria-label=\"Less\">&minus;<\/button><output><\/output><button type=\"button\" data-d=\"1\" aria-label=\"More\">+<\/button><\/div><\/div>\n    <div class=\"line\"><div><b>Morning energy<\/b><small>Optional, 0 to 10 after waking. <button type=\"button\" class=\"clr\" id=\"eClr\" hidden>Clear<\/button><\/small><\/div><div class=\"step\" data-k=\"energy\" data-step=\"1\" data-min=\"0\" data-max=\"10\"><button type=\"button\" data-d=\"-1\" aria-label=\"Less\">&minus;<\/button><output><\/output><button type=\"button\" data-d=\"1\" aria-label=\"More\">+<\/button><\/div><\/div>\n    <div class=\"line\"><div><b>My own total<\/b><small>Optional, if you know how long you slept. <button type=\"button\" class=\"clr\" id=\"estClr\" hidden>Clear<\/button><\/small><\/div><div class=\"step\" data-k=\"est\" data-step=\"15\" data-min=\"30\" data-max=\"960\"><button type=\"button\" data-d=\"-1\" aria-label=\"Less\">&minus;<\/button><output><\/output><button type=\"button\" data-d=\"1\" aria-label=\"More\">+<\/button><\/div><\/div>\n    <button type=\"button\" class=\"b-del\" id=\"sDel\" hidden>Delete night<\/button>\n    <div class=\"acts\">\n      <button type=\"button\" class=\"b-ghost\" data-close=\"sheetS\">Cancel<\/button>\n      <button type=\"submit\" class=\"b-main\" id=\"sSave\">Save sleep<\/button>\n    <\/div>\n  <\/form>\n<\/div>\n\n<!-- quick morning check-in -->\n<div class=\"sheet\" id=\"sheetK\" hidden>\n  <div class=\"scrim\" data-close=\"sheetK\"><\/div>\n  <form class=\"panel\" id=\"formK\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Morning check-in\" autocomplete=\"off\">\n    <div class=\"grab\"><\/div>\n    <div class=\"shead\"><h2>Morning check-in<\/h2><\/div>\n    <h3>Sleep &middot; last night<\/h3>\n    <div class=\"two\">\n      <div><label class=\"lab\" for=\"kBed\">Fell asleep<\/label><div class=\"fsel\"><input id=\"kBed\" type=\"time\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/><\/svg><\/div><\/div>\n      <div><label class=\"lab\" for=\"kWake\">Woke up<\/label><div class=\"fsel\"><input id=\"kWake\" type=\"time\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/><\/svg><\/div><\/div>\n    <\/div>\n    <div class=\"rng\" id=\"kRng\" role=\"group\" aria-label=\"Drag to shift both times in 5 minute steps\"><i><\/i><\/div>\n    <div class=\"rngl\" aria-hidden=\"true\"><span>12 AM<\/span><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5<\/span><span>6<\/span><span>7<\/span><span>8 AM<\/span><\/div>\n    <div class=\"dur\" id=\"kDur\">0h<\/div>\n    <p class=\"dnote\" id=\"kNote\"><\/p>\n    <h3>How rested do you feel?<\/h3>\n    <div class=\"optrow\" id=\"kR\"><\/div>\n    <h3>Morning energy<\/h3>\n    <div class=\"line\"><div><b>How is your energy?<\/b><small>Optional, 0 to 10. <button type=\"button\" class=\"clr\" id=\"kEClr\" hidden>Clear<\/button><\/small><\/div><div class=\"step\" id=\"kE\"><button type=\"button\" data-d=\"-1\" aria-label=\"Less\">&minus;<\/button><output><\/output><button type=\"button\" data-d=\"1\" aria-label=\"More\">+<\/button><\/div><\/div>\n    <div class=\"acts\">\n      <button type=\"button\" class=\"b-ghost\" data-close=\"sheetK\">Cancel<\/button>\n      <button type=\"submit\" class=\"b-main\" id=\"kSave\">Save check-in<\/button>\n    <\/div>\n  <\/form>\n<\/div>\n\n<!-- log / edit a nap -->\n<div class=\"sheet\" id=\"sheetP\" hidden>\n  <div class=\"scrim\" data-close=\"sheetP\"><\/div>\n  <form class=\"panel\" id=\"formP\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Log a nap\" autocomplete=\"off\">\n    <div class=\"grab\"><\/div>\n    <div class=\"shead\"><h2 id=\"pTitle\">Log a nap<\/h2><\/div>\n    <h3>Day<\/h3>\n    <div class=\"fsel\"><input id=\"pDate\" type=\"date\" aria-label=\"Nap day\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/><\/svg><\/div>\n    <div class=\"two\" style=\"margin-top:14px\">\n      <div><label class=\"lab\" for=\"pStart\">Started<\/label><div class=\"fsel\"><input id=\"pStart\" type=\"time\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/><\/svg><\/div><\/div>\n      <div><label class=\"lab\" for=\"pEnd\">Ended<\/label><div class=\"fsel\"><input id=\"pEnd\" type=\"time\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/><\/svg><\/div><\/div>\n    <\/div>\n    <div class=\"dur\" id=\"pDur\">0 min<\/div>\n    <p class=\"dnote\" id=\"pNote\">Naps are kept apart from night sleep.<\/p>\n    <button type=\"button\" class=\"b-del\" id=\"pDel\" hidden>Delete nap<\/button>\n    <div class=\"acts\">\n      <button type=\"button\" class=\"b-ghost\" data-close=\"sheetP\">Cancel<\/button>\n      <button type=\"submit\" class=\"b-main\" id=\"pSave\">Save nap<\/button>\n    <\/div>\n  <\/form>\n<\/div>\n\n<!-- calendar -->\n<div class=\"sheet\" id=\"sheetC\" hidden>\n  <div class=\"scrim\" data-close=\"sheetC\"><\/div>\n  <div class=\"panel\" id=\"panelC\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Choose a date\">\n    <div class=\"grab\"><\/div>\n    <div class=\"shead\"><h2>Choose a date<\/h2><\/div>\n    <div class=\"cmon\">\n      <button type=\"button\" id=\"cPrev\" aria-label=\"Previous month\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"/><\/svg><\/button>\n      <div class=\"ctitle\"><b id=\"cMonth\"><\/b><small id=\"cSub\"><\/small><\/div>\n      <button type=\"button\" id=\"cNext\" aria-label=\"Next month\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/><\/svg><\/button>\n    <\/div>\n    <div class=\"cdow\" aria-hidden=\"true\"><span>Mon<\/span><span>Tue<\/span><span>Wed<\/span><span>Thu<\/span><span>Fri<\/span><span>Sat<\/span><span>Sun<\/span><\/div>\n    <div class=\"cgrid\" id=\"cGrid\"><\/div>\n    <div class=\"cleg\"><span style=\"--c:#8A8C96\"><i><\/i>Under goal<\/span><span style=\"--c:#34D27B\"><i><\/i>Goal met<\/span><\/div>\n    <div class=\"cfoot\"><button type=\"button\" class=\"b-ghost wide\" id=\"cToday\">Go to today<\/button><\/div>\n  <\/div>\n<\/div>\n\n<script>\n(function(){\n'use strict';\nvar $ = function(s, r){ return (r || document).querySelector(s); };\nvar $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };\nvar REDUCE = false; try { REDUCE = matchMedia('(prefers-reduced-motion:reduce)').matches; } catch(e){}\nvar GOAL = 480, STORE = 'ms-sleep-v1';\nvar WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], WL = ['S','M','T','W','T','F','S'];\nvar MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nvar MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];\nvar QL = ['Poor','Fair','Okay','Good','Great'], RL = ['Not at all','Slightly','Okay','Rested','Fully rested'];\nvar QC = ['#FF6B5E','#8A8E99','#5EA8FF','#34D27B','#34D27B'];\n\n/* ---------- dates and times ---------- */\nfunction p2(n){ return (n < 10 ? '0' : '') + n; }\nfunction isoOf(d){ return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }\nfunction todayISO(){ return isoOf(new Date()); }\nfunction addDays(iso, n){ var d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoOf(d); }\nfunction diffDays(a, b){ return Math.round((new Date(a+'T00:00:00') - new Date(b+'T00:00:00'))/864e5); }\nfunction short(iso){ var d = new Date(iso+'T00:00:00'); return WD[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]; }\nfunction dayWord(iso){ var n = diffDays(iso, todayISO()); return n === 0 ? 'Today' : n === -1 ? 'Yesterday' : short(iso); }\nfunction mins(t){ var p = t.split(':'); return (+p[0])*60 + (+p[1]); }\nfunction tWord(t, approx){ var p = t.split(':'), h = +p[0], ap = h >= 12 ? 'PM' : 'AM'; h = h%12 || 12; return (approx ? '~' : '')+h+':'+p[1]+' '+ap; }\nfunction fromMin(m){ m = ((Math.round(m) % 1440) + 1440) % 1440; return p2(Math.floor(m/60))+':'+p2(m%60); }\nfunction dur(a, b){ var d = mins(b) - mins(a); if (d <= 0) d += 1440; return d; }\nfunction hm(m){ m = Math.round(m); var h = Math.floor(m/60), r = m%60; return h === 0 ? r+' min' : (r === 0 ? h+'h' : h+'h '+p2(r)+'m'); }\nfunction esc(s){ return String(s).replace(/[&<>\"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]; }); }\n\n/* ---------- data ---------- */\nvar nights = [], naps = [], nextId = 1;\nfunction load(){ var I = window.__INIT || {}; nights = (I.nights || []).slice(); naps = (I.naps || []).slice(); nextId = I.nextId || 1000; }\nfunction save(){ try { parent.postMessage({ms:1, type:'sleep', nights:nights, naps:naps, nextId:nextId}, '*'); } catch(e){} }\nfunction nightOn(d){ return nights.filter(function(n){ return n.date === d; })[0]; }\nfunction napsOn(d){ return naps.filter(function(n){ return n.date === d; }).sort(function(a, b){ return a.start < b.start ? -1 : 1; }); }\nfunction nd(n){ return n.total != null ? n.total : dur(n.bed, n.wake); }\nfunction r15(m){ return Math.round(m/15)*15; }\nfunction byId(arr, id){ return arr.filter(function(x){ return String(x.id) === String(id); })[0]; }\n\n/* ---------- view state ---------- */\nvar tab = 'nights', selDate = null, lastDel = null, toastTimer = null, booting = true;\nfunction viewDate(){ return selDate || todayISO(); }\n\n/* ---------- summary card ---------- */\nfunction setProg(pct){\n  var pf = $('.pf'); pf.style.width = pct+'%'; pf.classList.toggle('zero', pct === 0);\n  $('.prog').setAttribute('aria-valuenow', String(pct));\n}\nfunction renderSummary(grew){\n  var T = todayISO(), D = viewDate(), n = nightOn(D), nl = napsOn(D);\n  $('#dayLbl').textContent = short(D);\n  $('#dayBack').hidden = D === T; $('#dayTtl').hidden = D !== T;\n  var pct = 0;\n  if (n){\n    var m = nd(n); pct = Math.min(100, Math.round(m/GOAL*100));\n    $('#slBig').textContent = (n.approx ? '~' : '')+hm(m); $('#slBig').classList.remove('none');\n    $('#slGoal').textContent = m >= GOAL ? 'goal met' : 'of 8h goal';\n    var nap = nl.reduce(function(s, x){ return s + dur(x.start, x.end); }, 0);\n    $('#slLine').innerHTML = esc(tWord(n.bed, n.approx))+(n.approx && n.tol ? ' (&plusmn;'+n.tol+'m)' : '')+' &rarr; '+esc(tWord(n.wake))+' &middot; <b>'+QL[n.q-1]+'<\/b> sleep &middot; rested <b>'+esc(RL[n.r-1].toLowerCase())+'<\/b>'+(n.energy != null ? ' &middot; morning energy <b>'+n.energy+'/10<\/b>' : '')+(n.total != null ? '<br>Your own total is used, not the times.' : '')+(nap ? '<br>Plus '+hm(nap)+' of naps' : '');\n    $('#slLog').hidden = true; $('#slLine').hidden = false;\n    $('#slLeft').textContent = m >= GOAL ? 'Goal 8h reached' : hm(GOAL - m)+' short of 8h';\n  } else {\n    $('#slBig').textContent = 'No sleep logged'; $('#slBig').classList.add('none');\n    $('#slGoal').textContent = '';\n    $('#slLine').hidden = true; $('#slLog').hidden = false;\n    $('#slLeft').textContent = 'Goal 8h';\n  }\n  $('#slPct').textContent = pct+'%';\n  setProg(booting ? 0 : pct);\n  if (grew && !booting){ var pf = $('.pf'); pf.classList.remove('sh'); void pf.offsetWidth; pf.classList.add('sh'); }\n}\n\n/* ---------- list: nights and naps ---------- */\nvar list = $('#list');\nfunction ring(pct, met){\n  var c = 2*Math.PI*12;\n  return '<svg viewBox=\"0 0 30 30\" width=\"30\" height=\"30\" aria-hidden=\"true\"><circle cx=\"15\" cy=\"15\" r=\"12\" fill=\"none\" stroke=\"var(--n-25262b)\" stroke-width=\"3\"/><circle cx=\"15\" cy=\"15\" r=\"12\" fill=\"none\" stroke=\"'+(met ? '#34D27B' : 'var(--n-e9ebf2)')+'\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-dasharray=\"'+c.toFixed(2)+'\" stroke-dashoffset=\"'+(c*(1-Math.min(1,pct))).toFixed(2)+'\" transform=\"rotate(-90 15 15)\"/><\/svg>';\n}\nvar CLOCK = '<svg viewBox=\"0 0 30 30\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"var(--n-e9ebf2)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"15\" cy=\"15\" r=\"11.5\" stroke=\"var(--n-25262b)\" stroke-width=\"3\"/><path d=\"M15 9v6.5l4 2.5\"/><\/svg>';\nvar DEL_SVG = '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3\"/><\/svg>';\nfunction rowShell(id, k, inner, cur){\n  var li = document.createElement('li');\n  li.className = 'row'+(cur ? ' cur' : ''); li.dataset.id = id; li.dataset.k = k;\n  li.innerHTML = '<div class=\"rd\" aria-hidden=\"true\"><span class=\"rvt\">Swipe to delete<\/span>'+DEL_SVG+'<\/div><div class=\"in\">'+inner+'<\/div>';\n  return li;\n}\nfunction nightRow(n){\n  var m = nd(n), met = m >= GOAL;\n  return rowShell(n.id, 'n',\n    '<div class=\"chk\">'+ring(m/GOAL, met)+'<\/div><div class=\"body\"><div class=\"t\">'+(n.approx ? '~' : '')+hm(m)+'<\/div>'+\n    '<div class=\"sub\"><span class=\"pr\" style=\"--c:'+QC[n.q-1]+'\"><i><\/i>'+QL[n.q-1]+'<\/span><span class=\"st\">'+esc(dayWord(n.date))+'<\/span><\/div>'+\n    '<div class=\"sub2\">'+esc(tWord(n.bed, n.approx))+(n.approx && n.tol ? ' (&plusmn;'+n.tol+'m)' : '')+' &rarr; '+esc(tWord(n.wake))+(n.total != null ? ' &middot; your total' : '')+'<\/div><\/div>', n.date === viewDate());\n}\nfunction napRow(p){\n  var m = dur(p.start, p.end);\n  return rowShell(p.id, 'p',\n    '<div class=\"chk\">'+CLOCK+'<\/div><div class=\"body\"><div class=\"t\">'+hm(m)+'<\/div>'+\n    '<div class=\"sub2\">'+esc(tWord(p.start))+' &ndash; '+esc(tWord(p.end))+'<\/div><\/div>', false);\n}\nfunction grpEl(label, right){\n  var h = document.createElement('li'); h.className = 'grp'; h.innerHTML = '<b>'+esc(label)+'<\/b><span>'+esc(right)+'<\/span>'; return h;\n}\nvar EMPTY_IC = '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z\"/><\/svg>';\nfunction emptyEl(head, body, btn){\n  var e = document.createElement('li'); e.className = 'empty'; e.id = 'emptyMsg';\n  e.innerHTML = EMPTY_IC+'<b>'+esc(head)+'<\/b><span>'+esc(body)+'<\/span>'+(btn ? '<button type=\"button\" class=\"b-main emptyadd\">'+esc(btn)+'<\/button>' : '');\n  return e;\n}\nfunction renderList(){\n  var T = todayISO(); list.innerHTML = '';\n  if (tab === 'nights'){\n    if (viewDate() === T && !nightOn(T)){\n      var kc = document.createElement('li'); kc.className = 'kcard';\n      kc.innerHTML = '<b>Morning check-in<\/b><span>Log last night and your morning energy in about 20 seconds.<\/span><button type=\"button\" class=\"b-main kcheck\">Check in<\/button>';\n      list.appendChild(kc);\n    }\n    var all = nights.slice().sort(function(a, b){ return a.date < b.date ? 1 : -1; });\n    var recent = all.filter(function(n){ return diffDays(T, n.date) <= 6; }), older = all.filter(function(n){ return diffDays(T, n.date) > 6; });\n    if (!all.length){ list.appendChild(emptyEl('No sleep logged yet', 'Tap the plus button to log your first nigh  else if(d.type==='wipeAll'){try{localStorage.removeItem(KEY)}catch(e){}S=defaults();resetTkFrame();applyUI();R.stack=[];R.page=null;R.sheet=null;R.sel=today();R.wk=weekStart(R.sel);render(true);toast('All data deleted')}
 else if(d.type==='wipeWell'){S.checkins=[];S.events=[];S.sleep=[];S.naps=[];save();render()}
 else if(d.type==='export')doExport(d.o)}
function doExport(o){
 const td=today(),from=o.range==='all'?0:o.range==='custom'?(o.from?k2t(o.from):0):addDays(td,-(+o.range)),to=o.range==='custom'&&o.to?addDays(k2t(o.to),1):Infinity,inR=ts=>ts>=from&&ts<to,T=o.types||[];
 const rows=[],iso=ts=>new Date(ts).toISOString();
 if(T.includes('time'))S.entries.filter(e=>inR(e.start)).forEach(e=>rows.push({type:'time',start:iso(e.start),end:iso(e.end),title:catLabel(e.catId),detail:e.src||''}));
 if(T.includes('study'))S.entries.filter(e=>inR(e.start)&&(cat(e.catId)||{}).group==='Study').forEach(e=>rows.push({type:'study',start:iso(e.start),end:iso(e.end),title:catLabel(e.catId),detail:e.focus!=null?'focus '+e.focus:''}));
 if(T.includes('tasks'))((S.tk&&S.tk.tasks)||[]).filter(t=>inR(k2t(t.date||dk(td)))).forEach(t=>rows.push({type:'task',start:t.date||'',end:t.doneAt?iso(t.doneAt):'',title:t.title,detail:(t.done?'done':'pending')+', '+['Low','Medium','High'][(t.pri||2)-1]+', '+(t.list||'')}));
 if(T.includes('wellbeing')){S.checkins.filter(c=>inR(c.ts)).forEach(c=>rows.push({type:'check-in',start:iso(c.ts),end:'',title:MET.map(m=>c[m.k]!=null?m.n+' '+c[m.k]:'').filter(Boolean).join(', '),detail:(c.feelings||[]).join(', ')+(o.notes&&c.note?' | '+c.note:'')}));S.events.filter(x=>inR(x.ts)).forEach(x=>rows.push({type:'event',start:iso(x.ts),end:'',title:(x.feelings||[]).join(', '),detail:o.notes&&x.note?x.note:''}))}
 if(T.includes('sleep')){S.sleep.filter(s=>inR(s.bed||k2t(s.date))).forEach(s=>rows.push({type:'sleep',start:iso(s.bed),end:iso(s.wake),title:'Quality '+s.q+', rested '+s.rest,detail:s.approx?'approximate':''}));S.naps.filter(n=>inR(n.start)).forEach(n=>rows.push({type:'nap',start:iso(n.start),end:iso(n.end),title:'Nap',detail:''}))}
 let body,mime,ext;
 if(o.fmt==='json'){body=JSON.stringify({exported:new Date().toISOString(),rows},null,2);mime='application/json';ext='json'}
 else{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';body='type,start,end,title,detail\n'+rows.map(r=>[r.type,r.start,r.end,r.title,r.detail].map(q).join(',')).join('\n');mime='text/csv';ext='csv'}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:mime}));a.download='mindspace-export.'+ext;document.body.appendChild(a);a.click();a.remove();toast((o.fmt==='pdf'?'PDF is not available, exported CSV: ':'Exported ')+rows.length+' records')}
 catch(e){try{navigator.clipboard.writeText(body);toast('Download blocked, copied to clipboard')}catch(_){toast('Export was blocked here')}}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(S.cfg&&S.cfg.pinHash&&hiddenAt&&Date.now()-hiddenAt>=(+S.cfg.lockAfter||0)*60000)lockNow()});
A.gems=()=>{closeSheet();setTab('tasks');setTimeout(()=>postTk({type:'openRewards'}),120)};

/* ===== Notifications (your design) ===== */
const NIC={alert:'<path d="M12 6v8M12 18h.01"/>',task:'<path d="M5 12l4 4 10-10"/>',goal:'<circle cx="12" cy="12" r="8"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',timer:'<circle cx="12" cy="13" r="7"/><path d="M12 9v4l2 2M9 3h6"/>',star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'};
const NCOL={alert:'#fbbf24',task:'#60a5fa',goal:'#34d399',timer:'#fb923c',star:'#34d399'};
const nIcon=n=>{const k=n.key||'';return k.startsWith('nochk')?'alert':k.startsWith('run')?'timer':k.startsWith('streak')||k.startsWith('fw')?'star':n.type==='prog'?'goal':n.type==='imp'?'timer':'task'};
const NLAB={rem:'Reminder',imp:'Important',prog:'Progress'};
PAGES.notes=()=>{const f=R.nf||'All',td=today(),un=S.notes.filter(n=>!n.read).length;
 const vis=S.notes.filter(n=>f==='All'||n.type===f);
 const item=n=>{const ic=nIcon(n),tm=n.ts>=td?fmtT(n.ts):new Date(n.ts).toLocaleDateString('en-US',{weekday:'short'});
  return `<div class="nitem ${n.read?'':'unread'}"><button class="nmain" data-a="nread" data-v="${n.id}"><span class="nic" style="background:${NCOL[ic]}"><svg width="20" height="20" viewBox="0 0 24 24" fill="${ic==='star'?'currentColor':'none'}" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${NIC[ic]}</svg></span><span style="flex:1;min-width:0"><span class="nt">${esc(n.title)}</span><span class="nm">${tm} · ${NLAB[n.type]||'Reminder'}</span>${n.key&&n.key.startsWith('nochk')?'<span class="ncta">Check in</span>':''}</span></button>${n.read?'':'<i class="ndot" aria-label="Unread"></i>'}<button class="nx" data-a="ndel" data-v="${n.id}" aria-label="Dismiss"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`};
 const grp=(t,rows)=>rows.length?`<div class="card ncard"><div class="eyebrow">${t}</div>${rows.map(item).join('')}</div>`:'';
 const body=vis.length?grp('Today',vis.filter(n=>n.ts>=td))+grp('Earlier',vis.filter(n=>n.ts<td)):`<div class="card empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"/></svg><b>You’re all caught up</b>Nothing here right now.</div>`;
 const cs=[['All','All'],['rem','Reminders'],['imp','Important'],['prog','Progress']];
 return pageHdr('Notifications',un?`<span class="nbadge">${un} new</span>`:'')+`<div class="chips-w nchips">${cs.map(([k,n])=>`<button class="chip ${f===k?'on':''}" data-a="nf" data-v="${k}">${n}<small style="opacity:.7;margin-left:6px">${S.notes.filter(x=>k==='All'||x.type===k).length}</small></button>`).join('')}</div>`+body+
 `<div class="btns eq"><button class="btn sec" data-a="clearNotes" ${S.notes.length?'':'disabled'}>Clear all</button><button class="btn" data-a="readNotes" ${un?'':'disabled'}>Mark all read</button></div>`};
A.nf=el=>{R.nf=el.dataset.v;render()};
A.nread=el=>{const n=S.notes.find(x=>x.id===el.dataset.v);if(!n)return;n.read=true;save();if(n.key&&n.key.startsWith('nochk'))go('checkin');else render()};
A.ndel=el=>{const prev=S.notes.slice();S.notes=S.notes.filter(x=>x.id!==el.dataset.v);save();render();toast('Notification dismissed',()=>{S.notes=prev;save();render()})};
A.readNotes=()=>{const prev=JSON.stringify(S.notes);S.notes.forEach(n=>n.read=true);save();render();toast('All marked as read',()=>{S.notes=JSON.parse(prev);save();render()})};
A.clearNotes=()=>{const prev=S.notes.slice();S.notes=[];save();render();toast('All notifications cleared',()=>{S.notes=prev;save();render()})};
A.toastUndo=()=>{const f=toast._u;toast._u=null;$('#toast').classList.remove('on');f&&f()};

/* ===== Feelings picker (your design) ===== */
const FEEL=[{g:'Energised',c:'#fbbf24',f:['Happy','Excited','Hopeful','Proud','Confident','Joyful','Energetic','Grateful']},{g:'Calm',c:'#34d399',f:['Calm','Relaxed','Content','Peaceful','Focused','Satisfied','Curious']},{g:'Tense',c:'#f87171',f:['Anxious','Stressed','Angry','Frustrated','Overwhelmed','Irritated','Restless','Worried']},{g:'Low',c:'#60a5fa',f:['Tired','Sad','Bored','Lonely','Drained','Disappointed','Numb','Guilty']},{g:'Neutral',c:'#9ca3af',f:['Neutral','Confused','Other']}];
const FCK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function feelPicker(title){R.fpg='All';
 const rows=FEEL.map(g=>g.f.map(n=>`<button class="fp-r" data-a="fpTog" data-v="${n}" data-g="${g.g}" style="--g:${g.c}" aria-pressed="false"><i class="d"></i>${n}<span class="gl">${g.g}</span><span class="k">${FCK}</span></button>`).join('')).join('');
 return `<div class="card fp"><div class="row"><h3 style="margin:0">${title||'How does it feel?'}</h3><span class="muted small" id="fp-n">0 picked</span></div>
 <div class="fp-pk" id="fp-pk"><span class="muted small">Nothing picked yet.</span></div>
 <input class="inp" data-live="fps" placeholder="Search feelings" aria-label="Search feelings" autocomplete="off" style="margin-top:12px">
 <div class="fp-tabs">${['All',...FEEL.map(g=>g.g)].map((g,i)=>{const c=(FEEL.find(x=>x.g===g)||{}).c;return `<button class="fp-t" data-a="fpTab" data-v="${g}" aria-pressed="${i===0}" ${c?`style="--g:${c}"`:''}>${c?'<i></i>':''}${g}</button>`}).join('')}</div>
 <div class="fp-win"><div class="fp-list" id="feel-all" role="group" aria-label="Feelings">${rows}<div class="muted small center" id="fp-none" hidden style="padding:24px 0">No match. Try another word.</div></div><div class="fp-fade"></div></div>
 <p class="muted small center" style="margin:6px 0 0">Scroll for more. Tap to pick.</p></div>`}
function fpFilter(){const q=(($('[data-live="fps"]')||{}).value||'').trim().toLowerCase(),g=R.fpg||'All';let n=0;
 $$('#feel-all .fp-r').forEach(r=>{const ok=(g==='All'||r.dataset.g===g)&&(!q||r.dataset.v.toLowerCase().includes(q)||r.dataset.g.toLowerCase().startsWith(q));r.hidden=!ok;if(ok)n++});
 const e=$('#fp-none');if(e)e.hidden=n>0;const l=$('#feel-all');if(l)l.scrollTop=0}
function fpSync(){const on=$$('#feel-all .fp-r.on');$('#fp-n').textContent=on.length+' picked';
 $('#fp-pk').innerHTML=on.length?on.map(r=>`<button class="fp-c" data-a="fpTog" data-v="${r.dataset.v}" style="--g:${r.style.getPropertyValue('--g')}" aria-label="Remove ${r.dataset.v}"><i></i>${r.dataset.v}<b aria-hidden="true">&times;</b></button>`).join(''):'<span class="muted small">Nothing picked yet.</span>'}
A.fpTog=el=>{const r=$('#feel-all .fp-r[data-v="'+el.dataset.v+'"]');if(!r)return;r.classList.toggle('on');r.setAttribute('aria-pressed',r.classList.contains('on'));fpSync();try{navigator.vibrate&&navigator.vibrate(6)}catch(e){}};
A.fpTab=el=>{R.fpg=el.dataset.v;$$('.fp-t').forEach(b=>b.setAttribute('aria-pressed',b===el));fpFilter()};
PAGES.settings=()=>'<div style="height:1px"></div>';
/* ===== boot ===== */
document.addEventListener('input',e=>{const t=e.target,l=t.dataset&&t.dataset.live;if(l==='frv'){const o=$('#frv');if(o)o.textContent=t.value}else if(l==='sl')slLive();else if(l==='fps')fpFilter();else if(l==='pks'){const q=t.value.trim().toLowerCase();$$('.pk-it:not(.none)').forEach(b=>b.hidden=!b.dataset.n.includes(q));$$('.pk-g').forEach(g=>g.hidden=!$$('.pk-it',g).some(b=>!b.hidden))}});
let _sw=null,_swd=0;
document.addEventListener('pointerdown',e=>{const w=e.target.closest&&e.target.closest('.week');if(!w){_sw=null;return}const tr=w.firstElementChild;if(!tr)return;tr.style.transition='none';_sw={x:e.clientX,y:e.clientY,w,tr,drag:false,lx:e.clientX,lt:performance.now(),v:0}});
document.addEventListener('pointermove',e=>{if(!_sw)return;const dx=e.clientX-_sw.x,dy=e.clientY-_sw.y;
 if(!_sw.drag&&Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.3){_sw.drag=true;try{_sw.w.setPointerCapture(e.pointerId)}catch(_){}}
 if(_sw.drag){const n=performance.now();_sw.v=.7*_sw.v+.3*((e.clientX-_sw.lx)/Math.max(1,n-_sw.lt));_sw.lx=e.clientX;_sw.lt=n;const cell=_sw.w.clientWidth/7,lim=cell*13,d=Math.max(-lim,Math.min(lim,dx));_sw.tr.style.transform='translateX(calc(-40% + '+d.toFixed(1)+'px))'}});
document.addEventListener('pointerup',e=>{if(!_sw)return;const s2=_sw;_sw=null;if(!s2.drag)return;_swd=Date.now();
 const cell=s2.w.clientWidth/7,dx=e.clientX-s2.x;let n=Math.round(-(dx+s2.v*160)/cell);n=Math.max(-13,Math.min(13,n));
 s2.tr.style.transition='transform .38s cubic-bezier(.22,1,.36,1)';s2.tr.style.transform='translateX(calc(-40% + '+(-n*cell).toFixed(1)+'px))';
 let done=false;const fin=()=>{if(done)return;done=true;if(n)shiftDays(n)};s2.tr.addEventListener('transitionend',fin,{once:true});setTimeout(fin,460)});
document.addEventListener('pointercancel',()=>{if(_sw&&_sw.tr){_sw.tr.style.transition='transform .25s ease';_sw.tr.style.transform=''}_sw=null});
document.addEventListener('click',e=>{if(Date.now()-_swd<350&&e.target.closest&&e.target.closest('.week')){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"][data-a]')){e.preventDefault();e.target.click()}});
addEventListener('online',()=>render());addEventListener('offline',()=>render());
applyUI();
$('#pg').innerHTML='<div class="card sk" aria-hidden="true"><i></i><i></i><i class="s"></i></div>'.repeat(3);
let _booted=false;const boot=()=>{if(_booted)return;_booted=true;runFirewood();checkNotes();render(true);lockNow();try{_sig=sigNow()}catch(e){}};
Promise.race([document.fonts?document.fonts.ready:0,new Promise(r=>setTimeout(r,450))]).then(boot,boot);setTimeout(boot,900);
setInterval(()=>tick(),1000);setInterval(checkNotes,60000);
