const bars=(rows,col)=>rows.map(r=>`<div class="hb"><span>${esc(r.n)}</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,r.w))}%;background:${r.c||col}"></i></div><b>${r.t}</b></div>`).join('');

/* ---------- 1. Wellbeing Overview (top of Today) ---------- */
function mDelta(cs,m){const a=cs.filter(c=>c[m.k]!=null);if(!a.length)return null;const l=a[a.length-1],p=a[a.length-2];let note=fmtT(l.ts);if(p){const d=l[m.k]-p[m.k];note+=' · '+(d===0?'same as '+fmtT(p.ts):Math.abs(d)+(d<0?' lower':' higher')+' than '+fmtT(p.ts))}return{v:l[m.k],note}}
function wToday(){
 const k=dk(R.wdate),isT=R.wdate===today(),cs=S.checkins.filter(c=>dk(c.ts)===k).sort((a,b)=>a.ts-b.ts),l=cs[cs.length-1];
 const days=new Set(S.checkins.map(c=>dk(c.ts))).size;let top='';
 if(!cs.length){top=`<div class="card center"><h3 style="margin-bottom:4px">${isT?'No check-ins yet':'No check-ins'}</h3><p class="muted small">${isT?'Your first one takes about 20 seconds.':'Nothing was recorded on this day.'}</p>${isT?`<button class="btn gap" data-a="go" data-p="checkin">Quick check-in</button>`:''}</div>`+(isT&&days<5?`<div class="card"><h3>Insights</h3><p class="muted small">Insights need check-ins on at least 5 days. You have ${days}.</p><div class="bar gap"><i style="width:${days/5*100}%"></i></div></div>`:'')}
 else{top=`<div class="card"><div class="row"><h3 style="margin:0">Latest check-in</h3><span class="muted small">${fmtT(l.ts)} · ${ago(l.ts)}</span></div><div class="row gap2" style="gap:16px;align-items:center"><div class="orb" style="--oc:${mCol(l.mood)};--dur:${l.energy!=null?(5.6-l.energy*.34).toFixed(1):4.6}s" role="img" aria-label="Mood orb"></div><p class="muted small">${isT?'Recorded earlier today. It may not describe how you feel right now.':'The last check-in recorded on this day.'}</p></div>${isT?`<button class="btn gap2" data-a="go" data-p="checkin">Quick check-in</button>`:''}</div>
 <div class="tiles two" style="gap:10px;margin-bottom:12px">${[MET[1],MET[2],MET[0],MET[3]].map(m=>{const d=mDelta(cs,m);return `<div class="card" style="margin:0"><div class="eyebrow">${m.n}</div>${d?`<div class="big" style="font-size:38px;color:${m.c};margin:8px 0 4px">${d.v}</div><p class="muted small">${d.note}</p>`:`<div class="big" style="font-size:38px;color:var(--dim);margin:8px 0 4px">–</div><p class="muted small">Not rated ${isT?'today':'that day'}</p>${isT?`<button class="chip sm gap" data-a="go" data-p="checkin">Record</button>`:''}`}</div>`}).join('')}</div>`}
 const ns=S.sleep.find(s=>s.date===k),typ=S.sleep.filter(s=>s.date<=k).slice(-6);
 const night=`<div class="card"><div class="row"><h3 style="margin:0">${isT?'Last night':'That night'}</h3><span class="muted small">Sleep</span></div>${ns?`<div class="big gap" style="font-size:34px">${ns.approx?'~':''}${fmtD(sdur(ns))}</div><p class="muted small gap">${fmtT(ns.bed)} → ${fmtT(ns.wake)}${ns.q!=null?' · quality '+ns.q+'/10':''}${ns.rest!=null?' · rested '+ns.rest+'/10':''}</p>${typ.length>1?`<p class="muted small" style="margin-top:4px">Typical bedtime ${clock((avg(typ.map(bedMin))+1080)%1440)}, based on ${typ.length} recorded nights.</p>`:''}`:`<p class="muted small gap">No sleep recorded for this night.</p><button class="btn sec gap" data-a="wtab" data-v="sleep">Log sleep</button>`}</div>`;
 const es=entriesOn(k,false).sort((a,b)=>a.start-b.start),t=S.tasks[k];
 const ctx=`<div class="card"><div class="row"><h3 style="margin:0">Activity and task context</h3></div><p class="muted small" style="margin-top:2px">From your records</p>${es.length?`<div class="list gap">${es.slice(0,4).map(e=>`<div class="li"><span>${esc(catLabel(e.catId))}</span><span class="v">${fmtT(e.start)}–${fmtT(e.end)}</span></div>`).join('')}</div>`:'<p class="muted small gap">No time tracked yet.</p>'}${t&&(t.planned||t.done)?`<div class="eyebrow gap2">Tasks ${isT?'today':'that day'}</div><div class="chips-w gap">${[['Planned',t.planned],['Completed',t.done],['Open',Math.max(0,t.planned-t.done)]].map(([n,v])=>`<span class="chip" style="pointer-events:none"><b>${v}</b> ${n}</span>`).join('')}</div>`:''}</div>`;
 let prev='';if(days>=5){const all=insights().filter(x=>!S.hidden.includes(x.id)),i=all.find(x=>!x.insuff)||all[0];if(i)prev=`<div class="card"><h3>Insight preview</h3><span class="lab ${i.cls}">${i.lab}</span><p class="gap" style="font-size:16px">${esc(i.text)}</p><p class="muted small gap">${i.range?esc(i.range)+' · ':''}n = ${i.n} · An association, not proof of cause.</p><button class="btn sec gap" data-a="openIns">Open Insights</button></div>`}
 const list=cs.length?`<div class="card"><div class="row"><h3 style="margin:0">${isT?'Today’s check-ins':'Check-ins'}</h3><span class="muted small">${cs.length} so far</span></div><div class="gap">${cs.map(checkinRow).join('')}</div></div>`:'';
 const ser=MET.map(m=>({c:m.c,pts:cs.filter(c=>c[m.k]!=null).map(c=>[(c.ts-R.wdate)/36e5,c[m.k]])}));
 const chart=cs.length?`<div class="card"><h3>Through the day</h3>${lineChart(ser,5,24,[[6,'6 AM'],[12,'12 PM'],[18,'6 PM'],[24,'12 AM']])}<div class="chips-w gap" style="gap:14px">${MET.map(m=>`<span class="small" style="display:flex;align-items:center;gap:6px"><i style="width:10px;height:10px;border-radius:50%;background:${m.c}"></i>${m.n}</span>`).join('')}</div></div>`:'';
 return dayNav('wdate',isT?'Today · '+fmtDate(R.wdate):fmtDate(R.wdate,{weekday:'short',day:'numeric',month:'short'}))+top+night+ctx+prev+list+chart+timelineCard(k)+beforeAfterCard(k)+`<button class="btn sec" data-a="go" data-p="event">Log an event</button>`}
A.openIns=()=>{R.wtab='insights';R.itab='insights';render(true)};

/* ---------- 2. Timeline with suggested links + before and after ---------- */
function timelineCard(k){
 const ev=tlEvents(k).filter(e=>R.tlf==='All'||e.f===R.tlf);
 const rows=ev.map(e=>{let pr='';
  if(e.ent){const c=S.checkins.find(c=>dk(c.ts)===k&&c.ts>=e.ent.start&&c.ts<=e.ent.end&&!c.catId&&!c.linkNo);
   if(c)pr=`<div class="note ok gap">Suggested link: your ${fmtT(c.ts)} check-in falls inside this session. A suggestion, not a cause.<div class="chips-w gap"><button class="chip sm on" data-a="lnk" data-c="${c.id}" data-v="y" data-cat="${e.ent.catId}">Confirm</button><button class="chip sm" data-a="lnk" data-c="${c.id}" data-v="n">Not this</button></div></div>`}
  return `<div class="ev"><span class="t">${fmtT(e.ts)}</span><i class="d" style="--dc:${e.col}"></i><div class="x"><b>${esc(e.t)}<em>${e.tag}</em></b><small>${esc(e.s)}</small>${pr}</div></div>`}).join('');
 return `<div class="card"><h3>Timeline</h3><div class="chips-w" style="margin-bottom:10px">${['All','Sleep','Activities','Check-ins','Tasks','Events'].map(f=>`<button class="chip sm ${R.tlf===f?'on':''}" data-a="tlf" data-v="${f}">${f}</button>`).join('')}</div>${ev.length?`<div class="tl">${rows}</div>`:'<div class="empty"><b>Nothing here</b>Sleep, activities, check-ins and tasks appear as you record them.</div>'}</div>`}
A.lnk=el=>{const c=S.checkins.find(x=>x.id===el.dataset.c);if(!c)return;if(el.dataset.v==='y'){c.catId=el.dataset.cat;c.linkOk=true}else c.linkNo=true;save();render()};
function beforeAfterCard(k){const H3=3*36e5,es=entriesOn(k,false).filter(e=>(cat(e.catId)||{}).group==='Study'&&mins(e)>=10).sort((a,b)=>a.start-b.start),cs=S.checkins.filter(c=>c.focus!=null).sort((a,b)=>a.ts-b.ts);let r=null;
 for(const e of es){const b=[...cs].reverse().find(c=>c.ts<=e.start&&e.start-c.ts<=H3),a=cs.find(c=>c.ts>=e.end&&c.ts-e.end<=H3);if(b&&a){r={e,b,a};break}}
 if(!r)return '';const d=r.a.focus-r.b.focus,gap=(r.a.ts-r.b.ts)/6e4;
 return `<div class="card"><div class="row"><h3 style="margin:0">Before and after</h3><span class="muted small">Focus</span></div><div class="list gap"><div class="li"><span class="muted">Before ${esc(catLabel(r.e.catId))} session</span><span class="v">${r.b.focus} / 10 at ${fmtT(r.b.ts)}</span></div><div class="li"><span class="muted">After the session</span><span class="v">${r.a.focus} / 10 at ${fmtT(r.a.ts)}</span></div><div class="li"><span class="muted">Observed difference</span><span class="v">${d>0?'+':''}${d} · ${fmtD(gap)} apart</span></div></div><p class="muted small gap">Other things in those ${fmtD(gap)} may have contributed.</p></div>`}

/* ---------- 3 and 4. Insights tab: Patterns, Insights, Discipline ---------- */
function wInsights(){return `<div class="seg sm">${[['patterns','Patterns'],['insights','Insights'],['discipline','Discipline']].map(([k,n])=>`<button class="${R.itab===k?'on':''}" data-a="itab" data-v="${k}">${n}</button>`).join('')}</div>`+({patterns:iPatterns,insights:iInsights,discipline:iDiscipline}[R.itab]||iPatterns)()}
A.itab=el=>{R.itab=el.dataset.v;render()};
function actDiffs(){const mc=S.checkins.filter(c=>c.mood!=null),ov=avg(mc.map(c=>c.mood)),G={};
 mc.forEach(c=>{let id=c.catId;if(!id){const e=S.entries.find(e=>e.start<=c.ts&&e.end>=c.ts-6e4);id=e&&e.catId}if(id&&cat(id))(G[id]=G[id]||[]).push(c.mood)});
 return Object.keys(G).filter(id=>G[id].length>=2).map(id=>({id,n:G[id].length,d:avg(G[id])-ov})).sort((a,b)=>b.d-a.d)}
function sleepEnergy(){const P=S.sleep.map(s=>({dur:sdur(s)/60,e:wmAvg(s.date,'Morning','energy')})).filter(p=>p.e!=null);return{hi:P.filter(p=>p.dur>=7),lo:P.filter(p=>p.dur<6),n:P.length}}
function iPatterns(){
 const cal=`<div class="card"><h3 style="margin-bottom:6px">Mood calendar</h3>${monthNav('wmonth')}${monthGrid(R.wmonth,(t,k,i)=>{const a=avg(S.checkins.filter(c=>dk(c.ts)===k&&c.mood!=null).map(c=>c.mood));return a==null?`<button class="z ${k===dk(today())?'today':''}" data-a="calDay" data-v="${t}" aria-label="${fmtDate(t)}, no mood">${i}</button>`:`<button class="${k===dk(today())?'today':''}" style="background:${mCol(a)};color:${mIdx(a)<2?'#fff':'#0b0c0d'}" data-a="calDay" data-v="${t}" aria-label="${fmtDate(t)}, mood ${r1(a)}">${i}</button>`})}<div class="legend">Low ${[0,1,2,3,4].map(i=>`<i style="background:var(--m${i})"></i>`).join('')} High</div></div>`;
 const mc=S.checkins.filter(c=>c.mood!=null);
 const W=['Morning','Afternoon','Evening','Night'].map(w=>{const a=mc.filter(c=>winOf(new Date(c.ts).getHours())===w).map(c=>c.mood);return{w,n:a.length,v:avg(a)}}).filter(x=>x.n>0),srt=W.length>=2?[...W].sort((a,b)=>b.v-a.v):[];
 const best=`<div class="card"><div class="row"><h3 style="margin:0">Best and worst times</h3><span class="muted small">Average mood</span></div>${W.length?`<div class="gap">${bars(W.map(x=>({n:x.w,w:x.v*10,c:mCol(x.v),t:r1(x.v)})))}</div><p class="muted small">${srt.length?`Highest ${WNAME[srt[0].w]}, lowest ${WNAME[srt[srt.length-1].w]}. `:''}Based on ${mc.length} check-in${mc.length===1?'':'s'}.</p>`:'<p class="muted small gap">Needs mood check-ins at different times of day.</p>'}</div>`;
 const ad=actDiffs(),pick=[...ad.slice(0,2),...ad.slice(-2)].filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i).sort((a,b)=>b.d-a.d);
 const what=`<div class="card"><h3>What goes with your mood</h3>${pick.length?`<div>${bars(pick.map(x=>({n:cat(x.id).name,w:Math.abs(x.d)/3*100,c:x.d>=0?'var(--ok)':'var(--bad)',t:(x.d>=0?'+':'−')+r1(Math.abs(x.d))})))}</div><p class="muted small">Mood change compared with your average, for check-ins logged near each activity. This shows association, not cause.</p>`:'<p class="muted small">Needs at least 2 mood check-ins near the same activity.</p>'}</div>`;
 const F={};S.entries.filter(e=>e.focus!=null&&cat(e.catId)).forEach(e=>(F[e.catId]=F[e.catId]||[]).push(e.focus));
 const fl=Object.keys(F).filter(id=>F[id].length>=2).map(id=>({id,n:F[id].length,v:avg(F[id])})).sort((a,b)=>b.v-a.v);
 const foc=`<div class="card"><div class="row"><h3 style="margin:0">Focus by subject</h3><span class="muted small">From rated sessions</span></div>${fl.length?`<div class="gap">${bars(fl.map(x=>({n:cat(x.id).name,w:x.v*10,c:'var(--w-focus)',t:r1(x.v)})))}</div>`:'<p class="muted small gap">Rate your focus after a few study sessions to see this.</p>'}</div>`;
 const se=sleepEnergy(),sl=`<div class="card"><h3>Sleep and energy</h3>${se.hi.length||se.lo.length?`<div class="tiles two"><div class="tile"><b style="color:var(--w-energy)">${r1(avg(se.hi.map(p=>p.e)))}</b><small>Morning energy after 7h+</small><small>n = ${se.hi.length}</small></div><div class="tile"><b style="color:var(--w-mood)">${r1(avg(se.lo.map(p=>p.e)))}</b><small>After under 6h</small><small>n = ${se.lo.length}</small></div></div>${se.n<8?'<p class="muted small gap">Small sample. Other things that affect energy were not controlled.</p>':''}`:'<p class="muted small gap">Needs nights with 7h+ or under 6h and a morning energy rating.</p>'}</div>`;
 const sug=[],neg=[...ad].reverse().find(x=>x.d<=-.5);
 if(srt.length&&srt[0].w==='Morning'&&srt[0].n>=2)sug.push(['Protect your mornings','Your mood is highest early. Try placing your hardest study block before 11 AM.']);
 if(neg)sug.push([cat(neg.id).name+' and mood',`Mood tends to be lower around ${cat(neg.id).name}. A planned break away from it may feel better.`]);
 if(se.hi.length&&se.lo.length&&avg(se.hi.map(p=>p.e))-avg(se.lo.map(p=>p.e))>=1)sug.push(['Sleep and energy','Energy looks higher after 7h or more of sleep. A steady bedtime may help.']);
 const gs=`<div class="card"><h3>Gentle suggestions</h3>${sug.length?sug.map(s=>`<div class="note" style="margin-top:10px"><b style="color:var(--fg);font-size:15px">${s[0]}</b><p style="margin-top:4px">${s[1]}</p></div>`).join(''):'<p class="muted small">Suggestions appear when there is enough data to base them on.</p>'}</div>`;
 return cal+best+what+foc+sl+gs}
function compareCard(){
 const X={dur:'Sleep duration',q:'Sleep quality'},Y={energy:'Morning energy',mood:'Morning mood',focus:'Morning focus',mot:'Morning motivation'};
 const P=S.sleep.map(s=>({x:R.cx==='dur'?sdur(s)/60:s.q,y:wmAvg(s.date,'Morning',R.cy)})).filter(p=>p.x!=null&&p.y!=null),thr=R.cx==='dur'?7:8,hi=P.filter(p=>p.x>=thr),lo=P.filter(p=>p.x<thr);
 return `<div class="card"><div class="row"><h3 style="margin:0">Compare two things</h3><span class="muted small">Descriptive</span></div><div class="chips-w gap">${Object.entries(X).map(([k,n])=>`<button class="chip sm ${R.cx===k?'on':''}" data-a="cx" data-v="${k}">${n}</button>`).join('')}</div><p class="muted small" style="margin:8px 0">vs</p><div class="chips-w">${Object.entries(Y).map(([k,n])=>`<button class="chip sm ${R.cy===k?'on':''}" data-a="cy" data-v="${k}">${n}</button>`).join('')}</div><div class="list gap2"><div class="li"><span class="muted">Observations</span><span class="v">${P.length} pair${P.length===1?'':'s'}</span></div><div class="li"><span class="muted">Method</span><span class="v">Grouped averages</span></div>${hi.length&&lo.length?`<div class="li"><span class="muted">${R.cx==='dur'?'7h or more':'Good or better'}</span><span class="v">${r1(avg(hi.map(p=>p.y)))} (n = ${hi.length})</span></div><div class="li"><span class="muted">${R.cx==='dur'?'Under 7h':'Under Good'}</span><span class="v">${r1(avg(lo.map(p=>p.y)))} (n = ${lo.length})</span></div>`:''}</div>${hi.length&&lo.length?'':'<p class="muted small gap">Not enough nights on both sides to compare yet.</p>'}<p class="muted small gap">This describes your records. It does not predict or prove anything.</p></div>`}
A.cx=el=>{R.cx=el.dataset.v;render()};A.cy=el=>{R.cy=el.dataset.v;render()};
function notableChange(){const cs=S.checkins.slice().sort((a,b)=>a.ts-b.ts);for(let i=cs.length-1;i>0;i--){const b=cs[i];for(let j=i-1;j>=0;j--){const a=cs[j];if(b.ts-a.ts>6*36e5)break;for(const m of MET.slice(0,3))if(a[m.k]!=null&&b[m.k]!=null&&Math.abs(b[m.k]-a[m.k])>=3)return{m,a,b,d:b[m.k]-a[m.k]}}}return null}
function iInsights(){
 const days=new Set(S.checkins.map(c=>dk(c.ts))).size;let list;
 if(days<5)list=`<div class="card"><h3>Insights</h3><p class="muted small">Insights need check-ins on at least 5 days. You have ${days}.</p><div class="bar gap"><i style="width:${days/5*100}%"></i></div></div>`;
 else{const all=insights(),vis=all.filter(i=>!S.hidden.includes(i.id)),hid=all.length-vis.length;
  list=`<div class="card"><h3>How to read these</h3><p class="muted small">Facts are what you recorded. Calculations are what we worked out. Associations are patterns that may or may not mean anything. Nothing here proves a cause.</p></div>`+(vis.length?vis.map(i=>`<button class="card" data-a="go" data-p="insight" data-q='{"id":"${i.id}"}' style="display:block;width:100%"><div class="row" style="align-items:flex-start"><b style="font-size:16px">${esc(i.title)}</b>${I.chev}</div><span class="lab ${i.cls} gap">${i.lab}</span><p class="gap" style="font-size:15px">${esc(i.text)}</p><p class="muted small gap">${i.range?esc(i.range)+' · ':''}n = ${i.n} · Tap for the records</p></button>`).join(''):`<div class="card empty"><b>No patterns yet</b>Keep recording sleep, check-ins and focus. Patterns appear when there is enough to compare.</div>`)+(hid?`<p class="center small"><button class="link" data-a="unhide">Show ${hid} hidden insight${hid===1?'':'s'}</button></p>`:'')}
 const nc=notableChange(),ncard=nc?`<div class="card"><div class="row"><h3 style="margin:0">Notable change</h3><span class="muted small">Threshold: 3+ points in 6h</span></div><p class="gap" style="font-size:16px">${nc.m.n} ${nc.d<0?'fell':'rose'} ${Math.abs(nc.d)} points between ${fmtT(nc.a.ts)} and ${fmtT(nc.b.ts)}.</p><p class="muted small gap">${fmtD((nc.b.ts-nc.a.ts)/6e4)} apart. The exact moment of the change is unknown.</p></div>`:'';
 const base=insights().find(i=>(i.id==='sd-me'||i.id==='sq-me')&&!i.insuff);let exp='';
 const typ=S.sleep.slice(-6);const tb=typ.length>1?clock((avg(typ.map(bedMin))+1080)%1440):'your usual bedtime';
 if(S.exp&&S.exp.status==='try')exp=`<div class="card"><div class="row"><h3 style="margin:0">Your experiment</h3><span class="lab user">In progress</span></div><p class="gap" style="font-size:15px">Keep your bedtime within 30 minutes of ${tb} for 5 nights.</p><p class="muted small gap">Started ${fmtDate(S.exp.ts)}. Review: compare morning energy after ${fmtDate(addDays(S.exp.ts,7))}.</p><button class="btn sec gap" data-a="exp" data-v="dismissed">Stop experiment</button></div>`;
 else if(base&&!(S.exp&&S.exp.status==='dismissed')&&!R.expLater)exp=`<div class="card"><h3>A small experiment to try</h3><div class="list"><div class="li"><span class="muted">What we noticed</span><span class="v" style="white-space:normal;text-align:right">${esc(base.title)}</span></div><div class="li"><span class="muted">Supported by</span><span class="v">${base.n} mornings</span></div><div class="li"><span class="muted">How certain</span><span class="v">${base.lab}</span></div><div class="li" style="align-items:flex-start"><span class="muted">Test</span><span class="v" style="white-space:normal;text-align:right">Keep bedtime within 30 min of ${tb} for 5 nights</span></div><div class="li"><span class="muted">Review</span><span class="v" style="white-space:normal;text-align:right">Compare morning energy next week</span></div></div><div class="chips-w gap"><button class="chip on" data-a="exp" data-v="try">Try this</button><button class="chip" data-a="exp" data-v="later">Not now</button><button class="chip" data-a="exp" data-v="dismissed">Dismiss</button></div></div>`;
 return list+(days>=5?compareCard()+ncard+exp:'')}
A.exp=el=>{const v=el.dataset.v;if(v==='later'){R.expLater=true}else S.exp={status:v,ts:Date.now()};save();render()};

/* discipline, worked out from planned blocks and tracked time */
function planStats(from,to){const out=[],now=Date.now();
 S.plan.filter(b=>{const t=k2t(b.day);return t>=from&&t<=to}).forEach(b=>{const d=k2t(b.day),s=atTime(d,minVal(b.s)),e=atTime(d,minVal(b.e)),planned=(e-s)/6e4;

 ((st.tk&&st.tk.tasks)||[]).forEach(t=>{const k=t.date||td,x=T[k]||(T[k]=mk());x.planned++;const pn=['Low','Medium','High'][(t.pri||2)-1],pr=x.pri[pn]||(x.pri[pn]=[0,0]);pr[1]++;
  if(t.done){x.done++;pr[0]++;x.st.Completed++;if(t.doneAt)days.add(dk(t.doneAt))}else if(k<td)x.st.Delayed++});
 Object.keys(cx).forEach(k=>{if(cx[k]>0){const x=T[k]||(T[k]=mk());x.st.Cancelled=cx[k]}});
 st.tasks=T;st.tkDays=[...days];st.taskLog=((st.tk&&st.tk.tasks)||[]).filter(t=>t.done&&t.doneAt).map(t=>({id:t.id,ts:t.doneAt,title:t.title}))}
function tkMsg(d){
 if(d.type==='state'){ensureTk();S.tk=d.state;deriveTasks(S);save();postTk({type:'sync',streak:streak()})}
 else if(d.type==='coin'){
  if(d.src==='undo'){const i=S.coinLog.map(c=>c.label).lastIndexOf('Task completed');if(i>=0)S.coinLog.splice(i,1)}
  else if(d.src==='gem'){const l=S.coinLog[S.coinLog.length-1];if(l&&l.label==='Gem reward'&&Date.now()-l.ts<8000){l.amt+=d.d;l.ts=Date.now()}else S.coinLog.push({id:uid(),ts:Date.now(),amt:d.d,label:'Gem reward'})}
  else S.coinLog.push({id:uid(),ts:Date.now(),amt:d.d,label:'Task completed'});
  save();checkNotes();postTk({type:'sync',streak:streak(),unread:unreadN()})}
 else if(d.type==='deleted'||d.type==='undeleted'){ensureTk();const u=d.type==='deleted'?1:-1;(d.dates||[]).forEach(k=>{S.tkCancel[k]=Math.max(0,(S.tkCancel[k]||0)+u)});deriveTasks(S);save()}
 else if(d.type==='go'){go(d.p)}
 else if(d.type==='sheet'){tkSheet=!!d.open;$('#nav').style.display=(tkSheet&&S.tab==='tasks'&&!R.page)?'none':''}}

function syncSubjects(list){if(!Array.isArray(list))return;const cur=studyCats();
 list.forEach(n=>{if(!cur.some(c=>c.name.toLowerCase()===n.toLowerCase()))S.cats.push({id:'study-'+n.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+uid().slice(0,3),name:n,group:'Study'})});
 cur.forEach(c=>{if(cur.length>1&&!list.some(n=>n.toLowerCase()===c.name.toLowerCase())&&!S.entries.some(e=>e.catId===c.id)&&!S.plan.some(b=>b.catId===c.id)&&!(S.running&&S.running.catId===c.id))S.cats=S.cats.filter(x=>x.id!==c.id)})}
function applyCfg(c){S.cfg=c;S.name=c.name||'';S.ui.sound=!!c.sound;
 S.settings.focus=c.focus;S.settings.short=c.short;S.settings.long=c.long;S.settings.blocks=c.blocks;S.settings.auto=!!c.auto;
 S.studyTarget=Math.round(c.goal*60);
 if(c.examDate)S.exam={name:c.goalName||'Exam',date:c.examDate};else S.exam=null;
 syncSubjects(c.subjects);
 if(c.theme&&c.theme!==themeNow()){S.ui.theme=c.theme;applyUI();postTk({type:'theme',theme:c.theme})}
 save()}
const cfgOn=k=>!(S.cfg&&S.cfg[k]===0);
function resetData(){const keep={ui:S.ui,settings:S.settings,cfg:S.cfg,name:S.name};S=Object.assign(defaults(),keep);resetTkFrame();applyUI();R.sel=today();R.wk=weekStart(R.sel);R.stack=[];R.page=null;R.sheet=null;save();render(true)}
function setMsg(d){
 if(d.type==='cfg')applyCfg(d.cfg);
 else if(d.type==='sample'){loadSample()}
 else if(d.type==='unsample'){if(S.sample){resetData();toast('Sample data removed')}else toast('No sample data loaded')}
 else if(d.type==='wipeAll'){try{localStorage.removeItem(KEY)}catch(e){}S=defaults();resetTkFrame();applyUI();R.stack=[];R.page=null;R.sheet=null;R.sel=today();R.wk=weekStart(R.sel);render(true);toast('All data deleted')}
 else if(d.type==='wipeWell'){S.checkins=[];S.events=[];S.sleep=[];S.naps=[];save();render()}
 else if(d.type==='export')doExport(d.o)}
function doExport(o){
 const td=today(),from=o.range==='all'?0:o.range==='custom'?(o.from?k2t(o.from):0):addDays(td,-(+o.range)),to=o.range==='custom'&&o.to?addDays(k2t(o.to),1):Infinity,inR=ts=>ts>=from&&ts<to,T=o.types||[];
 const rows=[],iso=ts=>new Date(ts).toISOString();
 if(T.includes('time'))S.entries.filter(e=>inR(e.start)).forEach(e=>rows.push({type:'time',start:iso(e.start),end:iso(e.end),title:catLabel(e.catId),detail:e.src||''}));
 if(T.includes('study'))S.entries.filter(e=>inR(e.start)&&(cat(e.catId)||{}).group==='Study').forEach(e=>rows.push({type:'study',start:iso(e.start),end:iso(e.end),title:catLabel(e.catId),detail:e.focus!=null?'focus '+e.focus:''}));
 if(T.includes('tasks'))((S.tk&&S.tk.tasks)||[]).filter(t=>inR(k2t(t.date||dk(td)))).forEach(t=>rows.push({type:'task',start:t.date||'',end:t.doneAt?iso(t.doneAt):'',title:t.title,detail:(t.done?'done':'pending')+', '+['Low','Medium','High'][(t.pri||2)-1]+', '+(t.list||'')}));
 if(T.includes('wellbeing')){S.checkins.filter(c=>inR(c.ts)).forEach(c=>rows.push({type:'check-in',start:iso(c.ts),end:'',title:MET.map(m=>c[m.k]!=null?m.n+' '+c[m.k]:'').filter(Boolean).join(', '),detail:(c.feelings||[]).join(', ')+(o.notes&&c.note?' | '+c.note:'')}));S.events.filter(x=>inR(x.ts)).forEach(x=>rows.push({type:'event',start:iso(x.ts),end:'',title:(x.feelings||[]).join(', '),detail:o.notes&&x.note?x.note:''}))}
 if(T.includes('sleep')){S.sleep.filter(s=>inR(s.bed||k2t(s.date))).forEach(s=>rows.push({type:'sleep',start:iso(s.bed),end:iso(s.wake),title:'Quality '+s.q+', rested '+s.rest,detail:s.approx?'approximate':''}));S.naps.filter(n=>inR(n.start)).forEach(n=>rows.push({type:'nap',start:iso(n.start),end:iso(n.end),title:'Nap',detail:''}))}
 let body,mime,ext;
 if(o.fmt==='json'){body=JSON.stringify({exported:new Date().toISOString(),rows},null,2);mime='application/json';ext='json'}
 else{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';body='type,start,end,title,detail\n'+rows.map(r=>[r.type,r.start,r.end,r.title,r.detail].map(q).join(',')).join('\n');mime='text/csv';ext='csv'}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:mime}));a.download='mindspace-export.'+ext;document.body.appendChild(a);a.click();a.remove();toast((o.fmt==='pdf'?'PDF is not available, exported CSV: ':'Exported ')+rows.length+' records')}
 catch(e){try{navigator.clipboard.writeText(body);toast('Download blocked, copied to clipboard')}catch(_){toast('Export was blocked here')}}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(S.cfg&&S.cfg.pinHash&&hiddenAt&&Date.now()-hiddenAt>=(+S.cfg.lockAfter||0)*60000)lockNow()});
A.gems=()=>{closeSheet();setTab('tasks');setTimeout(()=>postTk({type:'openRewards'}),120)};
TABS.tasks=()=>'';

/* ===== Notifications (your design) ===== */
const NIC={alert:'<path d="M12 6v8M12 18h.01"/>',task:'<path d="M5 12l4 4 10-10"/>',goal:'<circle cx="12" cy="12" r="8"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',timer:'<circle cx="12" cy="13" r="7"/><path d="M12 9v4l2 2M9 3h6"/>',star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'};
const NCOL={alert:'#fbbf24',task:'#60a5fa',goal:'#34d399',timer:'#fb923c',star:'#34d399'};
const nIcon=n=>{const k=n.key||'';return k.startsWith('nochk')?'alert':k.startsWith('run')?'timer':k.startsWith('streak')||k.startsWith('fw')?'star':n.type==='prog'?'goal':n.type==='imp'?'timer':'task'};
const NLAB={rem:'Reminder',imp:'Important',prog:'Progress'};
PAGES.notes=()=>{const f=R.nf||'All',td=today(),un=S.notes.filter(n=>!n.read).length;
 const vis=S.notes.filter(n=>f==='All'||n.type===f);
 const item=n=>{const ic=nIcon(n),tm=n.ts>=td?fmtT(n.ts):new Date(n.ts).toLocaleDateString('en-US',{weekday:'short'});
  return `<div class="nitem ${n.read?'':'unread'}"><button class="nmain" data-a="nread" data-v="${n.id}"><span class="nic" style="background:${NCOL[ic]}"><svg width="20" height="20" viewBox="0 0 24 24" fill="${ic==='star'?'currentColor':'none'}" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${NIC[ic]}</svg></span><span style="flex:1;min-width:0"><span class="nt">${esc(n.title)}</span><span class="nm">${tm} · ${NLAB[n.type]||'Reminder'}</span>${n.key&&n.key.startsWith('nochk')?'<span class="ncta">Check in</span>':''}</span></button>${n.read?'':'<i class="ndot" aria-label="Unread"></i>'}<button class="nx" data-a="ndel" data-v="${n.id}" aria-label="Dismiss"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`};
 const grp=(t,rows)=>rows.length?`<div class="card ncard"><div class="eyebrow">${t}</div>${rows.map(item).join('')}</div>`:'';
 const body=vis.length?grp('Today',vis.filter(n=>n.ts>=td))+grp('Earlier',vis.filter(n=>n.ts<td)):`<div class="card empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"/></svg><b>You’re all caught up</b>Nothing here right now.</div>`;
 const cs=[['All','All'],['rem','Reminders'],['imp','Important'],['prog','Progress']];
 return pageHdr('Notifications',un?`<span class="nbadge">${un} new</span>`:'')+`<div class="chips-w nchips">${cs.map(([k,n])=>`<button class="chip ${f===k?'on':''}" data-a="nf" data-v="${k}">${n}<small style="opacity:.7;margin-left:6px">${S.notes.filter(x=>k==='All'||x.type===k).length}</small></button>`).join('')}</div>`+body+
 `<div class="btns eq"><button class="btn sec" data-a="clearNotes" ${S.notes.length?'':'disabled'}>Clear all</button><button class="btn" data-a="readNotes" ${un?'':'disabled'}>Mark all read</button></div>`};
A.nf=el=>{R.nf=el.dataset.v;render()};
A.nread=el=>{const n=S.notes.find(x=>x.id===el.dataset.v);if(!n)return;n.read=true;save();if(n.key&&n.key.startsWith('nochk'))go('checkin');else render()};
A.ndel=el=>{const prev=S.notes.slice();S.notes=S.notes.filter(x=>x.id!==el.dataset.v);save();render();toast('Notification dismissed',()=>{S.notes=prev;save();render()})};
A.readNotes=()=>{const prev=JSON.stringify(S.notes);S.notes.forEach(n=>n.read=true);save();render();toast('All marked as read',()=>{S.notes=JSON.parse(prev);save();render()})};
A.clearNotes=()=>{const prev=S.notes.slice();S.notes=[];save();render();toast('All notifications cleared',()=>{S.notes=prev;save();render()})};
A.toastUndo=()=>{const f=toast._u;toast._u=null;$('#toast').classList.remove('on');f&&f()};

/* ===== Feelings picker (your design) ===== */
const FEEL=[{g:'Energised',c:'#fbbf24',f:['Happy','Excited','Hopeful','Proud','Confident','Joyful','Energetic','Grateful']},{g:'Calm',c:'#34d399',f:['Calm','Relaxed','Content','Peaceful','Focused','Satisfied','Curious']},{g:'Tense',c:'#f87171',f:['Anxious','Stressed','Angry','Frustrated','Overwhelmed','Irritated','Restless','Worried']},{g:'Low',c:'#60a5fa',f:['Tired','Sad','Bored','Lonely','Drained','Disappointed','Numb','Guilty']},{g:'Neutral',c:'#9ca3af',f:['Neutral','Confused','Other']}];
const FCK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function feelPicker(title){R.fpg='All';
 const rows=FEEL.map(g=>g.f.map(n=>`<button class="fp-r" data-a="fpTog" data-v="${n}" data-g="${g.g}" style="--g:${g.c}" aria-pressed="false"><i class="d"></i>${n}<span class="gl">${g.g}</span><span class="k">${FCK}</span></button>`).join('')).join('');
 return `<div class="card fp"><div class="row"><h3 style="margin:0">${title||'How does it feel?'}</h3><span class="muted small" id="fp-n">0 picked</span></div>
 <div class="fp-pk" id="fp-pk"><span class="muted small">Nothing picked yet.</span></div>
 <input class="inp" data-live="fps" placeholder="Search feelings" aria-label="Search feelings" autocomplete="off" style="margin-top:12px">
 <div class="fp-tabs">${['All',...FEEL.map(g=>g.g)].map((g,i)=>{const c=(FEEL.find(x=>x.g===g)||{}).c;return `<button class="fp-t" data-a="fpTab" data-v="${g}" aria-pressed="${i===0}" ${c?`style="--g:${c}"`:''}>${c?'<i></i>':''}${g}</button>`}).join('')}</div>
 <div class="fp-win"><div class="fp-list" id="feel-all" role="group" aria-label="Feelings">${rows}<div class="muted small center" id="fp-none" hidden style="padding:24px 0">No match. Try another word.</div></div><div class="fp-fade"></div></div>
 <p class="muted small center" style="margin:6px 0 0">Scroll for more. Tap to pick.</p></div>`}
function fpFilter(){const q=(($('[data-live="fps"]')||{}).value||'').trim().toLowerCase(),g=R.fpg||'All';let n=0;
 $$('#feel-all .fp-r').forEach(r=>{const ok=(g==='All'||r.dataset.g===g)&&(!q||r.dataset.v.toLowerCase().includes(q)||r.dataset.g.toLowerCase().startsWith(q));r.hidden=!ok;if(ok)n++});
 const e=$('#fp-none');if(e)e.hidden=n>0;const l=$('#feel-all');if(l)l.scrollTop=0}
function fpSync(){const on=$$('#feel-all .fp-r.on');$('#fp-n').textContent=on.length+' picked';
 $('#fp-pk').innerHTML=on.length?on.map(r=>`<button class="fp-c" data-a="fpTog" data-v="${r.dataset.v}" style="--g:${r.style.getPropertyValue('--g')}" aria-label="Remove ${r.dataset.v}"><i></i>${r.dataset.v}<b aria-hidden="true">&times;</b></button>`).join(''):'<span class="muted small">Nothing picked yet.</span>'}
A.fpTog=el=>{const r=$('#feel-all .fp-r[data-v="'+el.dataset.v+'"]');if(!r)return;r.classList.toggle('on');r.setAttribute('aria-pressed',r.classList.contains('on'));fpSync();try{navigator.vibrate&&navigator.vibrate(6)}catch(e){}};
A.fpTab=el=>{R.fpg=el.dataset.v;$$('.fp-t').forEach(b=>b.setAttribute('aria-pressed',b===el));fpFilter()};
PAGES.settings=()=>pageHdr("Settings");
/* ===== boot ===== */
document.addEventListener('input',e=>{const t=e.target,l=t.dataset&&t.dataset.live;if(l==='frv'){const o=$('#frv');if(o)o.textContent=t.value}else if(l==='sl')slLive();else if(l==='fps')fpFilter();else if(l==='pks'){const q=t.value.trim().toLowerCase();$$('.pk-it:not(.none)').forEach(b=>b.hidden=!b.dataset.n.includes(q));$$('.pk-g').forEach(g=>g.hidden=!$$('.pk-it',g).some(b=>!b.hidden))}});
let _sw=null,_swd=0;
document.addEventListener('pointerdown',e=>{const w=e.target.closest&&e.target.closest('.week');_sw=w?{x:e.clientX,y:e.clientY,w,drag:false}:null});
document.addEventListener('pointermove',e=>{if(!_sw)return;const dx=e.clientX-_sw.x,dy=e.clientY-_sw.y;if(!_sw.drag&&Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.3)_sw.drag=true;if(_sw.drag){_sw.w.style.transition='none';_sw.w.style.transform='translateX('+(dx*.85).toFixed(0)+'px)'}});
document.addEventListener('pointerup',e=>{if(!_sw)return;const dx=e.clientX-_sw.x,w=_sw.w,drag=_sw.drag;_sw=null;if(!drag)return;_swd=Date.now();
 const cell=w.clientWidth/7;let n=Math.round(-dx/cell);if(!n&&Math.abs(dx)>20)n=dx<0?1:-1;n=Math.max(-14,Math.min(14,n));
 if(n)shiftDays(n);else{w.style.transition='transform .22s ease';w.style.transform=''}});
document.addEventListener('pointercancel',()=>{if(_sw&&_sw.w){_sw.w.style.transform=''}_sw=null});
document.addEventListener('click',e=>{if(Date.now()-_swd<350&&e.target.closest&&e.target.closest('.week')){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"][data-a]')){e.preventDefault();e.target.click()}});
addEventListener('online',()=>render());addEventListener('offline',()=>render());
applyUI();
$('#pg').innerHTML='<div class="card sk" aria-hidden="true"><i></i><i></i><i class="s"></i></div>'.repeat(3);
let _booted=false;const boot=()=>{if(_booted)return;_booted=true;runFirewood();checkNotes();render(true);lockNow();try{_sig=sigNow()}catch(e){}};
Promise.race([document.fonts?document.fonts.ready:0,new Promise(r=>setTimeout(r,450))]).then(boot,boot);setTimeout(boot,900);
setInterval(()=>tick(),1000);setInterval(checkNotes,60000);
